<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="stylesheet" href="/portal/assets/nocturne.css">
<!--
  The household's front page.

  THE MARKUP IS THE MOCKUP'S. Element for element, class for class, and
  the inline styles that are not in the stylesheet are the ones the
  design canvas carries. The first two attempts at this page ported the
  tokens, then the component classes, while still inventing the
  structure around them — which is why each looked closer and neither
  looked right. A span.eyebrow where the design has one is a different
  page from an <h3> in the same place.

  READING ORDER IS THE DESIGN. Who you are, then what needs you, then
  what you can do quickly, then what the house did, then the apps, and
  last the machines. The launcher is low because it is the part a
  household member already knows how to find; the machines are lower
  because CPU and disk are an owner's concern and a family reads a graph
  of them as a problem they cannot fix.

  THE WIDGETS SIT IN GRIDS OF TWO, and each grid carries the .mlink rows
  for its own pair. Below 720px .wid-hide takes the widgets out and the
  .mlink rows take their place, which is the design's answer to a phone:
  a condensed widget is worse than a door to the real page.

  ONE THING DELIBERATELY LEFT OUT. The theme swatches are in the mockup,
  and §7 says why they should not ship — "shown here for review; in
  production they belong in household settings, not on the dashboard."
  The household's hue is desired state now, so a picker here would
  either not persist or would change the house for everyone from the
  wall tablet. The .theme-strip stays, carrying the search.

  EVERY VALUE IS WRITTEN WITH textContent. Filenames, member names,
  notice titles, household sentences and model replies all come from
  data, some typed by a person and some generated by a model, and none
  is ever concatenated into markup.
-->
<style>
  .page { min-height: 100vh; }
  .bannerwrap {
    position: relative; overflow: hidden; padding: var(--space-8) var(--space-6);
    display: flex; align-items: flex-end; gap: var(--space-6); flex-wrap: wrap;
    min-height: 172px; margin-bottom: var(--space-4);
  }
  .bannerwrap .photo { position: absolute; inset: 0; z-index: 0;
                       background-size: cover; background-position: center; }
  /* The scrim covers the WHOLE band, not just the left: a household
     photo is arbitrary and the design cannot assume it is dark where
     the clock sits. Two stacked gradients, as the canvas has them. */
  .bannerwrap .scrim {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      linear-gradient(90deg, color-mix(in srgb, var(--color-bg) 90%, transparent),
                             color-mix(in srgb, var(--color-bg) 62%, transparent) 60%,
                             color-mix(in srgb, var(--color-bg) 55%, transparent)),
      linear-gradient(0deg, color-mix(in srgb, var(--color-bg) 45%, transparent), transparent 70%);
  }
  .bannerwrap .title { position: relative; z-index: 2; flex: 1; min-width: 220px; }
  .bannerwrap h1 { font-family: var(--font-heading); font-weight: 500; font-size: 26px;
                   letter-spacing: -0.015em; line-height: 1.2; margin: 0 0 var(--space-1); }
  .bannerwrap .sub { font-size: 13px; color: color-mix(in srgb, var(--color-text) 80%, transparent); }
  .clockplate {
    position: relative; z-index: 2; display: flex; align-items: center; gap: var(--space-6);
    padding: var(--space-3) var(--space-4); border-radius: 999px;
    background: color-mix(in srgb, var(--color-bg) 72%, transparent);
    box-shadow: inset 0 0 0 1px var(--hair); backdrop-filter: blur(10px);
  }
  .clockplate .t { font-size: 20px; font-weight: 500; }
  .clockplate .d { font-size: 12px; color: var(--color-text); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
            background: color-mix(in srgb, var(--color-accent) 28%, transparent);
            font-size: 11px; font-weight: 600; }
  .band { padding: var(--space-4) var(--space-6); margin-bottom: var(--space-4);
          display: flex; flex-direction: column; gap: var(--space-3); }
  .bandhead { display: flex; align-items: center; gap: var(--space-3); width: 100%;
              background: none; border: 0; padding: 0; color: inherit; font: inherit;
              cursor: pointer; text-align: left; }
  .bandhead .g { font-size: 15px; font-weight: 500; }
  .needsrow { display: flex; align-items: center; gap: var(--space-3); }
  .indent { padding-left: 23px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--space-4); }
  .secthead { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); }
  .secthead h2 { font-size: 17px; margin: 0; }
  .plate { padding: var(--space-4) var(--space-6); display: flex; flex-direction: column; gap: var(--space-3); }
  @media (max-width: 980px) { .bannerwrap { min-height: 140px; } }
</style>

<main class="page">

  <header class="surface banner bannerwrap">
    <div class="photo" id="photo"></div>
    <div class="scrim"></div>
    <div class="title">
      <h1 id="household">&nbsp;</h1>
      <div class="sub">Everything this household runs</div>
    </div>
    <div class="clockplate">
      <div style="text-align: right">
        <div class="t tnum" id="clock"></div>
        <div class="d tnum" id="date"></div>
      </div>
      <div class="spread">
        <div class="avatar" id="initials" title="Signed in"></div>
        <a class="hbtn hbtn-ghost" href="/logout" style="font-size: 12.5px">Sign out</a>
      </div>
    </div>
  </header>

  <div class="theme-strip" style="margin-bottom: var(--space-4)">
    <div class="search" style="flex: 1; box-shadow: none; background: transparent; border: 0; padding: 0">
      <i class="ph ph-magnifying-glass" style="color: var(--muted)" aria-hidden="true"></i>
      <label class="sr" for="search">Find an app</label>
      <input id="search" type="search" placeholder="Find an app">
      <span class="muted">⌘K</span>
    </div>
  </div>

  <!-- The greeting band. On a good day it collapses to this one line and
       the household is not paying a card's worth of height for an empty
       queue; the summary stays visible when shut, so collapsing never
       hides that something is waiting. -->
  <section class="surface band">
    <button class="bandhead" id="needs-fold" aria-expanded="true" aria-controls="needs-body">
      <span class="g" id="greeting">&nbsp;</span>
      <span class="muted grow" id="needs-sum"></span>
      <i class="ph ph-caret-up" id="needs-caret" aria-hidden="true"></i>
    </button>
    <div id="needs-body"></div>
  </section>

  <!-- Files and Assistant. -->
  <div class="widgets" style="margin-bottom: var(--space-4)">
    <a class="mlink" href="/filedrop/" id="m-files">
      <span class="ic"><i class="ph ph-folder" aria-hidden="true"></i></span>
      <span class="grow"><span style="display:block">Files</span>
        <span class="muted" id="m-files-sub">Add a photo or file</span></span>
      <i class="ph ph-caret-right" aria-hidden="true"></i>
    </a>
    <a class="mlink" href="/assistant/" id="m-assistant">
      <span class="ic"><i class="ph-fill ph-sparkle" aria-hidden="true"></i></span>
      <span class="grow"><span style="display:block">Assistant</span>
        <span class="muted" id="m-assistant-sub">Ask the house for something</span></span>
      <i class="ph ph-caret-right" aria-hidden="true"></i>
    </a>

    <section class="wid wid-hide" id="files-wid" hidden>
      <div class="wid-head">
        <span class="eyebrow">Files</span>
        <span class="pill pill-mute tnum" id="files-ns">&nbsp;</span>
        <span class="fade" aria-hidden="true"></span>
        <a class="hbtn hbtn-ghost" href="/filedrop/">Browse
          <i class="ph ph-arrow-square-out" aria-hidden="true"></i></a>
      </div>
      <div id="files-note"></div>
      <button class="hbtn hbtn-secondary" id="drop" type="button"
              style="flex-direction: column; gap: var(--space-2); padding: var(--space-6) var(--space-4)">
        <i class="ph ph-upload-simple" style="font-size: 20px" aria-hidden="true"></i>
        <span>Drop files here, or choose from this device</span>
        <span class="muted" id="files-limit"></span>
      </button>
      <input id="file-input" type="file" multiple hidden>
      <div class="spread">
        <span class="eyebrow">Recent</span>
        <span class="fade" aria-hidden="true"></span>
      </div>
      <div id="files-recent"></div>
      <div style="margin-top: auto">
        <div class="spread" style="justify-content: space-between">
          <span class="muted">Household storage</span>
          <span class="tnum" id="files-used"></span>
        </div>
        <div class="bar" id="files-bar" style="margin-top: 5px" hidden><span></span></div>
      </div>
    </section>

    <section class="wid wid-hide" id="assistant-wid" hidden>
      <div class="wid-head">
        <span class="eyebrow">Assistant</span>
        <span class="pill pill-mute" id="scope-pill"
              title="This dashboard refuses the machines, apps, accounts, secrets and the control plane's own records, whatever the assistant is allowed elsewhere.">household scope</span>
        <span class="fade" aria-hidden="true"></span>
        <button class="hbtn hbtn-secondary" id="agent-btn" type="button" hidden>
          <span id="agent-name"></span><i class="ph ph-caret-down" id="agent-caret" aria-hidden="true"></i>
        </button>
        <select id="agent-select" class="hbtn hbtn-secondary" hidden aria-label="Which assistant"></select>
      </div>
      <div id="assistant-note"></div>
      <div id="thread" style="display: flex; flex-direction: column; gap: var(--space-4);
                              min-height: 84px; max-height: 240px; overflow-y: auto"></div>
      <div class="asks" id="asks" hidden>
        <button class="hbtn" type="button">What's for dinner tomorrow?</button>
        <button class="hbtn" type="button">Add milk to the shopping list</button>
      </div>
      <div class="composer" style="margin-top: auto">
        <label class="sr" for="ask">Ask the assistant</label>
        <textarea id="ask" rows="1" placeholder="Ask the house for something"></textarea>
        <button class="hbtn hbtn-primary send" id="send" type="button" aria-label="Send">
          <i class="ph ph-arrow-up" aria-hidden="true"></i>
        </button>
      </div>
      <div class="spread">
        <span class="muted grow" id="acts-as"></span>
        <a class="hbtn hbtn-ghost" id="open-conversation" href="/assistant/">Open conversation
          <i class="ph ph-arrow-right" aria-hidden="true"></i></a>
      </div>
    </section>
  </div>

  <!-- Calendar and Today at home. -->
  <div class="widgets" style="margin-bottom: var(--space-4)">
    <a class="mlink" href="/activity/" id="m-calendar">
      <span class="ic"><i class="ph ph-calendar-blank" aria-hidden="true"></i></span>
      <span class="grow"><span style="display:block">Calendar</span>
        <span class="muted" id="m-calendar-sub"></span></span>
      <i class="ph ph-caret-right" aria-hidden="true"></i>
    </a>
    <a class="mlink" href="/activity/" id="m-activity">
      <span class="ic"><i class="ph ph-pulse" aria-hidden="true"></i></span>
      <span class="grow"><span style="display:block">Today at home</span>
        <span class="muted" id="m-activity-sub"></span></span>
      <i class="ph ph-caret-right" aria-hidden="true"></i>
    </a>

    <section class="wid wid-hide">
      <button class="wid-head" id="cal-fold" aria-expanded="false" aria-controls="cal-body"
              style="background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;width:100%">
        <span class="eyebrow">Calendar</span>
        <span class="muted grow" id="cal-sum"></span>
        <i class="ph ph-caret-down" id="cal-caret" aria-hidden="true"></i>
      </button>
      <div id="cal-body" hidden></div>
    </section>

    <section class="wid wid-hide">
      <div class="wid-head">
        <span class="eyebrow">Today at home</span>
        <span class="fade" aria-hidden="true"></span>
        <a class="hbtn hbtn-ghost" href="/activity/">All activity
          <i class="ph ph-arrow-right" aria-hidden="true"></i></a>
      </div>
      <div id="activity"></div>
    </section>
  </div>

  <!-- Notifications. The one widget with no page of its own, so it has
       no .mlink and stays on a phone. -->
  <div class="widgets" style="margin-bottom: var(--space-8)">
    <section class="wid">
      <div class="wid-head">
        <button id="notif-fold" aria-expanded="true" aria-controls="notif-body"
                style="background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;
                       display:flex;align-items:center;gap:var(--space-3);flex:1">
          <span class="eyebrow">Notifications</span>
          <span class="pill pill-mute" id="notif-count" hidden></span>
          <span class="fade" aria-hidden="true"></span>
          <i class="ph ph-caret-up" id="notif-caret" aria-hidden="true"></i>
        </button>
        <button class="hbtn hbtn-ghost" id="notif-clear" type="button" hidden>Clear</button>
      </div>
      <div id="notif-body"></div>
    </section>
  </div>

  <div id="launcher"></div>

  <section style="margin-top: var(--space-8)">
    <div class="secthead">
      <h2>The machines</h2>
      <span class="fade" aria-hidden="true"></span>
    </div>
    <div class="grid2" id="machines"></div>
  </section>

</main>

<script>
(function () {
  "use strict";

  function el(id) { return document.getElementById(id); }
  function text(id, v) { var n = el(id); if (n) { n.textContent = v; } }
  function clear(n) { while (n && n.firstChild) { n.removeChild(n.firstChild); } }
  function make(tag, cls, content) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (content !== undefined && content !== null) { n.textContent = String(content); }
    return n;
  }
  function icon(name, fill) {
    var i = make("i", (fill ? "ph-fill ph-" : "ph ph-") + name);
    i.setAttribute("aria-hidden", "true");
    return i;
  }
  function note(box, kind, title, body) {
    var n = make("div", "note note-" + kind);
    n.appendChild(icon(kind === "bad" ? "warning-circle" : kind === "warn" ? "warning" : "shield-check",
                       kind === "bad"));
    var d = make("div");
    d.appendChild(make("div", null, title));
    if (body) { d.appendChild(make("div", "muted", body)); }
    n.appendChild(d);
    box.appendChild(n);
    return n;
  }
  function bytes(n) {
    if (n === null || n === undefined) { return ""; }
    var u = ["B", "KB", "MB", "GB", "TB"], i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (i === 0 ? n : n.toFixed(n < 10 ? 1 : 0)) + " " + u[i];
  }
  function skeletons(box, n, h) {
    clear(box);
    var wrap = make("div", "stack");
    wrap.style.gap = "var(--space-2)";
    for (var i = 0; i < n; i++) {
      var s = make("span", "sk");
      s.style.height = (h || 14) + "px";
      s.style.width = (58 + (i * 13) % 34) + "%";
      wrap.appendChild(s);
    }
    box.appendChild(wrap);
  }

  function tick() {
    var now = new Date();
    text("clock", now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }));
    text("date", now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" }));
  }
  tick();
  setInterval(tick, 10000);

  function greetingFor(h) {
    if (h < 5) { return "Still up"; }
    if (h < 12) { return "Good morning"; }
    if (h < 18) { return "Good afternoon"; }
    return "Good evening";
  }

  function fold(key, btn, body, caret, openByDefault) {
    var open = openByDefault;
    try {
      var saved = localStorage.getItem("home.fold." + key);
      if (saved !== null) { open = saved === "1"; }
    } catch (e) { /* no storage: the default stands */ }
    function paint() {
      body.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      caret.className = "ph ph-caret-" + (open ? "up" : "down");
    }
    btn.addEventListener("click", function () {
      open = !open;
      try { localStorage.setItem("home.fold." + key, open ? "1" : "0"); } catch (e) {}
      paint();
    });
    paint();
  }

  // Relative times render against the SERVER's instant, so an event
  // reads the same here as on the page the card links to even on a
  // tablet whose clock has drifted.
  var asOf = new Date();
  function ago(iso) {
    if (!iso) { return ""; }
    var d = (asOf - new Date(iso)) / 1000;
    if (d < 60) { return "just now"; }
    if (d < 3600) { return Math.round(d / 60) + "m ago"; }
    if (d < 86400) { return Math.round(d / 3600) + "h ago"; }
    var y = Math.round(d / 86400);
    return y === 1 ? "yesterday" : y + " days ago";
  }
  function since(iso) {
    if (!iso) { return ""; }
    var d = (asOf - new Date(iso)) / 1000;
    if (d < 3600) { return Math.round(d / 60) + "m"; }
    if (d < 86400) { return Math.round(d / 3600) + "h"; }
    return Math.round(d / 86400) + "d";
  }
  function when(iso) {
    return iso ? new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
  }
  function toneColour(t) {
    if (t === "failed") { return "var(--st-bad)"; }
    if (t === "waiting") { return "var(--st-warn)"; }
    if (t === "refused") { return "var(--muted)"; }
    return "var(--st-ok)";
  }

  var member = "";

  // A skeleton in every card that fetches — and deliberately NOT in the
  // backup card, which withholds reassurance rather than claiming the
  // household is safe before it knows.
  skeletons(el("needs-body"), 2);
  skeletons(el("activity"), 4);
  skeletons(el("notif-body"), 3);

  function load() {
    fetch("/api/v1/home/summary", { headers: { accept: "application/json" } })
      .then(function (r) { if (!r.ok) { throw new Error("http " + r.status); } return r.json(); })
      .then(render)
      .catch(function (err) {
        var m = document.querySelector("main");
        clear(m);
        note(m, "bad",
          "Can't reach Wildstone right now, so this page can't tell you what's happening at home.",
          String(err.message || err));
      });
  }

  function render(d) {
    asOf = d.as ? new Date(d.as) : new Date();
    member = d.member || "";
    document.documentElement.style.setProperty("--hue", String(d.accentHue));
    text("household", d.household || "Home");
    text("initials", initialsOf(member));
    el("initials").title = member + " — signed in";
    text("greeting", greetingFor(asOf.getHours()) + (member ? ", " + member : ""));
    document.title = d.household || "Home";
    el("photo").style.backgroundImage = "url('/portal/assets/banner-default.webp')";

    renderNeeds(d.needsYou);
    renderCalendar(d.calendar);
    renderActivity(d.activity);
    renderNotifications(d.notifications);
    renderLauncher(d);
    renderMachines(d.machines);

    // An absent capability draws no card at all: an empty frame with
    // nothing saying why was the bug the framed version shipped.
    var s = d.surfaces || {};
    el("files-wid").hidden = !s.files;
    el("m-files").hidden = !s.files;
    el("assistant-wid").hidden = !s.assistant;
    el("m-assistant").hidden = !s.assistant;
    if (s.files) { loadFiles(); }
    if (s.assistant) { loadAssistant(); }
  }

  function initialsOf(name) {
    if (!name) { return "?"; }
    var p = String(name).trim().split(/[\s._-]+/).filter(Boolean);
    if (!p.length) { return "?"; }
    if (p.length === 1) { return p[0].slice(0, 2).toLowerCase(); }
    return (p[0][0] + p[p.length - 1][0]).toLowerCase();
  }

  // ---- Needs you.
  function renderNeeds(c) {
    var box = el("needs-body");
    clear(box);
    if (!c.available) {
      text("needs-sum", "");
      // Never "nothing to do": silence and all-clear must not look the
      // same.
      note(box, "bad", c.problem || "Can't tell whether anything needs you.");
      return;
    }
    if (!c.items.length) {
      text("needs-sum", "Nothing needs you right now.");
      return;
    }
    var mine = c.items.filter(function (i) { return i.decidable; }).length;
    text("needs-sum", mine ? (mine === 1 ? "1 thing for you" : mine + " things for you")
                           : "waiting on somebody else");
    var stack = make("div", "stack");
    c.items.forEach(function (i) {
      var wrap = make("div", "stack");
      wrap.style.gap = "var(--space-2)";
      var head = make("div", "needsrow");
      var mark = icon(i.decidable ? "question" : "seal-check", i.decidable);
      mark.style.color = i.decidable ? "var(--st-warn)" : "var(--muted)";
      mark.style.fontSize = "17px";
      head.appendChild(mark);
      head.appendChild(make("span", "grow", i.summary));
      if (i.waited) { head.appendChild(make("span", "muted tnum nowrap", "asked " + i.waited + " ago")); }
      if (!i.decidable) { head.appendChild(make("span", "pill pill-mute nowrap", "the owner decides")); }
      wrap.appendChild(head);
      if (i.consequence) { wrap.appendChild(make("div", "muted indent", i.consequence)); }
      // No card shows an action a member lacks authority for: the
      // affordance is absent, never present-and-refused.
      if (i.decidable && i.seq) {
        var row = make("div", "asks indent");
        row.appendChild(decideBtn(i.seq, "yes", "Yes", "hbtn hbtn-primary"));
        row.appendChild(decideBtn(i.seq, "no", "No", "hbtn hbtn-secondary"));
        var why = make("button", "hbtn hbtn-ghost", "Ask the assistant why");
        why.type = "button";
        why.addEventListener("click", function () {
          var t = el("ask");
          if (!t) { return; }
          t.value = "Why is this waiting: " + i.summary;
          el("assistant-wid").scrollIntoView({ behavior: "smooth", block: "center" });
          t.focus();
        });
        row.appendChild(why);
        wrap.appendChild(row);
      }
      stack.appendChild(wrap);
    });
    box.appendChild(stack);
    if (c.more) { box.appendChild(make("div", "muted", "and " + c.more + " more")); }
  }

  function decideBtn(seq, answer, label, cls) {
    var b = make("button", cls, label);
    b.type = "button";
    b.addEventListener("click", function () {
      b.disabled = true;
      fetch("/api/v1/home/notices/answer?seq=" + encodeURIComponent(seq) +
            "&answer=" + encodeURIComponent(answer), { method: "POST" })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok) { throw new Error(res.j.error || "that didn't go through"); }
          load();
        })
        .catch(function (err) {
          b.disabled = false;
          b.parentNode.appendChild(make("span", "muted", String(err.message || err)));
        });
    });
    return b;
  }

  // ---- Calendar. Honest when there is nothing behind it: a card
  // showing invented events on a wall tablet is worse than one that
  // says it cannot read the calendar.
  function renderCalendar(c) {
    var body = el("cal-body");
    clear(body);
    if (c.available) {
      text("cal-sum", "");
      text("m-calendar-sub", "Nothing in the next three days");
      body.appendChild(make("div", "muted", "Nothing in the next three days."));
    } else {
      text("cal-sum", c.problem || "nothing upcoming");
      text("m-calendar-sub", c.problem || "nothing upcoming");
      note(body, "warn", c.problem || "Can't reach the calendars right now");
    }
  }

  // ---- Today at home.
  function renderActivity(c) {
    var box = el("activity");
    clear(box);
    if (!c.available) {
      text("m-activity-sub", c.problem || "Can't load today's activity");
      note(box, "bad", c.problem || "Can't load today's activity.");
      return;
    }
    if (!c.rows.length) {
      text("m-activity-sub", "Nothing yet today");
      box.appendChild(make("div", "muted", "Nothing yet today."));
      return;
    }
    text("m-activity-sub", c.rows.length === 1 ? "1 thing happened today"
                                               : c.rows.length + " things happened today");
    c.rows.forEach(function (r) {
      var row = make("div", "frow");
      var dot = make("span", "dot");
      dot.style.background = toneColour(r.tone);
      row.appendChild(dot);
      row.appendChild(make("span", "nm", r.sentence));
      row.appendChild(make("span", "muted tnum", when(r.at)));
      box.appendChild(row);
    });
  }

  // ---- Notifications. Two rows at a time, so the card's height is
  // fixed whatever the backlog.
  function renderNotifications(c) {
    var body = el("notif-body");
    clear(body);
    if (!c.available) {
      note(body, "warn", c.problem || "Can't reach notifications");
      return;
    }
    if (c.unread) {
      el("notif-count").hidden = false;
      text("notif-count", c.unread + " new");
    }
    if (!c.items.length) {
      body.appendChild(make("div", "muted", "Nothing new."));
      return;
    }
    el("notif-clear").hidden = false;
    var shown = c.items.slice(0, 2), rest = c.items.slice(2);
    shown.forEach(function (n) { body.appendChild(notifRow(n)); });
    if (rest.length) {
      var more = make("button", "hbtn hbtn-ghost", rest.length + " more");
      more.type = "button";
      more.appendChild(icon("caret-down"));
      more.addEventListener("click", function () {
        more.remove();
        rest.forEach(function (n) { body.appendChild(notifRow(n)); });
      });
      body.appendChild(more);
    }
  }

  function notifRow(n) {
    var row = make("div", "frow");
    var dot = make("span", "dot");
    dot.style.background = n.unread ? "var(--color-accent)" : "transparent";
    row.appendChild(dot);
    var d = make("div", "grow");
    d.appendChild(make("div", null, n.title));
    d.appendChild(make("div", "muted", n.source + " · " + ago(n.at)));
    row.appendChild(d);
    return row;
  }

  // Clear marks this member's own notifications read and nobody
  // else's: clearing on the wall tablet must not clear anyone else's
  // phone.
  el("notif-clear").addEventListener("click", function () {
    el("notif-clear").disabled = true;
    fetch("/api/v1/home/notices/clear", { method: "POST" })
      .then(function () { load(); })
      .catch(function () { el("notif-clear").disabled = false; });
  });

  // ---- the launcher.
  var allApps = [], appStatus = {}, statusKnown = true, groupOrder = [];
  // The renderer emits dashboard-icons slugs, and a few Material Design
  // names for things with no logo of their own. Those map onto the
  // glyph font rather than rendering as a broken image.
  var mdiGlyph = {
    "mdi-calendar-month": "calendar-blank",
    "mdi-cloud-upload-outline": "upload-simple",
    "mdi-robot-happy-outline": "sparkle",
    "mdi-application-outline": "squares-four"
  };

  function renderLauncher(d) {
    allApps = d.apps || [];
    appStatus = d.appStatus || {};
    statusKnown = !!d.statusKnown;
    groupOrder = d.groups || [];
    paintLauncher("");
  }

  function paintLauncher(term) {
    var box = el("launcher");
    clear(box);
    term = term.trim().toLowerCase();
    var apps = allApps.filter(function (a) {
      if (!term) { return true; }
      return (a.title + " " + (a.desc || "")).toLowerCase().indexOf(term) >= 0;
    });
    if (!apps.length) {
      // It does not offer a web search. This box searches the
      // household, and silently becoming an internet search box would
      // be a privacy surprise.
      box.appendChild(make("div", "muted", "Nothing here matches " + term));
      return;
    }
    groupOrder.forEach(function (group) {
      var inGroup = apps.filter(function (a) { return a.group === group; });
      // A group with no services is omitted, not shown empty.
      if (!inGroup.length) { return; }
      var sec = make("section");
      sec.style.marginBottom = "var(--space-8)";
      var head = make("div", "secthead");
      head.appendChild(make("h2", null, group));
      if (group === "Admin") {
        head.appendChild(make("span", "muted nowrap", "reachable over the tailnet"));
      } else if (!statusKnown) {
        // Not a grid of red dots, which would read as a total outage.
        head.appendChild(make("span", "muted nowrap", "can't check which apps are up"));
      }
      head.appendChild(make("span", "fade"));
      sec.appendChild(head);
      var grid = make("div", "appgrid");
      inGroup.forEach(function (a) { grid.appendChild(appCard(a)); });
      sec.appendChild(grid);
      box.appendChild(sec);
    });
  }

  function appCard(a) {
    var card = make("a", "appcard");
    card.href = a.href || "#";
    var logo = make("span", "applogo");
    var glyph = mdiGlyph[a.icon];
    if (glyph || !a.icon) {
      var g = icon(glyph || "squares-four");
      g.style.fontSize = "20px";
      g.style.color = "var(--muted)";
      logo.appendChild(g);
    } else {
      var img = document.createElement("img");
      img.src = "/portal/icons/" + encodeURIComponent(a.icon) + ".svg";
      img.alt = "";
      // A slug not in the vendored set would render as a broken image,
      // which looks worse than a plain glyph that never claimed to be
      // the app's own.
      img.addEventListener("error", function () {
        clear(logo);
        var f = icon("squares-four");
        f.style.fontSize = "20px";
        f.style.color = "var(--muted)";
        logo.appendChild(f);
      });
      logo.appendChild(img);
    }
    card.appendChild(logo);

    var t = make("div", "grow");
    t.appendChild(make("div", "appname", a.title));
    var st = statusKnown ? (appStatus[a.route] || "unknown") : "unknown";
    // When red, the description is replaced by the reason: a red dot
    // alone tells a family nothing actionable.
    var sub = make("div", "appdesc", st === "bad" ? "Not answering — retrying" : (a.desc || ""));
    if (st === "bad") { sub.style.color = "var(--st-bad)"; }
    t.appendChild(sub);
    card.appendChild(t);

    var dot = make("span", "dot");
    dot.style.background = st === "ok" ? "var(--st-ok)" : st === "bad" ? "var(--st-bad)" : "var(--muted)";
    card.appendChild(dot);
    return card;
  }

  var search = el("search");
  search.addEventListener("input", function () { paintLauncher(search.value); });
  search.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { search.value = ""; paintLauncher(""); }
    if (e.key === "Enter") {
      var first = document.querySelector("#launcher .appcard");
      if (first) { window.location.href = first.href; }
    }
  });
  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); search.focus(); }
  });

  // ---- the machines. Read-only by design.
  function renderMachines(m) {
    var box = el("machines");
    clear(box);

    var safe = make("div", "surface plate");
    safe.appendChild(make("div", "eyebrow", "Safe to lose a machine"));
    if (!m.available) {
      note(safe, "warn", m.problem || "Can't tell when the last backup was.");
    } else {
      var line = make("div", "spread");
      var shield = icon("shield-check", true);
      shield.style.fontSize = "19px";
      shield.style.color = (m.drillOk || !m.lastDrill) ? "var(--st-ok)" : "var(--st-warn)";
      line.appendChild(shield);
      var d = make("div");
      d.appendChild(make("div", null, m.lastBackup ? "Backed up " + ago(m.lastBackup)
                                                   : "No backup recorded yet"));
      // "No restore proved yet" rather than a reassuring blank.
      d.appendChild(make("div", "muted", !m.lastDrill ? "No restore proved yet"
        : m.drillOk ? "Restore drill passed " + ago(m.lastDrill)
                    : "The last restore drill failed, " + ago(m.lastDrill)));
      line.appendChild(d);
      safe.appendChild(line);
    }
    box.appendChild(safe);

    var machine = make("div", "surface plate");
    // Single-node install: the heading reads "This machine" rather than
    // naming a node, and this card carries no hostnames or addresses.
    machine.appendChild(make("div", "eyebrow", m.nodes > 1 ? "The machines" : "This machine"));
    if (m.metrics && m.metrics.available === false) {
      // The design's three bars are not drawn, because nothing here can
      // source them — and never a bar at zero, which reads as an idle
      // machine rather than a missing reading.
      var line2 = make("div", "spread");
      var pulse = icon("pulse");
      pulse.style.fontSize = "19px";
      pulse.style.color = "var(--muted)";
      line2.appendChild(pulse);
      var d2 = make("div");
      d2.appendChild(make("div", null, m.metrics.problem || "Can't read machine stats"));
      d2.appendChild(make("div", "muted",
        (m.nodes === 1 ? "1 machine" : (m.nodes || 0) + " machines") + ", answering"));
      line2.appendChild(d2);
      machine.appendChild(line2);
    }
    box.appendChild(machine);
  }

  // =============================================================== files
  var filesCaps = null;
  skeletons(el("files-recent"), 3);

  function loadFiles() {
    fetch("/api/v1/filedrop/capabilities", { headers: { accept: "application/json" } })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) { throw new Error(res.j.error || "can't read the files setup"); }
        filesCaps = res.j;
        var ns = (filesCaps.namespaces || [])[0];
        text("files-ns", ns ? "/files/" + ns.key : "");
        text("files-limit", filesCaps.maxUploadBytes ? bytes(filesCaps.maxUploadBytes) + " max" : "");
        // §7: an unknown quota omits the bar rather than drawing it at
        // zero. Nothing reports free space for the namespace yet.
        text("files-used", "not measured yet");
        if (!filesCaps.ready) {
          // The control is disabled with the reason ON it, rather than
          // a button that fails when pressed.
          el("drop").disabled = true;
          note(el("files-note"), "warn",
            "Uploads are paused — the machine that holds the files is offline.",
            "Anything you add now would be lost, so the button is off until it's back.");
        }
        loadRecent();
      })
      .catch(function (err) {
        clear(el("files-recent"));
        note(el("files-note"), "bad", String(err.message || err));
      });
  }

  function loadRecent() {
    fetch("/api/v1/filedrop/recent?limit=4", { headers: { accept: "application/json" } })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        var box = el("files-recent");
        clear(box);
        if (!res.ok) {
          // Never an empty list, which reads as "you have no files".
          note(box, "bad", "Can't reach the files right now");
          return;
        }
        var items = res.j.items || [];
        if (!items.length) {
          box.appendChild(make("div", "muted",
            "No files yet. Anything dropped here lands in the household's shared folder."));
          return;
        }
        items.forEach(function (f) {
          var row = make("div", "frow");
          row.appendChild(icon(fileGlyph(f.name)));
          row.appendChild(make("span", "nm", f.name));
          row.appendChild(make("span", "muted tnum", ago(f.modTime)));
          box.appendChild(row);
        });
        text("m-files-sub", "Add a photo or file · " + items.length + " recent");
      })
      .catch(function () {
        var box = el("files-recent");
        clear(box);
        note(box, "bad", "Can't reach the files right now");
      });
  }

  function fileGlyph(name) {
    var n = String(name).toLowerCase();
    if (/\.(jpe?g|png|heic|gif|webp|avif)$/.test(n)) { return "image"; }
    if (/\.(mp4|mov|mkv|webm)$/.test(n)) { return "video"; }
    if (/\.pdf$/.test(n)) { return "file-pdf"; }
    return "file-text";
  }

  // One affordance, both behaviours: the row is the drop target on a
  // desktop and opens the picker on a phone.
  var drop = el("drop"), fileInput = el("file-input");
  drop.addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function () { upload(fileInput.files); fileInput.value = ""; });
  ["dragenter", "dragover"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.style.borderColor = "var(--color-accent)"; });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.style.borderColor = ""; });
  });
  drop.addEventListener("drop", function (e) {
    if (e.dataTransfer && e.dataTransfer.files) { upload(e.dataTransfer.files); }
  });

  function upload(files) {
    if (!files || !files.length || !filesCaps || !filesCaps.ready) { return; }
    var ns = (filesCaps.namespaces || [{ key: "shared" }])[0].key;
    Array.prototype.forEach.call(files, function (file) {
      // The in-flight row sits at the top of Recent with a determinate
      // bar, and on failure it KEEPS the filename and states the
      // reason, so nothing disappears silently.
      var row = make("div", "frow");
      row.appendChild(icon(fileGlyph(file.name)));
      var mid = make("div", "grow");
      var top = make("div", "spread");
      top.appendChild(make("span", "nm grow", file.name));
      var pct = make("span", "muted tnum", "0%");
      top.appendChild(pct);
      mid.appendChild(top);
      var bar = make("div", "bar");
      var fill = make("span");
      fill.style.width = "0%";
      fill.style.background = "var(--color-accent)";
      bar.appendChild(fill);
      mid.appendChild(bar);
      row.appendChild(mid);
      el("files-recent").insertBefore(row, el("files-recent").firstChild);

      var xhr = new XMLHttpRequest();
      xhr.open("POST", "/api/v1/filedrop/upload?namespace=" + encodeURIComponent(ns) +
                       "&name=" + encodeURIComponent(file.name));
      xhr.setRequestHeader("Content-Type", "application/octet-stream");
      xhr.upload.addEventListener("progress", function (e) {
        if (!e.lengthComputable) { return; }
        var p = Math.round((e.loaded / e.total) * 100);
        pct.textContent = p + "%";
        fill.style.width = p + "%";
      });
      xhr.addEventListener("load", function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          // The row settles into Recent with its real timestamp. No
          // toast.
          loadRecent();
          return;
        }
        var why = "That didn't upload";
        try { why = JSON.parse(xhr.responseText).error || why; } catch (e) {}
        mid.removeChild(bar);
        pct.textContent = "";
        var reason = make("div", "muted", why);
        reason.style.color = "var(--st-bad)";
        mid.appendChild(reason);
        var retry = make("button", "hbtn hbtn-ghost", "Retry");
        retry.type = "button";
        retry.addEventListener("click", function () { row.remove(); upload([file]); });
        top.appendChild(retry);
      });
      xhr.addEventListener("error", function () {
        pct.textContent = "";
        mid.appendChild(make("div", "muted", "the upload was interrupted"));
      });
      xhr.send(file);
    });
  }

  // =========================================================== assistant
  var agents = [], session = "", agent = "";

  function loadAssistant() {
    fetch("/api/v1/assistant/agents", { headers: { accept: "application/json" } })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) { throw new Error(res.j.error || "no assistant is set up yet"); }
        agents = res.j.agents || [];
        text("acts-as", member ? "Acts as " + member + ", inside " + member + "'s own permissions." : "");
        if (!agents.length) {
          el("ask").disabled = true;
          el("send").disabled = true;
          el("thread").appendChild(make("div", "muted",
            "No assistant is set up yet. The owner turns one on, chooses what it may do, " +
            "and it appears here."));
          text("m-assistant-sub", "Not set up yet");
          return;
        }
        agent = agents[0].name;
        // One entry is a label, not a menu.
        if (agents.length === 1) {
          el("agent-btn").hidden = false;
          el("agent-btn").disabled = true;
          el("agent-caret").hidden = true;
          text("agent-name", agent);
        } else {
          var sel = el("agent-select");
          sel.hidden = false;
          agents.forEach(function (a) {
            var o = document.createElement("option");
            o.value = a.name;
            o.textContent = a.name;
            o.title = a.directive || "";
            sel.appendChild(o);
          });
          sel.addEventListener("change", function () {
            // A new agent is a new conversation: "I sent this to Sandy"
            // and "this went to Alfred" must not both be true of one
            // thread.
            agent = sel.value;
            session = "";
            clear(el("thread"));
            el("asks").hidden = false;
          });
        }
        text("m-assistant-sub", "Ask the house for something");
        if (agents.every(function (a) { return !a.reachable; })) {
          note(el("assistant-note"), "warn",
            "It can still answer questions, but the model it uses isn't answering right now — " +
            "so it will say so rather than guess.");
        }
        el("asks").hidden = false;
      })
      .catch(function (err) {
        el("ask").disabled = true;
        el("send").disabled = true;
        note(el("assistant-note"), "bad", String(err.message || err));
      });
  }

  Array.prototype.forEach.call(el("asks").querySelectorAll("button"), function (b) {
    b.addEventListener("click", function () { el("ask").value = b.textContent; el("ask").focus(); });
  });

  function turn(role, body) {
    if (role === "user") { return make("div", "msg-user", body); }
    var wrap = make("div", "turn");
    var mark = make("div", "turn-mark");
    mark.appendChild(icon("sparkle", true));
    wrap.appendChild(mark);
    wrap.appendChild(make("div", "grow", body));
    return wrap;
  }

  function send() {
    var box = el("ask"), body = box.value.trim();
    if (!body || !agent) { return; }
    var thread = el("thread");
    el("asks").hidden = true;
    // The message appears immediately, dimmed: pending is explicit.
    var mine = turn("user", body);
    mine.style.opacity = "0.6";
    thread.appendChild(mine);
    // A line naming what it is doing, because silence reads as a hang.
    var working = make("div", "turn");
    var wm = make("div", "turn-mark");
    wm.appendChild(icon("sparkle", true));
    working.appendChild(wm);
    var wb = make("div", "grow spread");
    var sk = make("span", "sk");
    sk.style.cssText = "height: 12px; width: 64px";
    wb.appendChild(sk);
    wb.appendChild(make("span", "muted", "Thinking…"));
    working.appendChild(wb);
    thread.appendChild(working);
    thread.scrollTop = thread.scrollHeight;
    box.disabled = true;
    el("send").disabled = true;

    fetch("/api/v1/assistant/ask", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ agent: agent, session: session, text: body })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        thread.removeChild(working);
        mine.style.opacity = "";
        if (!res.ok) { throw new Error(res.j.error || "I couldn't answer that one"); }
        session = res.j.session || session;
        // Model output is untrusted display content: rendered as text,
        // never as markup.
        var t = turn("assistant", res.j.reply || "");
        var foot = make("div", "spread");
        foot.style.marginTop = "var(--space-2)";
        foot.appendChild(make("span", "muted tnum", when(new Date().toISOString())));
        t.lastChild.appendChild(foot);
        thread.appendChild(t);
        if (res.j.proposals) {
          thread.appendChild(make("span", "pill pill-warn",
            res.j.proposals === 1 ? "1 thing needs the owner's approval"
                                  : res.j.proposals + " things need the owner's approval"));
        }
        el("open-conversation").href = session
          ? "/assistant/?session=" + encodeURIComponent(session)
          : "/assistant/";
        box.value = "";
      })
      .catch(function (err) {
        // A failed send keeps the typed text.
        mine.style.opacity = "";
        var n = note(el("assistant-note"), "bad", String(err.message || err));
        var again = make("button", "hbtn hbtn-ghost", "Try again");
        again.type = "button";
        again.addEventListener("click", function () { n.remove(); send(); });
        n.appendChild(again);
      })
      .then(function () {
        box.disabled = false;
        el("send").disabled = false;
        thread.scrollTop = thread.scrollHeight;
        box.focus();
      });
  }

  el("send").addEventListener("click", send);
  el("ask").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  fold("needs", el("needs-fold"), el("needs-body"), el("needs-caret"), true);
  fold("cal", el("cal-fold"), el("cal-body"), el("cal-caret"), false);
  fold("notif", el("notif-fold"), el("notif-body"), el("notif-caret"), true);
  load();
})();
</script>
