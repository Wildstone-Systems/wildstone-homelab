apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wildstone-management.serviceAccountName" . }}
  labels:
    {{- include "wildstone-management.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false

