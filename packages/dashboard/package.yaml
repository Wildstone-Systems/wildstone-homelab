# Dashboard capability: Homepage, family-facing behind Authelia
# forward-auth — the reference deployment's family-homepage posture
# (classification family_public, authelia_forward_auth). Replaces the
# hand-maintained homepage instances the scope doc lists as an MVP pain
# point (ADR-W011 A2).
#
# Image digest is REAL, resolved 2026-08-25 via the OCI registry API:
#   ghcr.io/gethomepage/homepage:latest -> sha256:da9dca9e...363d60
apiVersion: wildstone.dev/v1
kind: Package
metadata:
  name: dashboard
  version: 1.0.0
  capability: dashboard
  profile: homepage
params:
  - { name: public_domain, required: true, description: "The domain your services are named under, e.g. home.example.com. Under a tailnet this is a label rather than an address you type.", source: domain }
  - { name: node, required: true, description: "Which machine to install this on.", source: node }
templates:
  - |
    apiVersion: wildstone.dev/v1
    kind: Volume
    metadata: { name: homepage-config, node: "{{ .Params.node }}" }
    spec: { name: homepage-config }
  - |
    apiVersion: wildstone.dev/v1
    kind: Container
    metadata: { name: homepage, node: "{{ .Params.node }}" }
    spec:
      image: "ghcr.io/gethomepage/homepage@sha256:da9dca9ec258c628146bed1445da0853f2b88f0b10bafd97c091de807c363d60"
      env:
        # Homepage refuses any request whose Host it was not told about,
        # so this must name the host a BROWSER will send — not the one
        # the Route declares. Under the tailnet posture those differ: the
        # Route is served at the node's certified name (ADR-W019 A10),
        # and the dashboard holds 443, so a browser omits the port and
        # sends the bare tailnet name.
        #
        # Both are listed rather than switched between. A deployment can
        # be reached at its own hostname and over the tailnet at
        # different times, and a list costs nothing; picking one would
        # make the other a 400 with no clue as to why.
        HOMEPAGE_ALLOWED_HOSTS: "home.{{ .Params.public_domain }}{{ if .Resolved.TailnetHost }},{{ .Resolved.TailnetHost }}{{ end }}"
      mounts:
        - { source: homepage-config, target: /app/config }
        # The service list Keystone renders from the Route set (F55,
        # ADR-W021 A6), bind-mounted OVER the sample file Homepage seeds
        # into its own config volume. A single file rather than the whole
        # directory: Homepage writes its other config there on first run,
        # and a read-only /app/config would stop it starting.
        #
        # Safe to mount a file that Docker would otherwise create as a
        # directory, because managed prereq files are written before any
        # plan step runs — so this exists before the container does.
        - { source: /etc/wildstone/dashboard/services.yaml, target: /app/config/services.yaml, readOnly: true }
      restart: unless-stopped
  - |
    apiVersion: wildstone.dev/v1
    kind: Route
    metadata: { name: home, node: "{{ .Params.node }}" }
    spec:
      host: "home.{{ .Params.public_domain }}"
      upstream: "container/homepage:3000"
      auth: authelia_oidc
      classification: family_public
