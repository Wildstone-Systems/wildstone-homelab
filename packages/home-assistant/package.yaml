# Home Assistant capability, profile "container": Wildstone RUNS Home
# Assistant, for a household that does not already have one. The other
# Home Assistant package in this catalog (home-automation/) is the
# opposite case — an adapter for a Home Assistant that lives elsewhere —
# and the two are separate capabilities on purpose, so installing one
# never replaces the other's resources.
#
# WHAT WORKS, AND WHAT NEEDS THE HOST. Home Assistant runs happily on
# the Wildstone Docker network: the dashboard, automations, cloud
# integrations, MQTT (see mqtt-mosquitto), and Zigbee over the network
# (see zigbee-zigbee2mqtt) all work as shipped. Two things do not,
# and are recorded here rather than left for the operator to discover:
#
#   - USB radios (Zigbee/Z-Wave sticks) need a ContainerSpec.devices
#     field that does not exist yet (the same gap ADR-W013 A2 records
#     for Jellyfin's /dev/dri). Use a network coordinator instead.
#   - mDNS/SSDP discovery of LAN devices (Chromecast, HomeKit, Sonos)
#     needs host networking, which the protocol deliberately does not
#     offer. Most such integrations accept an IP address when asked.
#
# THE ROUTE. Home Assistant runs its own login and its mobile app talks
# to the same URL, so the proxy passes through (auth: none) and the
# Route is family_private — the same posture as ntfy: reachable by the
# household's own devices, with the app's own access control at the
# app layer, and policy-clean off the public class (ADR-W009).
#
# TRUSTING THE PROXY, AND WHY IT IS SEEDED INTO THE SETTINGS STORE.
# Home Assistant refuses a proxied request unless it has been told which
# peers may set X-Forwarded-For, answering 400 with "not set-up for
# reverse proxies". Delivering that setting is harder than it looks, and
# the two obvious ways both fail:
#
#   - A managed ConfigFile mounted alongside the app cannot work. On its
#     first boot Home Assistant migrates any `http:` block out of
#     configuration.yaml into its own settings store and records the
#     migration as done; from then on the YAML is ignored permanently.
#     Anything mounted after that first boot has already missed its turn.
#
#   - Seeding the `http:` block into configuration.yaml does not work
#     either, and fails LATER, which is worse. A migrated YAML block is
#     staged as a PENDING config on trial: unless a person promotes it in
#     the UI within five minutes (AUTO_REVERT_DELAY), Home Assistant
#     reverts to the stable config, restarts, and marks the pending one
#     as failed so it is never applied again. The service works, then
#     silently stops working, with no plan and no event to explain it.
#
# So the settings store itself is seeded, with the proxy trust already in
# `stable` and the YAML migration already marked done. No trial, no
# revert, no human. configuration.yaml deliberately carries NO http:
# block: with the migration marked done, a leftover one only raises a
# "your YAML is being ignored" repair notice.
#
# This does couple the package to Home Assistant's on-disk store shape,
# which is why the image below is digest-pinned and why
# TestSeededHomeAssistantTrustsTheProxy boots THAT image and asserts a
# proxied request survives past the five-minute trial window. If a future
# Home Assistant changes the store, that test fails loudly rather than a
# household discovering it as a 400.
#
# Nothing here asks the operator to do anything, and nothing is guessed:
# the proxy ranges come from .Resolved.ProxyTrustCIDRs.
#
# Image digest is REAL, resolved 2026-09-07 via the OCI registry API:
#   ghcr.io/home-assistant/home-assistant:stable -> sha256:612d7676...2918
apiVersion: wildstone.dev/v1
kind: Package
metadata:
  name: home-assistant
  version: 1.1.2
  capability: home-assistant
  profile: container
requires:
  - { trait: ingress, mode: private }
params:
  - { name: public_domain, required: true, description: "The domain your services are named under, e.g. home.example.com. Under a tailnet this is a label rather than an address you type.", source: domain }
  - { name: hass_subdomain, default: hass, description: "The name this service appears under, e.g. hass." }
  - { name: node, required: true, description: "Which machine to install this on.", source: node }
  - { name: timezone, default: UTC, source: timezone, validate: iana_timezone, description: "Your timezone, e.g. Europe/London." }
policies:
  classifications: [family_private]
  dataSensitivity: high
templates:
  - |
    apiVersion: wildstone.dev/v1
    kind: Secret
    metadata: { name: restic-home-assistant, node: "{{ .Params.node }}" }
    spec: { name: restic-home-assistant }
  - |
    apiVersion: wildstone.dev/v1
    kind: Volume
    metadata: { name: home-assistant-config, node: "{{ .Params.node }}" }
    spec: { name: home-assistant-config }
  - |
    apiVersion: wildstone.dev/v1
    kind: Volume
    metadata: { name: home-assistant-backup-repo, node: "{{ .Params.node }}" }
    spec: { name: home-assistant-backup-repo }
  # The first-run configuration directory. Every file here is what Home
  # Assistant itself would have written (homeassistant/config.py:
  # DEFAULT_CONFIG and _write_default_config), with the http: block added
  # — the one thing that must be present before the first boot.
  #
  # scripts.yaml and scenes.yaml are written "{}" and "[]" rather than
  # the empty files Home Assistant creates, because an empty seed is
  # refused: seeding an empty file would claim the path and stop the app
  # writing its own. The values are the empty mapping and empty list those
  # includes parse to, so the result is identical.
  - |
    apiVersion: wildstone.dev/v1
    kind: SeedFile
    metadata: { name: home-assistant-configuration, node: "{{ .Params.node }}" }
    spec:
      volume: home-assistant-config
      path: configuration.yaml
      content: |
        # Seeded once by Wildstone when this capability was installed.
        # This file is YOURS: edit it freely, Wildstone will not rewrite it.

        # Loads default set of integrations. Do not remove.
        default_config:

        # Load frontend themes from the themes folder
        frontend:
          themes: !include_dir_merge_named themes

        automation: !include automations.yaml
        script: !include scripts.yaml
        scene: !include scenes.yaml

        # No http: block here on purpose. The reverse-proxy trust lives in
        # Home Assistant's settings store, seeded alongside this file;
        # change it in Settings > System > Network.
  - |
    apiVersion: wildstone.dev/v1
    kind: SeedFile
    metadata: { name: home-assistant-http-settings, node: "{{ .Params.node }}" }
    spec:
      volume: home-assistant-config
      path: .storage/http
      # Home Assistant's own settings store for the http integration,
      # written as it writes it. The proxy trust goes straight into
      # "stable" — the confirmed-working slot — with "pending" empty, so
      # there is no trial to promote and nothing to auto-revert.
      # "yaml_migration_done" is already true so the first boot does not
      # try to migrate YAML that deliberately has no http: block.
      content: |
        {
          "version": 2,
          "minor_version": 2,
          "key": "http",
          "data": {
            "stable": {
              "server_port": 8123,
              "cors_allowed_origins": ["https://cast.home-assistant.io"],
              "use_x_forwarded_for": true,
              "trusted_proxies": {{ .Resolved.ProxyTrustCIDRs }},
              "login_attempts_threshold": -1,
              "ip_ban_enabled": true,
              "ssl_profile": "modern",
              "use_x_frame_options": true,
              "created_at": "2026-01-01T00:00:00+00:00",
              "error": null,
              "error_message": null
            },
            "pending": null,
            "yaml_migration_done": true
          }
        }
  - |
    apiVersion: wildstone.dev/v1
    kind: SeedFile
    metadata: { name: home-assistant-version, node: "{{ .Params.node }}" }
    spec:
      volume: home-assistant-config
      path: .HA_VERSION
      # Must match the version of the pinned image below. Home Assistant
      # reads this to decide whether to run a configuration upgrade, and
      # treats the file's ABSENCE as version 0.7.7 — so omitting it would
      # run every migration since 2019 against a directory that was
      # created moments ago.
      content: |
        2026.9.1
  - |
    apiVersion: wildstone.dev/v1
    kind: SeedFile
    metadata: { name: home-assistant-automations, node: "{{ .Params.node }}" }
    spec:
      volume: home-assistant-config
      path: automations.yaml
      content: |
        []
  - |
    apiVersion: wildstone.dev/v1
    kind: SeedFile
    metadata: { name: home-assistant-scripts, node: "{{ .Params.node }}" }
    spec:
      volume: home-assistant-config
      path: scripts.yaml
      content: |
        {}
  - |
    apiVersion: wildstone.dev/v1
    kind: SeedFile
    metadata: { name: home-assistant-scenes, node: "{{ .Params.node }}" }
    spec:
      volume: home-assistant-config
      path: scenes.yaml
      content: |
        []
  - |
    apiVersion: wildstone.dev/v1
    kind: Container
    metadata: { name: home-assistant, node: "{{ .Params.node }}" }
    spec:
      image: "ghcr.io/home-assistant/home-assistant@sha256:612d76760b544cb40b7ba01387fdac964c59a6a550a50a4d30b4773c822d2918"
      env:
        TZ: "{{ .Params.timezone }}"
      mounts:
        - { source: home-assistant-config, target: /config }
      restart: unless-stopped
  - |
    apiVersion: wildstone.dev/v1
    kind: Route
    metadata: { name: hass, node: "{{ .Params.node }}" }
    spec:
      host: "{{ .Params.hass_subdomain }}.{{ .Params.public_domain }}"
      upstream: "container/home-assistant:8123"
      auth: none
      classification: family_private
  # Backup: the config volume holds every automation, dashboard and
  # integration credential the household has set up. Daily.
  - |
    apiVersion: wildstone.dev/v1
    kind: BackupPlan
    metadata: { name: home-assistant, node: "{{ .Params.node }}" }
    spec:
      volumes: [home-assistant-config]
      repository: home-assistant-backup-repo
      passwordSecret: secret/restic-home-assistant
      schedule: daily
      class: important
      retention: { keepDaily: 7, keepWeekly: 4, keepMonthly: 6 }
