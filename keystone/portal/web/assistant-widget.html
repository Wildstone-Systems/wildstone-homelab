<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant</title>
<script>
  // The palette comes from the URL, not from prefers-color-scheme.
  //
  // Homepage frames a widget inside a container it marks scheme-light,
  // so an embedded page that asks the browser which scheme it is in is
  // told "light" while it is drawn on a dark card — dark text on a dark
  // panel, which is how this first went out. Keystone knows the
  // dashboard's theme (it writes settings.yaml) and puts it in the src.
  //
  // Inline and first, so the attribute is set before anything paints.
  (() => {
    const asked = new URLSearchParams(location.search).get("theme");
    document.documentElement.dataset.theme = asked === "light" ? "light" : "dark";
  })();
</script>
<style>
  /* Two palettes, chosen by the data-theme the script above sets. No
     media query anywhere: what this page sits on is decided by the
     dashboard, and the browser's own preference is not that. */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ink: #f8fafc; --dim: #cbd5e1; --line: rgba(226,232,240,.28);
    --surface: rgba(15,23,42,.55); --control: rgba(226,232,240,.14);
    --accent: #7dd3fc; --bad: #fca5a5; --good: #86efac; --me: rgba(125,211,252,.22);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --ink: #0f172a; --dim: #475569; --line: rgba(15,23,42,.22);
    --surface: rgba(255,255,255,.7); --control: rgba(15,23,42,.07);
    --accent: #0369a1; --bad: #b91c1c; --good: #15803d; --me: rgba(3,105,161,.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    /* See the Files widget: an own surface, because Homepage's card is
       translucent and gave the text nothing to sit on. */
    background: var(--surface); color: var(--ink); padding: 11px 13px;
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; gap: 9px; text-align: left;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 14px; font-weight: 700; margin: 0; letter-spacing: .01em; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  select, button, input {
    font: inherit; color: var(--ink); background: var(--control);
    border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px;
  }
  select { max-width: 45%; cursor: pointer; }
  button { cursor: pointer; padding: 5px 12px; }
  button:hover, select:hover { border-color: var(--accent); }
  button[disabled], input[disabled] { opacity: .55; cursor: default; }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; min-height: 40px; }
  .msg { padding: 7px 10px; border-radius: 9px; background: var(--control); white-space: pre-wrap;
         overflow-wrap: anywhere; max-width: 92%; }
  .msg.me { align-self: flex-end; background: var(--me); }
  .msg.pending { color: var(--dim); font-style: italic; }
  #prompt { color: var(--dim); }
  form { display: flex; gap: 6px; }
  #text { flex: 1; min-width: 0; }
  #suggestions { display: flex; flex-wrap: wrap; gap: 5px; }
  #suggestions button { background: none; border: 1px solid var(--line); color: var(--dim);
                        border-radius: 999px; padding: 4px 10px; font-size: 12px; }
  #suggestions button:hover { color: var(--ink); border-color: var(--accent); }
  footer { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  #note { color: var(--dim); font-size: 12px; }
  ::placeholder { color: var(--dim); opacity: 1; }
  #note.bad { color: var(--bad); }
  .cloud { color: var(--dim); font-size: 11px; }
  #mic { display: inline-flex; align-items: center; padding: 5px 8px; }
  /* Red while it is listening (ADR-W042). */
  #mic[data-state="recording"] { color: var(--bad); border-color: var(--bad); }
  [hidden] { display: none !important; }
</style>

<header>
  <h1>Assistant</h1>
  <select id="agent" aria-label="Which assistant"></select>
</header>

<div id="prompt">What can I help with?</div>
<div id="log"></div>

<div id="suggestions"></div>

<form id="ask">
  <input id="text" aria-label="Ask the assistant" placeholder="Ask something…" autocomplete="off" maxlength="4000">
  <button id="mic" type="button" aria-label="Dictate" hidden>
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path>
    </svg>
  </button>
  <button id="send" type="submit">Send</button>
</form>

<footer>
  <span id="note"></span>
  <a id="open" href="/assistant/" target="_blank" rel="noreferrer">Open conversation</a>
</footer>

<script>
(() => {
  const el = (id) => document.getElementById(id);
  const log = el("log"), note = el("note");
  // fresh: the next message starts a new conversation rather than
  // continuing a recent one (set by /new, cleared once it has one).
  let session = "", agents = [], fresh = false;

  const say = (text, bad) => { note.textContent = text || ""; note.className = bad ? "bad" : ""; };

  // ============================================================ dictation
  // The mic button (ADR-W042). It records in the browser, posts the clip
  // to Keystone, and puts the words it gets back into the text box. It
  // never sends anything to the assistant: the person reads what was
  // heard, fixes it, and presses Send like always.
  //
  // The same code is in assistant.html, home.html and
  // assistant-widget.html, because these pages carry their own script
  // (see portal/web.go's policy); change one, change all three.
  //
  // o.button  the mic button          o.input  the text box
  // o.agent() the chosen assistant    o.max()  seconds before it stops itself
  // o.say(message, bad)               where status and errors are shown
  function dictation(o) {
    var rec = null, chunks = [], stream = null, started = 0, timer = null, state = "idle", discard = false;
    // No microphone API, a page not on HTTPS, or a frame the parent did
    // not allow the microphone: the button is never shown, rather than
    // shown and failing when pressed.
    var framedWithout = document.featurePolicy && document.featurePolicy.allowsFeature &&
      !document.featurePolicy.allowsFeature("microphone");
    var supported = !!(window.isSecureContext && window.MediaRecorder && navigator.mediaDevices &&
      navigator.mediaDevices.getUserMedia) && !framedWithout;

    function set(next) {
      state = next;
      var b = o.button;
      b.setAttribute("data-state", next);
      b.setAttribute("aria-pressed", next === "recording" ? "true" : "false");
      b.setAttribute("aria-label", next === "recording" ? "Stop dictating" : "Dictate");
      b.title = next === "recording" ? "Stop and write down what you said" : "Dictate instead of typing";
      b.disabled = next === "working";
    }
    function release() {
      if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    }
    // The first of these the browser can record: Chrome, Edge and
    // Firefox take WebM/Opus, Safari takes MP4. Keystone accepts all of
    // them.
    function pickType() {
      var types = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/mp4"];
      for (var i = 0; i < types.length; i++) {
        if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(types[i])) { return types[i]; }
      }
      return "";
    }
    function micError(err) {
      var n = err && err.name;
      if (n === "NotAllowedError" || n === "SecurityError") {
        return "The microphone is blocked. Allow it for this site in your browser to dictate, or type instead.";
      }
      if (n === "NotFoundError" || n === "OverconstrainedError") { return "No microphone was found on this device."; }
      return "The microphone couldn't start. You can still type.";
    }
    function start() {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
        stream = s;
        chunks = [];
        var type = pickType();
        rec = type ? new MediaRecorder(s, { mimeType: type }) : new MediaRecorder(s);
        rec.ondataavailable = function (e) { if (e.data && e.data.size) { chunks.push(e.data); } };
        rec.onstop = finish;
        rec.start();
        started = Date.now();
        set("recording");
        var max = o.max() || 120;
        o.say("Listening… press the mic again when you're done (up to " +
          (max % 60 ? max + " seconds" : max / 60 + (max === 60 ? " minute" : " minutes")) + ").");
        // Stop just short of the server's limit, so a full-length
        // recording is never refused for a fraction of a second.
        timer = setTimeout(stop, Math.max(1, max - 1) * 1000);
      }).catch(function (err) {
        release();
        set("idle");
        o.say(micError(err), true);
      });
    }
    function stop() {
      clearTimeout(timer);
      if (rec && rec.state !== "inactive") { rec.stop(); }
    }
    function finish() {
      release();
      var seconds = (Date.now() - started) / 1000;
      var blob = new Blob(chunks, { type: (rec && rec.mimeType) || "audio/webm" });
      rec = null;
      chunks = [];
      if (discard) { discard = false; set("idle"); o.say(""); return; }
      if (!blob.size) { set("idle"); o.say("Nothing was recorded. Try again.", true); return; }
      set("working");
      o.say("Writing down what you said…");
      var form = new FormData();
      form.append("agent", o.agent());
      form.append("seconds", seconds.toFixed(1));
      form.append("audio", blob, "dictation");
      fetch("/api/v1/assistant/transcribe", { method: "POST", body: form, headers: { accept: "application/json" } })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok) { throw new Error(res.j.error || "I couldn't make that out. Try again, or type."); }
          var words = String(res.j.text || "").trim();
          var had = o.input.value.trim();
          o.input.value = had ? had + " " + words : words;
          o.input.dispatchEvent(new Event("input", { bubbles: true }));
          o.input.focus();
          o.say("Check what I heard, then send.");
        })
        .catch(function (err) { o.say(String(err.message || err), true); })
        .then(function () { set("idle"); });
    }
    o.button.addEventListener("click", function () {
      if (state === "recording") { stop(); } else if (state === "idle") { start(); }
    });
    set("idle");
    o.button.hidden = true;
    return {
      // show is called whenever the assistant changes: it puts the
      // button up for one that can take dictation, and throws away a
      // recording in progress — words meant for one assistant are not
      // typed into a conversation with another.
      show: function (on) {
        o.button.hidden = !(supported && on);
        if (state === "recording") { discard = true; stop(); }
      }
    };
  }

  let maxDictation = 0;
  const canDictate = (name) => agents.some((a) => a.name === name && a.dictation);
  const dict = dictation({
    button: el("mic"), input: el("text"),
    agent: () => el("agent").value,
    max: () => maxDictation,
    say,
  });

  // textContent, never innerHTML: what comes back is a model's output,
  // and it is displayed as text whatever it contains.
  const add = (role, text, pending) => {
    const div = document.createElement("div");
    div.className = "msg" + (role === "user" ? " me" : "") + (pending ? " pending" : "");
    div.textContent = text;
    log.append(div);
    log.scrollTop = log.scrollHeight;
    el("prompt").hidden = true;
    return div;
  };

  const suggestions = ["Turn on the kitchen lights", "What's for dinner?", "Add milk to the shopping list"];
  const offerSuggestions = () => {
    const box = el("suggestions");
    box.replaceChildren();
    for (const s of suggestions) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = s;
      b.onclick = () => { el("text").value = s; el("ask").requestSubmit(); };
      box.append(b);
    }
  };

  const load = async () => {
    const r = await fetch("/api/v1/assistant/agents", { headers: { accept: "application/json" } });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
    const body = await r.json();
    agents = body.agents || [];
    const select = el("agent");
    select.replaceChildren();
    for (const a of agents) {
      const option = document.createElement("option");
      option.value = a.name;
      option.textContent = a.leavesTheHouse ? a.name + " · cloud" : a.name;
      select.append(option);
    }
    if (!agents.length) {
      el("text").disabled = el("send").disabled = true;
      // What is missing, and — to somebody who can fix it — where. A
      // fresh install arrives here: the widget is installed and no
      // Butler has a model yet.
      const setup = body.setup || {};
      say(setup.message || "No assistant has been shared with you yet", true);
      el("prompt").textContent = "";
      if (setup.console) {
        const a = document.createElement("a");
        a.href = setup.console;
        a.target = "_top";
        a.textContent = "Open the Console → Butlers";
        a.className = "setup-link";
        el("prompt").append(a);
      }
      return;
    }
    const chosen = agents[0];
    maxDictation = body.dictationMaxSeconds || 0;
    dict.show(canDictate(chosen.name));
    if (!chosen.reachable) say(chosen.name + " is not answering right now", true);
    else if (chosen.leavesTheHouse) say("This assistant runs outside the house");
    offerSuggestions();
  };

  el("agent").onchange = () => {
    // A different assistant is a different conversation: continuing one
    // under another name would put one model's words in front of
    // another.
    session = "";
    log.replaceChildren();
    el("prompt").hidden = false;
    const chosen = agents.find((a) => a.name === el("agent").value);
    dict.show(canDictate(el("agent").value));
    if (chosen && !chosen.reachable) say(chosen.name + " is not answering right now", true);
    else say(chosen && chosen.leavesTheHouse ? "This assistant runs outside the house" : "");
  };

  el("ask").onsubmit = async (e) => {
    e.preventDefault();
    const text = el("text").value.trim();
    if (!text) return;
    el("text").value = "";
    el("suggestions").replaceChildren();
    add("user", text);
    const waiting = add("assistant", "thinking…", true);
    el("send").disabled = true;
    say("");
    try {
      const r = await fetch("/api/v1/assistant/ask", {
        method: "POST",
        headers: { "content-type": "application/json", accept: "application/json" },
        body: JSON.stringify({ agent: el("agent").value, session, text, new: fresh }),
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.error || r.statusText);
      if (body.command) {
        // A slash command: answered without the assistant. /new and
        // /resume move which conversation the next message belongs to.
        if (body.newConversation) {
          session = "";
          fresh = true;
          log.replaceChildren();
          add("assistant", body.reply || "");
        } else {
          if (body.session) {
            session = body.session;
            fresh = false;
          }
          waiting.classList.remove("pending");
          waiting.textContent = body.reply || "";
        }
        return;
      }
      session = body.session || session;
      fresh = false;
      waiting.classList.remove("pending");
      waiting.textContent = body.reply || "(no answer)";
      if (body.proposals) {
        say(body.proposals + " change" + (body.proposals === 1 ? "" : "s") + " proposed — an adult has to approve");
      }
    } catch (err) {
      waiting.remove();
      say(String(err.message || err), true);
    } finally {
      el("send").disabled = false;
      el("text").focus();
    }
  };

  load().catch((e) => {
    el("text").disabled = el("send").disabled = true;
    say(String(e.message || e), true);
  });
})();
</script>
