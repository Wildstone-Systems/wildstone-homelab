name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go:
    name: go (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: gofmt
        run: test -z "$(gofmt -l ./wardstone ./keystone ./cli ./testing/e2e)"
      - name: vet
        run: |
          for m in wardstone keystone cli testing/e2e; do (cd "$m" && go vet ./...); done
      - name: build
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          for m in wardstone keystone cli testing/e2e; do (cd "$m" && go build ./...); done
      - name: test
        if: matrix.goarch == 'amd64'
        run: |
          for m in wardstone keystone cli testing/e2e; do (cd "$m" && go test ./...); done
