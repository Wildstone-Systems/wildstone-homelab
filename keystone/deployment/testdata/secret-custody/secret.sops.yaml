apiVersion: v1
kind: Secret
metadata:
  name: example-jwt
  namespace: example-app
type: Opaque
stringData:
  jwt-secret: ENC[AES256_GCM,data:REPLACED-synthetic-payload,iv:REPLACED-synthetic-iv,tag:REPLACED-synthetic-tag,type:str]
sops:
  age:
    - recipient: age1syntheticrecipientnotadeploymentidentity
      enc: |
        -----BEGIN AGE ENCRYPTED FILE-----
        REPLACED-synthetic-age-stanza
        -----END AGE ENCRYPTED FILE-----
  lastmodified: "2026-11-06T00:00:00Z"
  mac: ENC[AES256_GCM,data:REPLACED-synthetic-mac,iv:REPLACED-synthetic-mac-iv,tag:REPLACED-synthetic-mac-tag,type:str]
  encrypted_regex: ^(data|stringData)$
  version: 3.13.3
