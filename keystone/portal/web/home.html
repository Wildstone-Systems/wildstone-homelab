<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="stylesheet" href="/portal/assets/nocturne.css">
<!--
  The household's front page.

  READING ORDER IS THE DESIGN. Who you are, then what needs you, then
  what you can do quickly, then what the house did, then the apps, and
  last the machines. Two things sit lower than an operator would put
  them: the app launcher, because it is the part a household member
  already knows how to find, and machine health, because CPU and disk
  are an owner's concern and a family reads a graph of them as a problem
  they cannot fix.

  THE LOOK IS NOT IN THIS FILE. It is /portal/assets/nocturne.css — the
  token set and the component classes the design was drawn in, served by
  Keystone out of its own binary. The first version of this page
  hand-wrote an approximation of that stylesheet while the real one sat
  unused on disk, and it showed. Classes here (.wid, .appcard, .note,
  .pill, .composer, .drop, .frow) are that file's, not this one's.

  FILES AND ASSISTANT ARE NATIVE, NOT FRAMED. They were iframes of two
  older single-purpose pages built in a different palette, which made
  the two most important cards on the household's own dashboard look
  like somebody else's product. They are ordinary cards now, talking to
  the same /api/v1/filedrop and /api/v1/assistant endpoints the framed
  pages did.

  EVERY VALUE IS WRITTEN WITH textContent. Filenames, member names,
  notice titles, household sentences and model replies all come from
  data, some of it typed by a person and some generated by a model, and
  none of it is ever concatenated into markup.
-->
<style>
  /* Only what is this page's alone. Everything shared is in the
     stylesheet above. */
  .banner {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--space-6); flex-wrap: wrap;
    min-height: 124px; padding: var(--space-8);
    border-radius: var(--radius-lg);
    background:
      linear-gradient(180deg, color-mix(in srgb, var(--color-accent) 14%, transparent), transparent 70%),
      var(--color-surface);
    box-shadow: var(--shadow-sm), inset 0 1px 0 color-mix(in srgb, var(--color-text) 8%, transparent);
    margin-bottom: var(--space-6);
  }
  /* The household background photo is not built yet. When it is, the
     scrim must cover the WHOLE band rather than just the left, and the
     type over it must sit on its own plate: a household photo is
     arbitrary, and the design cannot assume it is dark where the clock
     goes. The clockplate below is already that plate. */
  .banner > * { position: relative; }
  .banner h1 { font-size: 27px; }
  .clockplate {
    display: flex; align-items: baseline; gap: var(--space-4);
    padding: var(--space-3) var(--space-6); border-radius: var(--radius-md);
    background: color-mix(in srgb, var(--color-bg) 55%, transparent);
    backdrop-filter: blur(6px);
  }
  .clockplate .t { font-size: 31px; font-weight: 500; letter-spacing: -0.02em; line-height: 1; }
  .avatar {
    width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center;
    background: color-mix(in srgb, var(--color-accent) 30%, var(--color-surface));
    box-shadow: inset 0 0 0 1px var(--hair); font-size: 12px; letter-spacing: .04em; font-weight: 500;
  }
  /* The greeting band. On a good day this collapses to the single
     header line and the household is not paying a card's worth of
     height for an empty queue. */
  .greet { margin-bottom: var(--space-6); }
  .greet-head { display: flex; align-items: center; gap: var(--space-3); width: 100%;
                background: none; border: 0; padding: 0; color: inherit; font: inherit;
                cursor: pointer; text-align: left; }
  .greet-head h2 { margin: 0; font-size: 19px; }
  .needs { display: flex; flex-direction: column; gap: var(--space-3); margin-top: var(--space-4); }
  .needs-item { display: flex; gap: var(--space-4); padding: var(--space-4);
                border-left: 3px solid var(--muted); border-radius: 0 var(--radius-md) var(--radius-md) 0;
                background: var(--faint); }
  .needs-item.waiting { border-color: var(--st-warn); background: var(--st-warn-bg); }
  .needs-item.failed  { border-color: var(--st-bad);  background: var(--st-bad-bg); }
  .machines { display: flex; gap: var(--space-6); flex-wrap: wrap; }
  .machines > div { flex: 1; min-width: 200px; }
  .meter { display: flex; align-items: center; gap: var(--space-3); font-size: 12.5px; }
  .meter .lbl { width: 62px; color: var(--muted); }
  .meter .bar { flex: 1; }
  /* Recent-file and activity rows share the mockup's .frow. */
  .frow .who { color: var(--muted); font-size: 11.5px; }
  .thread { display: flex; flex-direction: column; gap: var(--space-4); min-height: 96px;
            max-height: 260px; overflow-y: auto; }
  /* The composer is pinned to the bottom edge of the card whatever the
     thread's height, so the place you type does not move as messages
     arrive. */
  #assistant-wid { justify-content: space-between; }
  .ph { font-size: 16px; line-height: 1; }
</style>

<main class="page">

  <section class="banner">
    <div>
      <h1 id="household">&nbsp;</h1>
      <div class="muted">Everything this household runs</div>
    </div>
    <div class="clockplate">
      <div class="t tnum" id="clock"></div>
      <div class="muted tnum" id="date"></div>
    </div>
    <div class="spread">
      <div class="avatar" id="initials"></div>
      <div>
        <div id="member"></div>
        <a href="/logout" class="muted">Sign out</a>
      </div>
    </div>
  </section>

  <div class="search" style="margin-bottom: var(--space-6)">
    <i class="ph ph-magnifying-glass" style="color: var(--muted)" aria-hidden="true"></i>
    <label class="sr" for="search">Find an app</label>
    <input id="search" type="search" placeholder="Find an app">
    <span class="pill pill-mute nowrap">⌘K</span>
  </div>

  <!-- Needs you, as the greeting band. -->
  <section class="greet surface" style="padding: var(--space-6)">
    <button class="greet-head" id="needs-fold" aria-expanded="true" aria-controls="needs-body">
      <h2 id="greeting">&nbsp;</h2>
      <span class="fade" aria-hidden="true"></span>
      <span class="muted" id="needs-sum"></span>
      <i class="ph ph-caret-up" id="needs-caret" aria-hidden="true"></i>
    </button>
    <div id="needs-body"><div class="needs" id="needs"></div></div>
  </section>

  <!-- On a phone the four widgets that have pages of their own collapse
       to these rows, because a condensed widget is worse than a door to
       the real page. .mlink is display:none above 720px. -->
  <nav class="stack" style="margin-bottom: var(--space-6)" aria-label="Sections">
    <a class="mlink" href="/filedrop/" id="m-files">
      <span class="ic"><i class="ph ph-upload-simple" aria-hidden="true"></i></span>
      <span class="grow"><b>Files</b><br><span class="muted" id="m-files-sub">Add a photo or file</span></span>
      <i class="ph ph-caret-right" aria-hidden="true"></i>
    </a>
    <a class="mlink" href="/assistant/" id="m-assistant">
      <span class="ic"><i class="ph ph-sparkle" aria-hidden="true"></i></span>
      <span class="grow"><b>Assistant</b><br><span class="muted" id="m-assistant-sub">Ask the house for something</span></span>
      <i class="ph ph-caret-right" aria-hidden="true"></i>
    </a>
    <a class="mlink" href="/calendar/" id="m-calendar">
      <span class="ic"><i class="ph ph-calendar-blank" aria-hidden="true"></i></span>
      <span class="grow"><b>Calendar</b><br><span class="muted" id="m-calendar-sub"></span></span>
      <i class="ph ph-caret-right" aria-hidden="true"></i>
    </a>
    <a class="mlink" href="/activity/" id="m-activity">
      <span class="ic"><i class="ph ph-pulse" aria-hidden="true"></i></span>
      <span class="grow"><b>Today at home</b><br><span class="muted" id="m-activity-sub"></span></span>
      <i class="ph ph-caret-right" aria-hidden="true"></i>
    </a>
  </nav>

  <div class="widgets" style="margin-bottom: var(--space-6)">

    <!-- Files (#197). Quick upload, not a file manager. -->
    <section class="wid wid-hide" id="files-wid" hidden>
      <div class="wid-head">
        <h3 style="margin:0">Files</h3>
        <span class="pill pill-mute tnum" id="files-ns">&nbsp;</span>
        <span class="fade" aria-hidden="true"></span>
        <a class="hbtn hbtn-ghost" href="/filedrop/" target="_blank" rel="noopener">
          Browse <i class="ph ph-arrow-square-out" aria-hidden="true"></i>
        </a>
      </div>
      <div id="files-note"></div>
      <!-- One affordance: the drop target IS the picker, so a phone taps
           it and a desktop drops on it. The limit is stated on the
           control, not discovered by failing. -->
      <button class="drop" id="drop" type="button">
        <i class="ph ph-upload-simple" style="font-size: 22px; color: var(--muted)" aria-hidden="true"></i>
        <span>Drop files here, or choose from this device</span>
        <span class="muted" id="files-limit"></span>
      </button>
      <input id="file-input" type="file" multiple hidden>
      <div class="eyebrow">Recent</div>
      <div id="files-recent"></div>
      <div class="stack" style="gap: var(--space-2); margin-top: auto">
        <div class="spread"><span class="muted grow">Household storage</span>
          <span class="muted tnum" id="files-used"></span></div>
        <div class="bar" id="files-bar" hidden><span></span></div>
      </div>
    </section>

    <!-- Assistant (#198). A short conversational entry point, bounded
         by the dashboard's connection scope. -->
    <section class="wid wid-hide" id="assistant-wid" hidden>
      <div class="wid-head">
        <h3 style="margin:0">Assistant</h3>
        <span class="pill pill-mute" id="scope-pill"
              title="This surface cannot reach infrastructure, packages, identity, secrets, nodes or policy, whatever the assistant is allowed elsewhere.">household scope</span>
        <span class="fade" aria-hidden="true"></span>
        <span class="muted" id="agent-label"></span>
        <select id="agent-select" class="hbtn hbtn-secondary" hidden aria-label="Which assistant"></select>
      </div>
      <div id="assistant-note"></div>
      <div class="thread" id="thread"></div>
      <div class="asks" id="asks" hidden>
        <button class="hbtn" type="button">What's for dinner tomorrow?</button>
        <button class="hbtn" type="button">Add milk to the shopping list</button>
        <button class="hbtn" type="button">What did the house do today?</button>
      </div>
      <div class="stack" style="gap: var(--space-3)">
        <div class="composer">
          <label class="sr" for="ask">Ask the assistant</label>
          <textarea id="ask" rows="1" placeholder="Ask the house for something"></textarea>
          <button class="hbtn hbtn-primary send" id="send" type="button" aria-label="Send">
            <i class="ph ph-paper-plane-tilt" aria-hidden="true"></i>
          </button>
        </div>
        <div class="spread">
          <span class="muted grow" id="acts-as"></span>
          <a class="hbtn hbtn-ghost" id="open-conversation" href="/assistant/">Open conversation</a>
        </div>
      </div>
    </section>

    <!-- Calendar. Read-only, collapsible. -->
    <section class="wid wid-hide">
      <button class="wid-head" id="cal-fold" aria-expanded="false" aria-controls="cal-body"
              style="background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;width:100%">
        <h3 style="margin:0">Calendar</h3>
        <span class="fade" aria-hidden="true"></span>
        <span class="muted" id="cal-sum"></span>
        <i class="ph ph-caret-down" id="cal-caret" aria-hidden="true"></i>
      </button>
      <div id="cal-body" hidden></div>
    </section>

    <!-- Today at home. This card reports; it does not ask. -->
    <section class="wid wid-hide">
      <div class="wid-head">
        <h3 style="margin:0">Today at home</h3>
        <span class="fade" aria-hidden="true"></span>
        <a class="hbtn hbtn-ghost" href="/activity/">All activity</a>
      </div>
      <div id="activity"></div>
    </section>

    <!-- Notifications. Two rows at a time, so the card's height is
         fixed whatever the backlog. -->
    <section class="wid">
      <button class="wid-head" id="notif-fold" aria-expanded="true" aria-controls="notif-body"
              style="background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;width:100%">
        <h3 style="margin:0">Notifications</h3>
        <span class="fade" aria-hidden="true"></span>
        <span class="muted" id="notif-sum"></span>
        <i class="ph ph-caret-up" id="notif-caret" aria-hidden="true"></i>
      </button>
      <div id="notif-body"></div>
    </section>

  </div>

  <div id="launcher"></div>

  <section style="margin-top: var(--space-8)">
    <div class="wid-head" style="margin-bottom: var(--space-4)">
      <h3 style="margin:0">The machines</h3>
      <span class="fade" aria-hidden="true"></span>
    </div>
    <div class="surface" style="padding: var(--space-6)">
      <div class="machines" id="machines"></div>
    </div>
  </section>

</main>

<script>
(function () {
  "use strict";

  function el(id) { return document.getElementById(id); }
  function text(id, v) { var n = el(id); if (n) { n.textContent = v; } }
  function clear(n) { while (n && n.firstChild) { n.removeChild(n.firstChild); } }
  // Every node this page creates goes through here, so no value from the
  // API is ever parsed as markup.
  function make(tag, cls, content) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (content !== undefined && content !== null) { n.textContent = String(content); }
    return n;
  }
  function icon(name) {
    var i = make("i", "ph ph-" + name);
    i.setAttribute("aria-hidden", "true");
    return i;
  }

  // ---- the clock. Client-side, and the one thing on this page that
  // cannot fail, because nothing is fetched to render it.
  function tick() {
    var now = new Date();
    text("clock", now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }));
    text("date", now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" }));
  }
  tick();
  setInterval(tick, 10000);

  function greetingFor(hour) {
    if (hour < 5) { return "Still up"; }
    if (hour < 12) { return "Good morning"; }
    if (hour < 18) { return "Good afternoon"; }
    return "Good evening";
  }

  // ---- collapsible cards, remembered per browser.
  //
  // localStorage rather than a server preference: it is a per-viewer
  // convenience, not household state. It can throw (a private window,
  // blocked site data), so every access is guarded and the default
  // stands when it does.
  function fold(key, btn, body, caret, openByDefault) {
    var open = openByDefault;
    try {
      var saved = localStorage.getItem("home.fold." + key);
      if (saved !== null) { open = saved === "1"; }
    } catch (e) { /* no storage: the default stands */ }
    function paint() {
      body.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      caret.className = "ph ph-caret-" + (open ? "up" : "down");
    }
    btn.addEventListener("click", function () {
      open = !open;
      try { localStorage.setItem("home.fold." + key, open ? "1" : "0"); } catch (e) {}
      paint();
    });
    paint();
  }

  // ---- relative time, rendered against the SERVER's instant.
  //
  // `as` is the one timestamp every section was built against. Using it
  // rather than the browser's clock is what makes an event read the same
  // here as on the page the card links to, even on a tablet whose clock
  // has drifted.
  var asOf = new Date();
  function ago(iso) {
    if (!iso) { return ""; }
    var d = (asOf - new Date(iso)) / 1000;
    if (d < 60) { return "just now"; }
    if (d < 3600) { var m = Math.round(d / 60); return m + (m === 1 ? " min ago" : " mins ago"); }
    if (d < 86400) { var h = Math.round(d / 3600); return h + (h === 1 ? " hour ago" : " hours ago"); }
    var y = Math.round(d / 86400); return y === 1 ? "yesterday" : y + " days ago";
  }
  function when(iso) {
    if (!iso) { return ""; }
    return new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }
  function bytes(n) {
    if (n === null || n === undefined) { return ""; }
    var u = ["B", "KB", "MB", "GB", "TB"], i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (i === 0 ? n : n.toFixed(n < 10 ? 1 : 0)) + " " + u[i];
  }

  function fail(box, message) {
    clear(box);
    var n = make("div", "note note-warn");
    n.appendChild(icon("warning"));
    n.appendChild(make("span", null, message));
    box.appendChild(n);
  }

  // ================================================================ home
  var member = "";

  function load() {
    fetch("/api/v1/home/summary", { headers: { accept: "application/json" } })
      .then(function (r) { if (!r.ok) { throw new Error("http " + r.status); } return r.json(); })
      .then(render)
      .catch(function (err) {
        // The whole page failed, which is the one case where a single
        // sentence is the right answer. It says what is not known
        // rather than showing empty cards that would read as a quiet
        // house.
        var m = document.querySelector("main");
        clear(m);
        var n = make("div", "note note-bad");
        n.appendChild(icon("warning-circle"));
        n.appendChild(make("span", null,
          "Can't reach Wildstone right now, so this page can't tell you what's happening at home."));
        m.appendChild(n);
        m.appendChild(make("p", "muted", String(err.message || err)));
      });
  }

  function render(d) {
    asOf = d.as ? new Date(d.as) : new Date();
    member = d.member || "";
    document.documentElement.style.setProperty("--hue", String(d.accentHue));
    text("household", d.household || "Home");
    text("member", member);
    text("initials", initialsOf(member));
    text("greeting", greetingFor(new Date(asOf).getHours()) + (member ? ", " + member : ""));
    document.title = d.household || "Home";
    renderNeeds(d.needsYou);
    renderCalendar(d.calendar);
    renderActivity(d.activity);
    renderNotifications(d.notifications);
    renderLauncher(d);
    renderMachines(d.machines);

    // The two acting surfaces. An absent capability draws no card at
    // all: an empty frame with nothing saying why was the bug the old
    // iframe version shipped.
    var s = d.surfaces || {};
    el("files-wid").hidden = !s.files;
    el("m-files").hidden = !s.files;
    el("assistant-wid").hidden = !s.assistant;
    el("m-assistant").hidden = !s.assistant;
    if (s.files) { loadFiles(); }
    if (s.assistant) { loadAssistant(); }
  }

  function initialsOf(name) {
    if (!name) { return "?"; }
    var parts = String(name).trim().split(/[\s._-]+/).filter(Boolean);
    if (!parts.length) { return "?"; }
    if (parts.length === 1) { return parts[0].slice(0, 2).toUpperCase(); }
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  // ---- Needs you.
  function renderNeeds(c) {
    var box = el("needs");
    clear(box);
    if (!c.available) {
      text("needs-sum", "");
      // Never "nothing to do": silence and all-clear must not look the
      // same.
      fail(box, c.problem || "Can't tell whether anything needs you.");
      return;
    }
    if (!c.items.length) {
      // The good day: the band is the greeting plus one line, and no
      // card's worth of height.
      text("needs-sum", "Nothing needs you right now.");
      return;
    }
    var mine = c.items.filter(function (i) { return i.decidable; }).length;
    text("needs-sum", mine ? (mine === 1 ? "1 thing for you" : mine + " things for you")
                           : "waiting on somebody else");
    c.items.forEach(function (i) {
      var wrap = make("div", "needs-item " + (i.tone || ""));
      var b = make("div", "grow");
      b.appendChild(make("div", null, i.summary));
      var who = "waiting on " + i.waitingOn;
      if (i.waited) { who += " · " + i.waited; }
      if (!i.decidable) { who += " · the owner decides"; }
      b.appendChild(make("div", "muted", who));
      if (i.consequence) { b.appendChild(make("div", "muted", i.consequence)); }
      // No card shows an action a member lacks authority for: the
      // affordance is absent, never present-and-refused.
      if (i.decidable && i.seq) {
        var row = make("div", "asks");
        row.style.marginTop = "var(--space-3)";
        row.appendChild(decideBtn(i.seq, "yes", "Yes", "hbtn hbtn-primary"));
        row.appendChild(decideBtn(i.seq, "no", "No", "hbtn hbtn-secondary"));
        var askWhy = make("button", "hbtn", "Ask the assistant why");
        askWhy.type = "button";
        askWhy.addEventListener("click", function () {
          var t = el("ask");
          if (!t) { return; }
          t.value = "Why is this waiting: " + i.summary;
          el("assistant-wid").scrollIntoView({ behavior: "smooth", block: "center" });
          t.focus();
        });
        row.appendChild(askWhy);
        b.appendChild(row);
      }
      wrap.appendChild(b);
      box.appendChild(wrap);
    });
    if (c.more) { box.appendChild(make("div", "muted", "and " + c.more + " more")); }
  }

  function decideBtn(seq, answer, label, cls) {
    var b = make("button", cls, label);
    b.type = "button";
    b.addEventListener("click", function () {
      b.disabled = true;
      fetch("/api/v1/home/notices/answer?seq=" + encodeURIComponent(seq) +
            "&answer=" + encodeURIComponent(answer), { method: "POST" })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok) { throw new Error(res.j && res.j.error ? res.j.error : "that didn't go through"); }
          load();
        })
        .catch(function (err) {
          b.disabled = false;
          b.parentNode.appendChild(make("span", "muted", String(err.message || err)));
        });
    });
    return b;
  }

  // ---- Calendar. Honest when there is nothing behind it: a card
  // showing invented events on a wall tablet is worse than one that
  // says it cannot read the calendar.
  function renderCalendar(c) {
    var body = el("cal-body");
    clear(body);
    if (c.available) {
      text("cal-sum", "");
      text("m-calendar-sub", "Nothing in the next three days");
      body.appendChild(make("p", "muted", "Nothing in the next three days."));
    } else {
      text("cal-sum", c.problem || "nothing upcoming");
      text("m-calendar-sub", c.problem || "nothing upcoming");
      fail(body, c.problem || "Can't reach the calendars right now");
    }
  }

  // ---- Today at home.
  function renderActivity(c) {
    var box = el("activity");
    clear(box);
    if (!c.available) {
      text("m-activity-sub", c.problem || "Can't load today's activity");
      fail(box, c.problem || "Can't load today's activity.");
      return;
    }
    if (!c.rows.length) {
      text("m-activity-sub", "Nothing yet today");
      box.appendChild(make("p", "muted", "Nothing yet today."));
      return;
    }
    text("m-activity-sub", c.rows.length === 1 ? "1 thing happened today"
                                               : c.rows.length + " things happened today");
    c.rows.forEach(function (r) {
      var row = make("div", "frow");
      var dot = make("span", "dot");
      dot.style.background = toneColour(r.tone);
      row.appendChild(dot);
      row.appendChild(make("span", "nm", r.sentence));
      row.appendChild(make("span", "muted tnum nowrap", when(r.at)));
      box.appendChild(row);
    });
  }

  function toneColour(tone) {
    if (tone === "failed") { return "var(--st-bad)"; }
    if (tone === "waiting") { return "var(--st-warn)"; }
    if (tone === "refused") { return "var(--muted)"; }
    return "var(--st-ok)";
  }

  // ---- Notifications.
  function renderNotifications(c) {
    var body = el("notif-body");
    clear(body);
    if (!c.available) {
      text("notif-sum", "");
      fail(body, c.problem || "Can't reach notifications");
      return;
    }
    text("notif-sum", c.unread ? c.unread + " new" : "Nothing new.");
    if (!c.items.length) {
      body.appendChild(make("p", "muted", "Nothing new."));
      return;
    }
    var shown = c.items.slice(0, 2), rest = c.items.slice(2);
    shown.forEach(function (n) { body.appendChild(notifRow(n)); });
    var tail = make("div", "spread");
    tail.style.marginTop = "var(--space-3)";
    if (rest.length) {
      var more = make("button", "hbtn hbtn-secondary", rest.length + " more");
      more.type = "button";
      more.addEventListener("click", function () {
        tail.removeChild(more);
        rest.forEach(function (n) { body.insertBefore(notifRow(n), tail); });
      });
      tail.appendChild(more);
    }
    tail.appendChild(make("span", "grow"));
    // Clear marks this member's own notifications read and nobody
    // else's: clearing on the wall tablet must not clear anyone else's
    // phone.
    var clr = make("button", "hbtn hbtn-ghost", "Clear");
    clr.type = "button";
    clr.addEventListener("click", function () {
      clr.disabled = true;
      fetch("/api/v1/home/notices/clear", { method: "POST" })
        .then(function () { load(); })
        .catch(function () { clr.disabled = false; });
    });
    tail.appendChild(clr);
    body.appendChild(tail);
  }

  function notifRow(n) {
    var row = make("div", "frow");
    var dot = make("span", "dot");
    dot.style.background = n.unread ? "var(--color-accent)" : "transparent";
    row.appendChild(dot);
    var t = make("span", "nm", n.title);
    if (!n.unread) { t.className = "nm muted"; }
    row.appendChild(t);
    row.appendChild(make("span", "muted nowrap", n.source));
    row.appendChild(make("span", "muted tnum nowrap", ago(n.at)));
    return row;
  }

  // ---- the launcher.
  var allApps = [], appStatus = {}, statusKnown = true, groupOrder = [];
  // The renderer emits dashboard-icons slugs, and a few Material Design
  // names for the things that have no logo of their own. Those map onto
  // the glyph font rather than rendering as a broken image.
  var mdiGlyph = {
    "mdi-calendar-month": "calendar-blank",
    "mdi-cloud-upload-outline": "upload-simple",
    "mdi-robot-happy-outline": "sparkle",
    "mdi-application-outline": "squares-four"
  };

  function renderLauncher(d) {
    allApps = d.apps || [];
    appStatus = d.appStatus || {};
    statusKnown = !!d.statusKnown;
    groupOrder = d.groups || [];
    paintLauncher("");
  }

  function paintLauncher(term) {
    var box = el("launcher");
    clear(box);
    term = term.trim().toLowerCase();
    var apps = allApps.filter(function (a) {
      if (!term) { return true; }
      return (a.title + " " + (a.desc || "")).toLowerCase().indexOf(term) >= 0;
    });
    if (!apps.length) {
      // It does not offer a web search. This box searches the
      // household, and silently becoming an internet search box would
      // be a privacy surprise.
      box.appendChild(make("p", "muted", "Nothing here matches " + term));
      return;
    }
    if (!statusKnown) {
      // Not a grid of red dots, which would read as a total outage.
      var n = make("div", "note note-info");
      n.appendChild(icon("warning"));
      n.appendChild(make("span", null, "Can't check which apps are up"));
      n.style.marginBottom = "var(--space-4)";
      box.appendChild(n);
    }
    groupOrder.forEach(function (group) {
      var inGroup = apps.filter(function (a) { return a.group === group; });
      // A group with no services is omitted, not shown empty.
      if (!inGroup.length) { return; }
      var sec = make("section");
      sec.style.marginBottom = "var(--space-6)";
      var head = make("div", "wid-head");
      head.style.marginBottom = "var(--space-3)";
      head.appendChild(make("h3", null, group));
      head.appendChild(make("span", "fade"));
      if (group === "Admin") {
        head.appendChild(make("span", "muted nowrap", "reachable over the tailnet"));
      }
      sec.appendChild(head);
      var grid = make("div", "appgrid");
      inGroup.forEach(function (a) { grid.appendChild(appCard(a)); });
      sec.appendChild(grid);
      box.appendChild(sec);
    });
  }

  function appCard(a) {
    var card = make("a", "appcard");
    card.href = a.href || "#";
    var logo = make("span", "applogo");
    var glyph = mdiGlyph[a.icon];
    if (glyph || !a.icon) {
      logo.appendChild(icon(glyph || "squares-four"));
      logo.firstChild.style.color = "var(--muted)";
      logo.firstChild.style.fontSize = "20px";
    } else {
      var img = document.createElement("img");
      img.src = "/portal/icons/" + encodeURIComponent(a.icon) + ".svg";
      img.alt = "";
      // A slug that is not in the vendored set would otherwise render as
      // a broken image, which looks worse than a plain glyph that was
      // never claimed to be the app's own.
      img.addEventListener("error", function () {
        clear(logo);
        var f = icon("squares-four");
        f.style.color = "var(--muted)";
        f.style.fontSize = "20px";
        logo.appendChild(f);
      });
      logo.appendChild(img);
    }
    card.appendChild(logo);

    var t = make("div", "grow");
    t.appendChild(make("div", "appname", a.title));
    var st = statusKnown ? (appStatus[a.route] || "unknown") : "unknown";
    // When red, the description is replaced by the reason: a red dot
    // alone tells a family nothing actionable.
    var sub = make("div", "appdesc", st === "bad" ? "Not answering — retrying" : (a.desc || ""));
    if (st === "bad") { sub.style.color = "var(--st-bad)"; }
    t.appendChild(sub);
    card.appendChild(t);

    var dot = make("span", "dot");
    dot.style.background = st === "ok" ? "var(--st-ok)" : st === "bad" ? "var(--st-bad)" : "var(--muted)";
    card.appendChild(dot);
    return card;
  }

  var search = el("search");
  search.addEventListener("input", function () { paintLauncher(search.value); });
  search.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { search.value = ""; paintLauncher(""); }
    if (e.key === "Enter") {
      var first = document.querySelector("#launcher .appcard");
      if (first) { window.location.href = first.href; }
    }
  });
  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); search.focus(); }
  });

  // ---- the machines. Read-only by design.
  function renderMachines(m) {
    var box = el("machines");
    clear(box);

    var safe = make("div");
    safe.appendChild(make("div", "eyebrow", "Safe to lose a machine"));
    if (!m.available) {
      fail(safe, m.problem || "Can't tell when the last backup was.");
    } else {
      safe.appendChild(make("div", null, m.lastBackup ? "Backed up " + ago(m.lastBackup)
                                                      : "No backup recorded yet"));
      // "No restore proved yet" rather than a reassuring blank.
      if (!m.lastDrill) {
        safe.appendChild(make("div", "muted", "No restore proved yet"));
      } else if (m.drillOk) {
        safe.appendChild(make("div", "muted", "Restore drill passed " + ago(m.lastDrill)));
      } else {
        var bad = make("div", null, "The last restore drill failed, " + ago(m.lastDrill));
        bad.style.color = "var(--st-bad)";
        safe.appendChild(bad);
      }
    }
    box.appendChild(safe);

    var machine = make("div");
    // Single-node install: the heading reads "This machine" rather than
    // naming a node, and this card carries no hostnames or addresses.
    machine.appendChild(make("div", "eyebrow", m.nodes > 1 ? "The machines" : "This machine"));
    if (m.metrics && m.metrics.available === false) {
      // Never a bar at zero, which reads as an idle machine rather than
      // a missing reading.
      machine.appendChild(make("div", "muted", m.metrics.problem || "Can't read machine stats"));
    }
    if (m.nodes) {
      machine.appendChild(make("div", "muted", m.nodes === 1 ? "1 machine" : m.nodes + " machines"));
    }
    box.appendChild(machine);
  }

  // =============================================================== files
  var filesCaps = null;

  function loadFiles() {
    fetch("/api/v1/filedrop/capabilities", { headers: { accept: "application/json" } })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) { throw new Error(res.j.error || "can't read the files setup"); }
        filesCaps = res.j;
        var ns = (filesCaps.namespaces || [])[0];
        text("files-ns", ns ? "/files/" + ns.key : "");
        text("files-limit", filesCaps.maxUploadBytes
          ? bytes(filesCaps.maxUploadBytes) + " max" : "");
        // §7: an unknown quota omits the bar rather than drawing it at
        // zero, which would read as an empty disk. Nothing reports free
        // space for the household namespace yet, so this says so.
        text("files-used", "not measured yet");
        text("m-files-sub", "Add a photo or file");
        if (!filesCaps.ready) {
          // The control is disabled with the reason ON it, rather than
          // a button that fails when pressed.
          el("drop").disabled = true;
          fail(el("files-note"),
            "Uploads are paused — the machine that holds the files is offline. " +
            "Anything you add now would be lost.");
        }
        loadRecent();
      })
      .catch(function (err) { fail(el("files-note"), String(err.message || err)); });
  }

  function loadRecent() {
    fetch("/api/v1/filedrop/recent?limit=5", { headers: { accept: "application/json" } })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        var box = el("files-recent");
        clear(box);
        if (!res.ok) {
          // Never an empty list, which would read as "you have no files".
          fail(box, "Can't reach the files right now");
          return;
        }
        var items = res.j.items || [];
        if (!items.length) {
          box.appendChild(make("p", "muted",
            "No files yet. Anything dropped here lands in the household's shared folder."));
          return;
        }
        items.forEach(function (f) {
          var row = make("div", "frow");
          row.appendChild(icon(fileGlyph(f.name)));
          row.appendChild(make("span", "nm", f.name));
          row.appendChild(make("span", "muted tnum nowrap", bytes(f.size)));
          row.appendChild(make("span", "muted tnum nowrap", ago(f.modTime)));
          box.appendChild(row);
        });
        text("m-files-sub", items.length + (items.length === 1 ? " recent file" : " recent files"));
      })
      .catch(function () { fail(el("files-recent"), "Can't reach the files right now"); });
  }

  function fileGlyph(name) {
    var n = String(name).toLowerCase();
    if (/\.(jpe?g|png|heic|gif|webp|avif)$/.test(n)) { return "image"; }
    if (/\.(mp4|mov|mkv|webm)$/.test(n)) { return "video"; }
    if (/\.pdf$/.test(n)) { return "file-pdf"; }
    return "file-text";
  }

  // One affordance, both behaviours: the row is the drop target on a
  // desktop and opens the picker on a phone.
  var drop = el("drop"), fileInput = el("file-input");
  drop.addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function () { upload(fileInput.files); fileInput.value = ""; });
  ["dragenter", "dragover"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.style.borderColor = "var(--color-accent)"; });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.style.borderColor = ""; });
  });
  drop.addEventListener("drop", function (e) {
    if (e.dataTransfer && e.dataTransfer.files) { upload(e.dataTransfer.files); }
  });

  function upload(files) {
    if (!files || !files.length || !filesCaps || !filesCaps.ready) { return; }
    var ns = (filesCaps.namespaces || [{ key: "shared" }])[0].key;
    Array.prototype.forEach.call(files, function (file) {
      // The in-flight row sits at the top of Recent with a determinate
      // bar, and on failure it KEEPS the filename and states the reason,
      // so nothing disappears silently.
      var row = make("div", "frow");
      row.appendChild(icon(fileGlyph(file.name)));
      row.appendChild(make("span", "nm", file.name));
      var pct = make("span", "muted tnum nowrap", "0%");
      row.appendChild(pct);
      var bar = make("span", "bar");
      bar.style.width = "64px";
      var fill = make("span");
      fill.style.width = "0%";
      fill.style.background = "var(--color-accent)";
      bar.appendChild(fill);
      row.appendChild(bar);
      el("files-recent").insertBefore(row, el("files-recent").firstChild);

      var xhr = new XMLHttpRequest();
      xhr.open("POST", "/api/v1/filedrop/upload?namespace=" + encodeURIComponent(ns) +
                       "&name=" + encodeURIComponent(file.name));
      xhr.setRequestHeader("Content-Type", "application/octet-stream");
      xhr.upload.addEventListener("progress", function (e) {
        if (!e.lengthComputable) { return; }
        var p = Math.round((e.loaded / e.total) * 100);
        pct.textContent = p + "%";
        fill.style.width = p + "%";
      });
      xhr.addEventListener("load", function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          // The row settles into Recent with its real timestamp. No
          // toast.
          loadRecent();
          return;
        }
        var why = "That didn't upload";
        try { why = JSON.parse(xhr.responseText).error || why; } catch (e) {}
        row.removeChild(bar);
        pct.textContent = "";
        var reason = make("span", "muted nowrap", why);
        reason.style.color = "var(--st-bad)";
        row.appendChild(reason);
        var retry = make("button", "hbtn hbtn-ghost", "Retry");
        retry.type = "button";
        retry.addEventListener("click", function () { row.remove(); upload([file]); });
        row.appendChild(retry);
      });
      xhr.addEventListener("error", function () {
        pct.textContent = "";
        row.appendChild(make("span", "muted", "the upload was interrupted"));
      });
      xhr.send(file);
    });
  }

  // =========================================================== assistant
  var agents = [], session = "", agent = "";

  function loadAssistant() {
    fetch("/api/v1/assistant/agents", { headers: { accept: "application/json" } })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) { throw new Error(res.j.error || "no assistant is set up yet"); }
        agents = res.j.agents || [];
        text("acts-as", member ? "Acts as " + member + ", inside " + member + "'s own permissions." : "");
        if (!agents.length) {
          el("ask").disabled = true;
          el("send").disabled = true;
          el("asks").hidden = true;
          el("thread").appendChild(make("p", "muted",
            "No assistant is set up yet. The owner turns one on, chooses what it may do, " +
            "and it appears here."));
          text("m-assistant-sub", "Not set up yet");
          return;
        }
        agent = agents[0].name;
        // One entry is a label, not a menu.
        if (agents.length === 1) {
          text("agent-label", agent);
        } else {
          var sel = el("agent-select");
          sel.hidden = false;
          agents.forEach(function (a) {
            var o = document.createElement("option");
            o.value = a.name;
            o.textContent = a.name;
            sel.appendChild(o);
          });
          sel.addEventListener("change", function () {
            // A new agent is a new conversation: "I sent this to Sandy"
            // and "this went to Alfred" must not both be true of one
            // thread.
            agent = sel.value;
            session = "";
            clear(el("thread"));
            el("asks").hidden = false;
          });
        }
        text("m-assistant-sub", "Ask the house for something");
        var unreachable = agents.filter(function (a) { return !a.reachable; });
        if (unreachable.length === agents.length) {
          fail(el("assistant-note"),
            "It can still take a question, but the model it uses isn't answering right now.");
        }
        el("asks").hidden = false;
      })
      .catch(function (err) {
        el("ask").disabled = true;
        el("send").disabled = true;
        fail(el("assistant-note"), String(err.message || err));
      });
  }

  Array.prototype.forEach.call(el("asks").querySelectorAll("button"), function (b) {
    b.addEventListener("click", function () { el("ask").value = b.textContent; el("ask").focus(); });
  });

  function turn(role, body) {
    if (role === "user") {
      var u = make("div", "msg-user", body);
      return u;
    }
    var wrap = make("div", "turn");
    var mark = make("span", "turn-mark");
    mark.appendChild(icon("sparkle"));
    wrap.appendChild(mark);
    wrap.appendChild(make("div", "grow", body));
    return wrap;
  }

  function send() {
    var box = el("ask"), body = box.value.trim();
    if (!body || !agent) { return; }
    var thread = el("thread");
    el("asks").hidden = true;
    // The message appears immediately, dimmed: pending is explicit.
    var mine = turn("user", body);
    mine.style.opacity = "0.6";
    thread.appendChild(mine);
    // A line naming what it is doing, because silence reads as a hang.
    var working = turn("assistant", "Thinking…");
    working.style.opacity = "0.7";
    thread.appendChild(working);
    thread.scrollTop = thread.scrollHeight;
    box.disabled = true;
    el("send").disabled = true;

    fetch("/api/v1/assistant/ask", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ agent: agent, session: session, text: body })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        thread.removeChild(working);
        mine.style.opacity = "";
        if (!res.ok) { throw new Error(res.j.error || "I couldn't answer that one"); }
        session = res.j.session || session;
        // Model output is untrusted display content: textContent, never
        // markup.
        thread.appendChild(turn("assistant", res.j.reply || ""));
        if (res.j.proposals) {
          var p = make("div", "pill pill-warn",
            res.j.proposals === 1 ? "1 thing needs the owner's approval"
                                  : res.j.proposals + " things need the owner's approval");
          thread.appendChild(p);
        }
        el("open-conversation").href = session ? "/assistant/?session=" + encodeURIComponent(session)
                                               : "/assistant/";
        box.value = "";
      })
      .catch(function (err) {
        // A failed send keeps the typed text.
        mine.style.opacity = "";
        var n = make("div", "note note-bad");
        n.appendChild(icon("warning-circle"));
        n.appendChild(make("span", null, String(err.message || err)));
        var again = make("button", "hbtn hbtn-ghost", "Try again");
        again.type = "button";
        again.addEventListener("click", function () { n.remove(); send(); });
        n.appendChild(again);
        thread.appendChild(n);
      })
      .then(function () {
        box.disabled = false;
        el("send").disabled = false;
        thread.scrollTop = thread.scrollHeight;
        box.focus();
      });
  }

  el("send").addEventListener("click", send);
  el("ask").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  fold("needs", el("needs-fold"), el("needs-body"), el("needs-caret"), true);
  fold("cal", el("cal-fold"), el("cal-body"), el("cal-caret"), false);
  fold("notif", el("notif-fold"), el("notif-body"), el("notif-caret"), true);
  load();
})();
</script>
