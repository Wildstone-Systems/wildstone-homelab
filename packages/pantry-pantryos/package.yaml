# PantryOS — the household's pantry, grocery list and cook-along
# (ADR-W044, #382).
#
# WHAT IT IS. PantryOS keeps what is in the kitchen: stock, expiry dates,
# recipes, meals, and the grocery list. Installing this package lets the
# household's Agents use it — check stock, see what is expiring, put
# things on the grocery list, and walk someone through a recipe one step
# at a time — and lets PantryOS tell the household what happened
# (a meal logged, groceries bought, something running low).
#
# PANTRYOS RUNS WHERE IT ALREADY RUNS. This is the connection-only shape
# (ADR-W030 A5, ADR-W044 A1): PantryOS may be on its own machine or VM,
# and this package installs no container for it. Removing the package
# stops the tools and the events; it never touches PantryOS itself.
#
# CONNECTING IT (ADR-W044 A6):
#   Pair (recommended): in PantryOS ask for a pairing code, then
#   POST /api/v1/pantry/pairing {address, code, keystoneUrl}. PantryOS gets
#   its publisher token and Keystone its agent key, machine to machine;
#   nobody copies a secret. Re-pairing rotates both.
#   Or configure: start Keystone with -pantry-url and the agent key in
#   PANTRY_AGENT_KEY (never a flag). A pairing wins over these.
#   Either way the tools answer only while this package is installed.
#
# THE GROCERY LIST. While PantryOS is installed it owns the household's
# grocery list; the household lists (lists-wildstone) keep every other
# list. When PantryOS is not answering, the tools say so — they never
# quietly fall back to another list (ADR-W044 A3, #383).
apiVersion: wildstone.dev/v1
kind: Package
metadata:
  name: pantry-pantryos
  version: 0.3.0
  capability: pantry
  profile: pantryos
  # One pantry. A second PantryOS would be a second grocery list.
  exclusive: true
params:
  # Where the publisher token lives. PantryOS runs elsewhere, so this is
  # the Wildstone machine that holds the secret for it.
  - { name: node, required: true, description: "Which Wildstone machine keeps PantryOS's event credential.", source: node }
accessGroups: [family]
policies:
  classifications: [family_private]
  dataSensitivity: medium

# What PantryOS tells the household (ADR-W024 A10, native shape: PantryOS
# posts to the intake itself, no shim). Payloads are small on purpose —
# names and numbers, never nutrition — and event ids are PantryOS's own,
# stable over retries, so the intake drops a repeat.
publishes:
  shape: native
  events:
    - type: pantry.meal_logged
      subject: member
      description: Someone logged a meal. The subject is the member linked to their PantryOS profile, when there is one.
      fields:
        - { name: food, type: string, required: true }
        - { name: meal_type, type: string }
        - { name: quantity, type: number }
        - { name: unit, type: string }
        - { name: profile_id, type: string }
    - type: pantry.purchase_recorded
      subject: household
      description: Groceries came in — one event per receipt, or per item added by hand.
      fields:
        - { name: item_count, type: number, required: true }
        - { name: from_receipt, type: bool }
        - { name: truncated, type: bool }
    - type: pantry.recipe_cooked
      subject: household
      description: A recipe was cooked and its ingredients taken out of the pantry.
      fields:
        - { name: recipe, type: string, required: true }
        - { name: recipe_id, type: string }
        - { name: servings_made, type: number }
        - { name: batches, type: number }
        - { name: leftover_servings, type: number }
    - type: pantry.stock_low
      subject: household
      description: An item dropped below its restock level. Sent once per drop, not while it stays low.
      fields:
        - { name: item, type: string, required: true }
        - { name: item_id, type: string }
        - { name: on_hand, type: number }
        - { name: threshold, type: number }
        - { name: unit, type: string }
    - type: pantry.item_expiring
      subject: household
      description: Something in the pantry expires within three days. Sent once per item and date.
      fields:
        - { name: item, type: string, required: true }
        - { name: item_id, type: string }
        - { name: expires_on, type: string }
        - { name: days_left, type: number }
        - { name: quantity, type: number }
        - { name: unit, type: string }
    - type: pantry.item_spoiled
      subject: household
      description: Food went off and was thrown out. Sent once per item thrown out.
      fields:
        - { name: item, type: string, required: true }
        - { name: quantity, type: number }
        - { name: unit, type: string }
    - type: pantry.shopping_list_changed
      subject: household
      description: The grocery list changed. Sent once a burst of edits has been quiet for a minute; carries only how many things are on it.
      fields:
        - { name: item_count, type: number, required: true }
    - type: pantry.timer_finished
      subject: member
      description: A kitchen timer went off — set on the tablet or by an agent. Sent once per timer. The subject is whoever set it (the member an agent was asked by, or the member linked to the tablet's profile); a timer set by nobody known has none.
      fields:
        - { name: label, type: string, required: true }
        - { name: duration_seconds, type: number }
        - { name: recipe, type: string }
        - { name: step_number, type: number }

# The household actions this capability offers (ADR-W044 A5).
# keystone/domestic.PantryTools is the other half of this list, and
# TestPantryToolsAreDeclaredByThePackage fails if the two ever drift.
#
# Reads, and every cook-along step short of finishing — ticking steps off
# and kitchen timers included — are `read`: they change nothing in the pantry. Adding and ticking off groceries are
# `domestic`: small, visible, repeat-safe. Finishing a cook takes every
# ingredient out of stock at once, so it is `confirm`: a person is asked,
# naming the dish, and a rule firing on its own cannot carry it.
agentTools:
  - { name: pantry_summary, risk: read }
  - { name: check_stock, risk: read }
  - { name: whats_expiring, risk: read }
  - { name: show_grocery_list, risk: read }
  - { name: suggest_recipes, risk: read }
  - { name: get_recipe, risk: read }
  - { name: start_cooking, risk: read }
  - { name: current_step, risk: read }
  - { name: cooking_step, risk: read }
  - { name: complete_step, risk: read }
  - { name: read_steps, risk: read }
  - { name: set_timer, risk: read }
  - { name: list_timers, risk: read }
  - { name: cancel_timer, risk: read }
  - { name: stop_cooking, risk: read }
  - { name: add_to_grocery_list, risk: domestic }
  - { name: check_grocery_item, risk: domestic }
  - { name: finish_cooking, risk: confirm }
  # Only the eater's own log, and undo exists.
  - { name: log_meal, risk: domestic }
  - { name: undo_meal, risk: domestic }
