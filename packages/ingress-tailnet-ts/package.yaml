# Ingress capability, tailnet profile with TAILSCALE-ISSUED TLS: Caddy
# serving every Route under this node's own MagicDNS name, with a
# certificate a real CA issued and every device already trusts.
#
# Why this exists next to ingress-tailnet-public. That profile also gets
# publicly trusted certificates, and gets them for real hostnames — which
# is better. It also requires a domain in a Cloudflare zone and an API
# token that can edit it. This profile requires neither, which makes it
# the one a household can install on day one, before anybody has bought a
# domain. The upgrade path is real: secure a domain, switch profiles, and
# the hostnames come back.
#
# What it costs, said plainly: a tailnet certificate covers exactly ONE
# name — this node's — with no wildcards and no subdomains. Four services
# cannot have four hostnames under it. So they share the hostname and are
# told apart by PORT, and the addresses a family sees have port numbers
# in them. The dashboard holds 443 so the address people actually type
# has none (ADR-W019 A10).
#
# Caddy needs no certificate configuration here at all: it fetches
# *.ts.net certificates from a locally-running tailscaled automatically.
# What it does need is the socket, which is why tailscaled runs on the
# HOST and its socket is mounted in. That also means Tailscale is not
# managed by this package — installing it is the installer's job.
apiVersion: wildstone.dev/v1
kind: Package
metadata:
  name: ingress-tailnet-ts
  version: 1.0.0
  capability: ingress
  profile: caddy-tailnet-ts
provides:
  - { trait: ingress, mode: private }
params:
  # This node's MagicDNS name, e.g. "wildstone.tailnet.ts.net" — exactly
  # what `tailscale status --json | jq -r .Self.DNSName` prints, without
  # the trailing dot. It is the only name the certificate covers, so it
  # is the only name any Route on this node can be served under.
  - { name: tailnet_name, required: true }
  - { name: node, required: true }
  # The node's tailnet address. Required and undefaulted for the reason
  # caddy-tailnet gives (#41): a profile whose whole claim is that it is
  # private must not be private only by accident.
  - { name: listen_addr, required: true }
policies:
  classifications: [admin_tailscale]
templates:
  - |
    apiVersion: wildstone.dev/v1
    kind: Ingress
    metadata: { name: ingress, node: "{{ .Params.node }}" }
    spec:
      tls: tailscale
      tailnetName: "{{ .Params.tailnet_name }}"
      trustedProxies: [private_ranges]
  - |
    apiVersion: wildstone.dev/v1
    kind: Volume
    metadata: { name: caddy-tailnet-ts-data, node: "{{ .Params.node }}" }
    spec: { name: caddy-tailnet-ts-data }
  - |
    apiVersion: wildstone.dev/v1
    kind: Container
    metadata: { name: caddy-tailnet-ts, node: "{{ .Params.node }}" }
    spec:
      image: "caddy@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d"
      # Stock Caddy, not a custom build: fetching a *.ts.net certificate
      # from tailscaled needs no module, only the socket below.
      command: ["caddy", "run", "--config", "/etc/wildstone/Caddyfile", "--adapter", "caddyfile", "--watch"]
      ports:
        # The whole port block Keystone assigns from, published together.
        # Publishing only some would leave a Route that was assigned a
        # port genuinely unreachable, with nothing anywhere saying so —
        # the config would render, converge, and report healthy.
        - "{{ .Params.listen_addr }}:443:443"
        - "{{ .Params.listen_addr }}:7443:7443"
        - "{{ .Params.listen_addr }}:8443:8443"
        - "{{ .Params.listen_addr }}:9443:9443"
        - "{{ .Params.listen_addr }}:10443:10443"
        - "{{ .Params.listen_addr }}:11443:11443"
        - "{{ .Params.listen_addr }}:12443:12443"
        - "{{ .Params.listen_addr }}:13443:13443"
        - "{{ .Params.listen_addr }}:14443:14443"
        - "{{ .Params.listen_addr }}:15443:15443"
        - "{{ .Params.listen_addr }}:16443:16443"
        - "{{ .Params.listen_addr }}:17443:17443"
      mounts:
        - { source: caddy-tailnet-ts-data, target: /data }
        - { source: /etc/wildstone, target: /etc/wildstone, readOnly: true }
        # tailscaled's local API. This is how Caddy asks for the node's
        # certificate, and it is the whole mechanism — read-only, because
        # fetching a certificate is all it is for.
        - { source: /var/run/tailscale/tailscaled.sock, target: /var/run/tailscale/tailscaled.sock, readOnly: true }
      restart: unless-stopped
