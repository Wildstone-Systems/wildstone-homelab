<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coming up</title>
<link rel="stylesheet" href="/portal/assets/nocturne.css">
<!--
  Everything the household keeps track of, and what it owes itself
  against each.

  THE NEEDS-YOU CARD IS STILL THE FRONT DOOR. This page does not replace
  it — A19's argument was that a tracker people have to remember to
  visit is a tracker nobody visits, and that holds. The card keeps its
  rows and its buttons; this is where the rest lives, which is most of
  it: the card shows only what is ASKING for something, so a truck at
  3,000 of 5,000 miles was visible to nobody but an Owner.

  GROUPED BY METER, BECAUSE THAT IS THE MODEL. A meter is a number the
  household keeps; a commitment is a thing measured against it. One
  odometer feeds the oil, the tyres and the brakes — so the truck reads
  as one thing and the number is entered once, however many things
  depend on it.

  TWO LEVELS OF DISCLOSURE, EVERYWHERE. How many rows a card shows, and
  how much one row says. Both are needed: a household with forty
  tracked things and a page with no second level has a page a mile long,
  and a row that opens to its whole history is a row nobody can skim.

  A PROJECTION IS A GUESS AND SAYS SO. "around Nov 2026" is never
  rendered the way a date somebody set is.
-->
<style>
  .grp { margin-bottom: var(--space-6); }
  .grphead { display: flex; align-items: baseline; gap: var(--space-3); flex-wrap: wrap;
             margin-bottom: var(--space-3); }
  .crow { border-bottom: 1px solid var(--faint); }
  .crow:last-child { border-bottom: 0; }
  .crowhead { display: flex; gap: var(--space-3); align-items: baseline; width: 100%;
              padding: var(--space-3) 0; background: none; border: 0; color: inherit;
              font: inherit; text-align: left; cursor: pointer; }
  .crowhead:hover .cname { color: var(--color-accent); }
  .crowhead .caret { color: var(--muted); transition: transform 120ms ease; }
  .crowhead[aria-expanded="true"] .caret { transform: rotate(90deg); }
  .cname { font-weight: 500; }
  .cstand { margin-left: auto; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .cbody { padding: 0 0 var(--space-4) 25px; }
  .guess { font-style: italic; }
  .hist { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .hist td { padding: var(--space-2) var(--space-3) var(--space-2) 0; vertical-align: top;
             border-bottom: 1px solid var(--faint); }
  .hist tr:last-child td { border-bottom: 0; }
  .hist .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (max-width: 720px) {
    .crowhead { flex-wrap: wrap; }
    .cstand { margin-left: 0; width: 100%; padding-left: 25px; }
    .cbody { padding-left: var(--space-2); }
  }
</style>

<main class="page">
  <div class="spread" style="margin-bottom: var(--space-6)">
    <a class="hbtn hbtn-ghost" href="/home/"><i class="ph ph-arrow-left" aria-hidden="true"></i> Home</a>
    <span class="fade" aria-hidden="true"></span>
    <span class="muted" id="member"></span>
  </div>

  <div class="row-between" style="margin-bottom: var(--space-6)">
    <div>
      <h1>Coming up</h1>
      <div class="muted">What the house is keeping track of</div>
    </div>
    <div class="asks">
      <button class="hbtn hbtn-primary" id="add-thing" type="button">Track something new</button>
      <button class="hbtn hbtn-secondary" id="add-task" type="button">Add a reminder</button>
    </div>
  </div>

  <!-- Adding is a few questions in the order a person thinks of them:
       the THING first, then what you want to keep up with on it. The
       second is where the meter pays for itself — adding tyres to a
       truck the house already knows about skips the first half. -->
  <div id="form" hidden></div>

  <!-- One box across every section. It lives OUTSIDE the results, so a
       search matching nothing cannot take away the only control that
       would clear it. -->
  <div class="search" style="margin-bottom: var(--space-6)">
    <i class="ph ph-magnifying-glass" style="color: var(--muted)" aria-hidden="true"></i>
    <label class="sr" for="q">Search what the house tracks</label>
    <input id="q" type="search" placeholder="Search everything" autocomplete="off">
    <button class="hbtn hbtn-ghost" id="qclear" type="button" hidden>Clear</button>
  </div>

  <div id="note"></div>
  <section id="body"></section>

  <footer class="muted" style="margin-top: var(--space-8); font-size: 12px">
    You see what your household shares with you. Things about one person are theirs.
  </footer>
</main>

<script>
(function () {
  "use strict";

  function el(id) { return document.getElementById(id); }
  function text(id, v) { var n = el(id); if (n) { n.textContent = v; } }
  function clear(n) { while (n && n.firstChild) { n.removeChild(n.firstChild); } }
  function make(tag, cls, content) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (content !== undefined && content !== null) { n.textContent = String(content); }
    return n;
  }
  function icon(name) {
    var i = make("i", "ph ph-" + name);
    i.setAttribute("aria-hidden", "true");
    return i;
  }
  function toneColour(t) {
    if (t === "failed") { return "var(--st-bad)"; }
    if (t === "waiting") { return "var(--st-warn)"; }
    if (t === "refused") { return "var(--muted)"; }
    return "var(--st-ok)";
  }

  // firstFew is the first level of disclosure: how much of a list a
  // card opens with. Small enough to skim, large enough that most
  // households never press the control.
  var firstFew = 5;

  // discloseRows renders the first few and offers THE REMAINDER.
  //
  // The count is what is left, not the whole list — somebody who has
  // just read "12 tracked" should not then be offered "12 more".
  function discloseRows(box, rows, draw) {
    var shown = rows.slice(0, firstFew), rest = rows.slice(firstFew);
    shown.forEach(function (r) { box.appendChild(draw(r)); });
    if (!rest.length) { return; }
    var more = make("button", "hbtn hbtn-ghost", "Show " + rest.length + " more");
    more.type = "button";
    more.appendChild(icon("caret-down"));
    more.addEventListener("click", function () {
      more.remove();
      rest.forEach(function (r) { box.appendChild(draw(r)); });
    });
    box.appendChild(more);
  }

  var page = null, query = "", filters = {};

  function meterMatches(m) {
    if (!query) { return true; }
    return ((m.description || "") + " " + m.name + " " + (m.unit || ""))
      .toLowerCase().indexOf(query) >= 0;
  }

  function matches(row) {
    if (!query) { return true; }
    var hay = (row.description || "") + " " + row.name + " " + (row.detail || "");
    return hay.toLowerCase().indexOf(query) >= 0;
  }

  // keep applies a section's own chips. Everything, and two cuts that
  // do not overlap: things asking for something, and things in hand.
  function keep(part, row) {
    var f = filters[part] || "";
    if (f === "asking") { return (row.asks || []).length > 0 && row.tone !== "ok"; }
    if (f === "booked") { return !!row.bookedFor; }
    if (f === "fine") { return row.tone === "ok" && !row.bookedFor; }
    return true;
  }

  function chips(part, defs, onPick) {
    var seg = make("div", "seg");
    seg.setAttribute("role", "tablist");
    seg.style.marginBottom = "var(--space-4)";
    defs.forEach(function (d) {
      var b = make("button", (filters[part] || "") === d.f ? "on" : "", d.label);
      b.type = "button";
      b.addEventListener("click", function () {
        filters[part] = d.f;
        render();
      });
      seg.appendChild(b);
    });
    return seg;
  }

  // ---- one commitment row, and its second level -----------------------

  function commitmentRow(row) {
    var wrap = make("div", "crow");
    var head = make("button", "crowhead");
    head.type = "button";
    head.setAttribute("aria-expanded", "false");
    var caret = icon("caret-right");
    caret.className += " caret";
    head.appendChild(caret);
    // A span rather than a glyph, the way every other tone dot on this
    // surface is drawn — the icon subset carries only what the pages
    // name, and a filled circle is CSS.
    var dot = make("span", "dot");
    dot.style.background = toneColour(row.tone);
    head.appendChild(dot);
    head.appendChild(make("span", "cname", row.description || row.name));
    if (row.personal) { head.appendChild(make("span", "pill pill-mute nowrap", "yours")); }
    head.appendChild(make("span", "cstand", row.detail || row.standing));
    wrap.appendChild(head);

    var body = make("div", "cbody");
    body.hidden = true;
    wrap.appendChild(body);
    var loaded = false;
    head.addEventListener("click", function () {
      var open = body.hidden;
      body.hidden = !open;
      head.setAttribute("aria-expanded", open ? "true" : "false");
      if (open && !loaded) { loaded = true; loadHistory(row, body); }
    });
    return wrap;
  }

  // The second level: what this commitment is, and every cycle it has
  // closed. Fetched when opened rather than with the page — a household
  // with forty tracked things would otherwise pay for forty histories
  // to render one screen.
  function loadHistory(row, body) {
    clear(body);
    body.appendChild(make("div", "muted", "Reading its history…"));
    fetch("/api/v1/home/commitments/" + encodeURIComponent(row.name))
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        clear(body);
        if (!res.ok) {
          body.appendChild(make("div", "muted", res.j.error || "Can't read its history."));
          return;
        }
        body.appendChild(make("div", "muted", res.j.row.standing +
          (res.j.row.bookedFor ? " — " + when(res.j.row.bookedFor) : "")));
        if (!res.j.cycles.length) {
          body.appendChild(make("div", "muted", "Nothing recorded yet."));
          body.appendChild(removeRow(row));
          return;
        }
        var t = make("table", "hist");
        res.j.cycles.forEach(function (c) {
          var tr = make("tr");
          tr.appendChild(make("td", "num", when(c.at)));
          var what = make("td");
          if (c.waived) {
            what.appendChild(make("span", "", "skipped on purpose"));
            if (c.reason) { what.appendChild(make("div", "muted", c.reason)); }
          } else if (c.position !== undefined && c.position !== null) {
            what.appendChild(make("span", "num",
              c.position + (c.unit ? " " + c.unit : "") + (c.approximate ? " (estimated)" : "")));
          } else {
            what.appendChild(make("span", "", "done"));
          }
          if (c.note) { what.appendChild(make("div", "muted", c.note)); }
          tr.appendChild(what);
          tr.appendChild(make("td", "muted num", c.since || ""));
          tr.appendChild(make("td", "muted", c.fromEvent ? "recorded by the house" : c.by));
          t.appendChild(tr);
        });
        body.appendChild(t);
        body.appendChild(removeRow(row));
      })
      .catch(function () {
        clear(body);
        body.appendChild(make("div", "muted", "Can't read its history."));
      });
  }

  // Stopping tracking is offered one level down, with the history, so
  // it is never a tap away from a list somebody is skimming.
  function removeRow(row) {
    var wrap = make("div", "asks");
    wrap.style.marginTop = "var(--space-3)";
    var b = make("button", "hbtn hbtn-ghost", "Stop tracking this");
    b.type = "button";
    b.addEventListener("click", function () {
      if (!window.confirm("Stop tracking \u201c" + (row.description || row.name) +
                          "\u201d? What has already been recorded is kept.")) { return; }
      post("DELETE", "/api/v1/home/commitments/" + encodeURIComponent(row.name), null, b);
    });
    wrap.appendChild(b);
    return wrap;
  }

  function when(iso) {
    var d = new Date(iso);
    return isNaN(d.getTime()) ? "" : d.toLocaleDateString(undefined,
      { day: "numeric", month: "short", year: "numeric" });
  }


  // ---- adding and removing --------------------------------------------

  function field(label, id, opts) {
    var wrap = make("label", "stack");
    wrap.style.gap = "var(--space-2)";
    wrap.appendChild(make("span", "muted", label));
    var input = make("input", "hinput");
    input.id = id;
    input.type = (opts && opts.type) || "text";
    if (opts && opts.placeholder) { input.placeholder = opts.placeholder; }
    if (opts && opts.value) { input.value = opts.value; }
    wrap.appendChild(input);
    return wrap;
  }

  function picker(label, id, options) {
    var wrap = make("label", "stack");
    wrap.style.gap = "var(--space-2)";
    wrap.appendChild(make("span", "muted", label));
    var sel = make("select", "hbtn hbtn-secondary");
    sel.id = id;
    options.forEach(function (o) {
      var opt = make("option", "", o.label);
      opt.value = o.value;
      sel.appendChild(opt);
    });
    wrap.appendChild(sel);
    return wrap;
  }

  function closeForm() {
    var f = el("form");
    f.hidden = true;
    clear(f);
  }

  function openForm(title, build, submit) {
    var f = el("form");
    clear(f);
    f.hidden = false;
    var card = make("section", "wid");
    card.appendChild(make("h2", "", title));
    var stack = make("div", "stack");
    build(stack);
    card.appendChild(stack);
    var row = make("div", "asks");
    row.style.marginTop = "var(--space-4)";
    var save = make("button", "hbtn hbtn-primary", "Save");
    save.type = "button";
    var cancel = make("button", "hbtn hbtn-ghost", "Cancel");
    cancel.type = "button";
    cancel.addEventListener("click", closeForm);
    save.addEventListener("click", function () { submit(save); });
    row.appendChild(save);
    row.appendChild(cancel);
    card.appendChild(row);
    f.appendChild(card);
    f.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function val(id) { return (el(id) && el(id).value || "").trim(); }

  // A rollover is the one thing a household has to choose deliberately,
  // so it is offered in words rather than as the engine's three names.
  var rollovers = [
    { value: "fromCompletion", label: "Every so often, measured from when it was last done" },
    { value: "fromSchedule", label: "On a fixed schedule, whenever it actually happens" },
    { value: "once", label: "Just the once" },
  ];

  function taskFields(stack, meters) {
    stack.appendChild(field("What do you want to keep up with?", "f-desc",
      { placeholder: "Oil and filter" }));
    if (meters && meters.length) {
      var opts = [{ value: "", label: "The calendar" }];
      meters.forEach(function (m) { opts.push({ value: m.name, label: m.description || m.name }); });
      stack.appendChild(picker("Measured against", "f-meter", opts));
    }
    stack.appendChild(field("How often?", "f-every", { placeholder: "5000, or 3mo" }));
    stack.appendChild(field("Start asking this early", "f-lead", { placeholder: "300, or 14d" }));
    stack.appendChild(picker("Does it come round again?", "f-rollover", rollovers));
  }

  function taskBody() {
    var body = {
      description: val("f-desc"),
      every: val("f-every"),
      lead: val("f-lead"),
      rollover: val("f-rollover") || "fromCompletion"
    };
    var m = el("f-meter");
    if (m && m.value) { body.meter = m.value; }
    return body;
  }

  // `done` is given the whole answer, refusals included, because one of
  // them is not a failure: removing a meter that something measures
  // against comes back 409 with what will stop working, to be confirmed
  // rather than reported. A helper that threw on every non-2xx turned
  // that into "that didn't go through" and made the meter undeletable.
  function post(method, path, body, btn, done) {
    btn.disabled = true;
    fetch(path, {
      method: method,
      headers: { "Content-Type": "application/json" },
      body: body === null ? undefined : JSON.stringify(body)
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, code: r.status, j: j }; }); })
      .then(function (res) {
        if (done) { done(res); return; }
        if (!res.ok) { throw new Error(res.j.error || "that didn't go through"); }
        closeForm(); load();
      })
      .catch(function (err) {
        btn.disabled = false;
        var note = btn.parentNode.querySelector(".asks-said");
        if (!note) { note = make("span", "asks-said", ""); btn.parentNode.appendChild(note); }
        note.textContent = String(err.message || err);
      });
  }

  function meterList() {
    return (page && page.tracked || []).map(function (g) { return g.meter; });
  }

  el("add-thing").addEventListener("click", function () {
    openForm("Track something new", function (stack) {
      stack.appendChild(field("What is it?", "f-mdesc", { placeholder: "F-150 odometer" }));
      stack.appendChild(field("What does it count?", "f-unit", { placeholder: "miles" }));
      stack.appendChild(field("What does it read now?", "f-reading", { type: "number" }));
      stack.appendChild(make("div", "muted", "And the first thing to keep up with — you can add more later."));
      taskFields(stack, null);
    }, function (btn) {
      var body = { meter: { description: val("f-mdesc"), unit: val("f-unit") } };
      var n = parseFloat(val("f-reading"));
      if (!isNaN(n)) { body.reading = n; }
      if (val("f-desc")) { body.commitment = taskBody(); }
      post("POST", "/api/v1/home/tracked", body, btn);
    });
  });

  el("add-task").addEventListener("click", function () {
    openForm("Add a reminder", function (stack) {
      taskFields(stack, meterList());
    }, function (btn) {
      post("POST", "/api/v1/home/commitments", taskBody(), btn);
    });
  });

  // Removing a meter names what stops working, and asks again. The
  // commitments keep their schedules and lose the number they measure
  // against — that is the one destructive act here, and it is a
  // member's to make knowingly rather than an Owner's to gate.
  function removeMeter(meter, btn) {
    post("DELETE", "/api/v1/home/meters/" + encodeURIComponent(meter), null, btn, function (res) {
      btn.disabled = false;
      if (res.ok) { load(); return; }
      if (!res.j || !res.j.confirm) {
        complain(btn, (res.j && res.j.error) || "that didn't go through");
        return;
      }
      if (window.confirm(res.j.consequence + "\n\nStop keeping it anyway?")) {
        post("DELETE", "/api/v1/home/meters/" + encodeURIComponent(meter) + "?confirm=yes", null, btn);
      }
    });
  }

  // ---- the three sections ---------------------------------------------

  function renderTracked(box) {
    // A METER IS A THING IN ITS OWN RIGHT, not a header for its
    // commitments. Filtering the group by its children meant searching
    // "odometer" hid the odometer, and a chip that matched none of the
    // truck's jobs took away the box for entering its mileage — which
    // is the one thing on this page a household came to do.
    var groups = page.tracked.filter(function (g) {
      return meterMatches(g.meter) ||
             g.commitments.some(function (r) { return matches(r) && keep("tracked", r); });
    });
    var card = section("Things you track", "tracked", [
      { f: "", label: "Everything" },
      { f: "asking", label: "Needs something" },
      { f: "fine", label: "Fine" },
    ]);
    if (!groups.length) { return emptyCard(card, box); }
    var list = make("div", "");
    discloseRows(list, groups, drawMeterGroup);
    card.body.appendChild(list);
    box.appendChild(card.node);
  }

  function drawMeterGroup(g) {
    var wrap = make("div", "grp");
    var head = make("div", "grphead");
    head.appendChild(make("span", "cname", g.meter.description || g.meter.name));
    var stands = g.meter.latest
      ? g.meter.latest.value + " " + (g.meter.unit || "") + " · read " + when(g.meter.latest.at)
      : "never read";
    var note = make("span", "muted", stands);
    if (g.wanted) { note.style.color = "var(--st-warn)"; }
    head.appendChild(note);
    wrap.appendChild(head);

    // The box belongs to the METER, once, however many things are
    // measured against it.
    var ask = make("div", "asks");
    var boxInput = make("input", "hinput");
    boxInput.type = "number";
    boxInput.step = "any";
    boxInput.min = "0";
    boxInput.placeholder = g.meter.unit || "number";
    boxInput.setAttribute("aria-label", "What does " + g.meter.name + " say");
    boxInput.style.maxWidth = "9rem";
    ask.appendChild(boxInput);
    ask.appendChild(saveBtn(g.meter.name, boxInput));
    var drop = make("button", "hbtn hbtn-ghost", "Stop keeping this");
    drop.type = "button";
    drop.addEventListener("click", function () { removeMeter(g.meter.name, drop); });
    ask.appendChild(drop);
    wrap.appendChild(ask);

    var rows = g.commitments.filter(function (r) {
      return (meterMatches(g.meter) || matches(r)) && keep("tracked", r);
    });
    var list = make("div", "");
    discloseRows(list, rows, commitmentRow);
    wrap.appendChild(list);
    return wrap;
  }

  function saveBtn(meter, input) {
    var b = make("button", "hbtn hbtn-primary", "Save");
    b.type = "button";
    b.addEventListener("click", function () {
      var v = parseFloat(input.value);
      if (isNaN(v) || v < 0) { complain(b, "a meter counts up from zero"); return; }
      b.disabled = true;
      fetch("/api/v1/home/meters/" + encodeURIComponent(meter) + "/readings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ value: v })
      })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok) { throw new Error(res.j.error || "that didn't go through"); }
          load();
        })
        .catch(function (err) { b.disabled = false; complain(b, String(err.message || err)); });
    });
    return b;
  }

  function complain(b, why) {
    var n = b.parentNode.querySelector(".asks-said");
    if (!n) { n = make("span", "asks-said", ""); b.parentNode.appendChild(n); }
    n.textContent = why;
  }

  function renderFlat(box, rows, title, key, defs) {
    var card = section(title, key, defs);
    var keepers = rows.filter(function (r) { return matches(r) && keep(key, r); });
    if (!keepers.length) { return emptyCard(card, box); }
    var list = make("div", "");
    discloseRows(list, keepers, commitmentRow);
    card.body.appendChild(list);
    box.appendChild(card.node);
  }

  function section(title, key, defs) {
    var node = make("section", "wid");
    var head = make("div", "row-between");
    head.appendChild(make("h2", "", title));
    node.appendChild(head);
    var body = make("div", "");
    if (defs) { body.appendChild(chips(key, defs)); }
    node.appendChild(body);
    return { node: node, body: body };
  }

  // A section whose filter or search matches nothing still renders, with
  // its chips and a way out. A card that vanished would take the only
  // control that could bring it back.
  function emptyCard(card, box) {
    card.body.appendChild(make("div", "muted", "Nothing here matches."));
    box.appendChild(card.node);
  }

  function render() {
    var box = el("body");
    clear(box);
    if (!page) { return; }
    if (!page.available) {
      clear(el("note"));
      var n = make("div", "note note-bad", page.problem || "Can't tell what the house is keeping track of.");
      el("note").appendChild(n);
      return;
    }
    renderTracked(box);
    renderFlat(box, page.calendar, "On the calendar", "calendar", [
      { f: "", label: "Everything" },
      { f: "asking", label: "Needs something" },
      { f: "booked", label: "Booked" },
    ]);
    if (page.done.length) {
      renderFlat(box, page.done, "Done", "done", null);
    }
  }

  function load() {
    fetch("/api/v1/home/upkeep")
      .then(function (r) { return r.json(); })
      .then(function (j) { page = j; render(); })
      .catch(function () {
        page = { available: false, problem: "Can't tell what the house is keeping track of — Wildstone isn't answering.", tracked: [], calendar: [], done: [] };
        render();
      });
  }

  el("q").addEventListener("input", function () {
    query = el("q").value.trim().toLowerCase();
    el("qclear").hidden = !query;
    render();
  });
  el("qclear").addEventListener("click", function () {
    el("q").value = "";
    query = "";
    el("qclear").hidden = true;
    el("q").focus();
    render();
  });

  load();
})();
</script>
