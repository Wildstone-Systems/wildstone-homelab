apiVersion: v1
kind: Service
metadata:
  name: {{ include "wildstone-management.fullname" . }}
  labels:
    {{- include "wildstone-management.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "wildstone-management.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.apiPort }}
      targetPort: http
      protocol: TCP
    - name: agent-gateway
      port: {{ .Values.service.gatewayPort }}
      targetPort: agent-gateway
      protocol: TCP

