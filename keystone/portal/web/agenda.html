<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda</title>
<link rel="stylesheet" href="/portal/assets/nocturne.css">
<!--wildstone:theme-->
<!--
  One person's day.

  A HOUSEHOLD SURFACE WITH A SUBJECT SELECTOR, not a per-person
  authenticated one (ADR-W033 A10). Whoever came through the door sees
  whichever day they pick, because on a kitchen tablet that is what is
  actually true, and a page that implied otherwise would be claiming a
  privacy it cannot enforce. The selector says whose day is on screen;
  it does not say who is asking.

  WHOSE NAME IS ON THE TAB is the first thing the page answers, because
  on a shared screen the previous person's day is the thing most likely
  to still be showing.

  THE THREE KINDS STAY DISTINGUISHABLE. An appointment at four o'clock,
  a thing to keep up with, and a notice waiting are different kinds of
  obligation, and flattening them into one list of grey rows is how an
  agenda stops being read. Each carries its own mark and its own idiom:
  a time, a standing, a dot.
-->
<style>
  .people { display: flex; gap: var(--space-2); flex-wrap: wrap; }
  .person {
    display: inline-flex; align-items: center; gap: var(--space-2);
    padding: var(--space-2) var(--space-4); border-radius: 999px;
    border: 1px solid var(--hair); background: none; color: var(--color-text);
    font: inherit; font-size: 13.5px; cursor: pointer;
  }
  .person:hover { background: var(--faint); }
  .person.on { background: color-mix(in srgb, var(--color-accent) 18%, transparent);
               border-color: var(--color-accent); color: var(--color-accent-200); }
  .person .kid { font-size: 11px; color: var(--muted); }
  .person.on .kid { color: var(--color-accent-300); }

  .day { margin-bottom: var(--space-6); }
  .dayhead { display: flex; align-items: baseline; gap: var(--space-3); margin-bottom: var(--space-3); }
  .dayhead .when { font-size: 15px; font-weight: 600; }

  .arow { display: flex; gap: var(--space-4); align-items: flex-start; padding: var(--space-3) 0;
          border-bottom: 1px solid var(--faint); }
  .arow:last-child { border-bottom: 0; }
  /* The time column is fixed so the day reads as a column of times
     rather than a ragged left edge. An undated row leaves it blank
     rather than inventing a time it does not have. */
  .arow .time { flex: none; width: 5.5rem; font-variant-numeric: tabular-nums;
                font-size: 13px; color: var(--muted); padding-top: 1px; }
  .arow .what { flex: 1; min-width: 0; }
  .arow .title { font-size: 14px; }
  .arow .sub { font-size: 12px; color: var(--muted); }
  .mark { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; }
  /* --mark is a THEME token and nocturne.css does not define it, so a
     household on the default theme had an invisible dot on every
     commitment row. Fallback to a token the base sheet guarantees; a
     theme that brings --mark still wins. */
  .mark-event { background: var(--color-accent); }
  .mark-commitment { background: var(--mark, var(--color-accent-300)); }
  .mark-notice { background: var(--st-warn); }
  .empty { color: var(--muted); font-size: 13px; padding: var(--space-3) 0; }
  .tick { flex: none; }
  .part { flex: none; font-size: 11px; color: var(--muted); text-transform: uppercase;
          letter-spacing: 0.1em; padding-top: 3px; width: 5rem; }
  .addbox { display: grid; gap: var(--space-3); }
  .addrow { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center; }
  .addrow label { font-size: 12px; color: var(--muted); }
  @media (max-width: 720px) {
    .arow .time { width: 4.25rem; font-size: 12px; }
  }
</style>

<main class="page">
  <div class="spread" style="margin-bottom: var(--space-6)">
    <a class="hbtn hbtn-ghost" href="/home/"><i class="ph ph-arrow-left" aria-hidden="true"></i> Home</a>
    <span class="fade" aria-hidden="true"></span>
    <span class="muted" id="member"></span>
  </div>

  <div class="row-between" style="margin-bottom: var(--space-4)">
    <div>
      <h1 id="title">Agenda</h1>
      <div class="muted" id="sub">What today looks like</div>
    </div>
  </div>

  <div class="people" id="people" style="margin-bottom: var(--space-6)"></div>

  <div class="row-between" style="margin-bottom: var(--space-4)">
    <span class="eyebrow" id="addfor"></span>
    <button type="button" class="hbtn hbtn-primary" id="addopen">
      <i class="ph ph-plus" aria-hidden="true"></i> Add a routine
    </button>
  </div>

  <!-- Authoring lives on the DASHBOARD, not the Console. A commitment
       cannot act, so handlers_portal_authoring.go already lets a Member
       add one without an Owner approving a Plan — which is the whole
       reason the person who actually runs the kids' week can enter it
       herself. This form sends the same typed fields that door has
       always taken; it invents no new path to the Statefile. -->
  <section class="wid" id="addform" hidden style="margin-bottom: var(--space-6)">
    <h2 style="font-size: 15px">Add a routine</h2>
    <div class="addbox">
      <div class="addrow">
        <input class="hinput" id="a-what" type="text" maxlength="200" style="flex: 1; min-width: 14rem"
               placeholder="Make your bed" aria-label="What is the routine">
      </div>
      <div class="addrow">
        <label for="a-who">For</label>
        <select class="hbtn hbtn-secondary" id="a-who"></select>
        <label for="a-every">Every</label>
        <select class="hbtn hbtn-secondary" id="a-every">
          <option value="1d">day</option>
          <option value="1w">week</option>
        </select>
        <label for="a-part">When</label>
        <select class="hbtn hbtn-secondary" id="a-part">
          <option value="morning">morning</option>
          <option value="afternoon">afternoon</option>
          <option value="evening">evening</option>
          <option value="">any time</option>
        </select>
      </div>
      <div class="addrow">
        <button type="button" class="hbtn hbtn-primary" id="a-save">Add it</button>
        <button type="button" class="hbtn hbtn-ghost" id="a-cancel">Cancel</button>
        <span class="muted" id="a-problem"></span>
      </div>
    </div>
  </section>

  <div id="note"></div>
  <section id="body"></section>

  <footer class="muted" style="margin-top: var(--space-8); font-size: 12px">
    Anyone at this screen can see any of these days. A person's own private things are not here.
  </footer>
</main>

<script>
(function () {
  "use strict";

  function el(id) { return document.getElementById(id); }
  function text(id, v) { var n = el(id); if (n) { n.textContent = v; } }
  function clear(n) { while (n && n.firstChild) { n.removeChild(n.firstChild); } }
  function make(tag, cls, content) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (content !== undefined && content !== null) { n.textContent = String(content); }
    return n;
  }

  var page = null;

  function paintPeople() {
    var box = el("people");
    clear(box);
    (page.people || []).forEach(function (p) {
      var b = make("button", "person" + (p.handle === page.who ? " on" : ""));
      b.type = "button";
      b.appendChild(make("span", "", p.handle));
      if (p.child) { b.appendChild(make("span", "kid", "child")); }
      b.addEventListener("click", function () { load(p.handle); });
      box.appendChild(b);
    });
  }

  function row(item) {
    var r = make("div", "arow");
    r.appendChild(make("span", "mark mark-" + (item.kind || "event")));
    // All-day and undated rows say so in words rather than leaving the
    // reader to work out why the time column is empty. A routine has a
    // part of day instead, which is the honest answer for a thing
    // nobody does at 07:15.
    var when = item.at || (item.allDay ? "All day" : "");
    if (!when && item.partOfDay) {
      r.appendChild(make("span", "part", item.partOfDay));
    } else {
      r.appendChild(make("span", "time", when));
    }
    var what = make("div", "what");
    what.appendChild(make("div", "title", item.title));
    if (item.detail) { what.appendChild(make("div", "sub", item.detail)); }
    r.appendChild(what);
    // Ticking off goes through the door the upkeep page already uses,
    // and is offered only where the server said this reader may.
    if (item.done && item.name) {
      var tick = make("button", "hbtn hbtn-ghost tick", "Done");
      tick.type = "button";
      tick.addEventListener("click", function () {
        tick.disabled = true;
        fetch("/api/v1/home/commitments/" + encodeURIComponent(item.name) + "/done", {
          method: "POST", headers: { "content-type": "application/json" }, body: "{}"
        }).then(function (res) {
          if (!res.ok) { throw new Error("done: " + res.status); }
          load(page.who);
        }).catch(function () {
          tick.disabled = false;
          tick.textContent = "Wouldn't save";
        });
      });
      r.appendChild(tick);
    }
    return r;
  }

  // ---- adding a routine.
  function paintAddWho() {
    var sel = el("a-who");
    clear(sel);
    (page.people || []).forEach(function (p) {
      var o = document.createElement("option");
      o.value = p.handle;
      o.textContent = p.handle + (p.child ? " (child)" : "");
      if (p.handle === page.who) { o.selected = true; }
      sel.appendChild(o);
    });
  }

  el("addopen").addEventListener("click", function () {
    var f = el("addform");
    f.hidden = !f.hidden;
    if (!f.hidden) { paintAddWho(); el("a-what").focus(); }
  });
  el("a-cancel").addEventListener("click", function () { el("addform").hidden = true; });

  el("a-save").addEventListener("click", function () {
    var what = el("a-what").value.trim();
    if (!what) { text("a-problem", "What is the routine?"); return; }
    text("a-problem", "");
    el("a-save").disabled = true;
    // The same typed fields the dashboard's own authoring door has
    // always taken. rollover from-completion is what makes a chore come
    // round again once it is ticked, rather than on a fixed schedule
    // that marches on whether or not anybody did it.
    fetch("/api/v1/home/commitments", {
      method: "POST",
      headers: { "content-type": "application/json", accept: "application/json" },
      body: JSON.stringify({
        description: what,
        about: el("a-who").value,
        every: el("a-every").value,
        partOfDay: el("a-part").value,
        rollover: "fromCompletion",
        scope: "personal"
      })
    }).then(function (res) {
      return res.json().then(function (j) { return { ok: res.ok, j: j }; });
    }).then(function (out) {
      el("a-save").disabled = false;
      if (!out.ok) { text("a-problem", out.j.error || "That didn't save."); return; }
      el("a-what").value = "";
      el("addform").hidden = true;
      load(el("a-who").value);
    }).catch(function () {
      el("a-save").disabled = false;
      text("a-problem", "That didn't save.");
    });
  });

  function paint() {
    var body = el("body");
    clear(body);
    if (!page || !page.available) {
      clear(el("note"));
      el("note").appendChild(make("div", "note note-bad",
        (page && page.problem) || "Can't put together an agenda right now."));
      return;
    }
    clear(el("note"));
    paintPeople();
    text("title", page.who);
    text("sub", "What the house has for " + page.who);
    text("addfor", "Routines for " + page.who);

    (page.days || []).forEach(function (d) {
      var wrap = make("div", "day");
      var head = make("div", "dayhead");
      head.appendChild(make("span", "when", d.label));
      head.appendChild(make("span", "fade"));
      head.appendChild(make("span", "muted", (d.items || []).length
        ? ((d.items.length === 1) ? "1 thing" : d.items.length + " things") : ""));
      wrap.appendChild(head);
      var card = make("section", "wid");
      if (!d.items || !d.items.length) {
        card.appendChild(make("div", "empty", "Nothing on."));
      } else {
        d.items.forEach(function (it) { card.appendChild(row(it)); });
      }
      wrap.appendChild(card);
      body.appendChild(wrap);
    });
  }

  function load(who) {
    var q = who ? ("?who=" + encodeURIComponent(who)) : "";
    fetch("/api/v1/home/agenda" + q, { headers: { accept: "application/json" } })
      .then(function (r) {
        if (!r.ok) { throw new Error("agenda: " + r.status); }
        return r.json();
      })
      .then(function (j) { page = j; paint(); })
      .catch(function () {
        page = { available: false, problem: "Wildstone isn't answering." };
        paint();
      });
  }

  load("");
})();
</script>
