# Identity capability: LLDAP (directory) + Authelia (SSO/OIDC provider),
# profile "authelia-lldap". Provides trait identity:oidc, which is what
# lets other packages (e.g. photos-immich) `require: [{trait: identity,
# mode: oidc}]` and receive .Resolved.IssuerURL / .Resolved.OidcSecretRef.
#
# Image digests are REAL, resolved at authoring time (2026-07-30) from the
# public registries — not placeholders:
#   lldap/lldap:stable                    -> sha256:2a8454b6...11ca8
#   authelia/authelia:latest              -> sha256:1b363e92...ff51b
# See packages/README.md for how these were resolved and how to refresh
# them.
#
# All domains below are example.com placeholders (public_domain is a
# required param); no secret values appear anywhere — LLDAP's admin
# password and Authelia's JWT/session/storage secrets are referenced as
# secret/<name>, resolved only by Wardstone at materialization time
# (ADR-W005 A2), never carried as literals here.
apiVersion: wildstone.dev/v1
kind: Package
metadata:
  name: identity
  version: 1.0.0
  capability: identity
  profile: authelia-lldap
provides:
  - { trait: identity, mode: oidc }
  # The package deploys LLDAP itself, so the directory is equally its
  # provision — media-jellyfin's LDAP-Auth posture requires it
  # (ADR-W013 A2).
  - { trait: identity, mode: ldap }
params:
  - { name: public_domain, required: true }
  - { name: node, required: true }
  # The directory's base DN. It now appears in two places that MUST
  # agree — LLDAP's own env and Authelia's authentication_backend — so it
  # is a param rather than a literal repeated twice.
  - { name: ldap_base_dn, default: "dc=wildstone,dc=internal" }
policies:
  classifications: [family_public, admin_tailscale]
  dataSensitivity: high
templates:
  # ---- LLDAP: the directory Authelia authenticates users against.
  - |
    apiVersion: wildstone.dev/v1
    kind: Volume
    metadata: { name: lldap-data, node: "{{ .Params.node }}" }
    spec: { name: lldap-data }
  - |
    apiVersion: wildstone.dev/v1
    kind: Container
    metadata: { name: lldap, node: "{{ .Params.node }}" }
    spec:
      image: "lldap/lldap@sha256:2a8454b668c1aba7157e832eab0e242e1e7eb5fb7591d7e7774ba05286511ca8"
      env:
        LLDAP_LDAP_BASE_DN: "{{ .Params.ldap_base_dn }}"
        LLDAP_LDAP_USER_PASS: "secret/lldap-admin-password"
        LLDAP_JWT_SECRET: "secret/lldap-jwt-secret"
      mounts:
        - { source: lldap-data, target: /data }
      restart: unless-stopped
  # ---- Authelia: the SSO/OIDC provider. It registers OidcClient resources
  # on behalf of consuming packages (ADR-W005 A3): the reconciler renders
  # each OidcClient into this capability's managed Authelia config fragment
  # and batches the reload, independent of which package's template
  # produced the OidcClient resource.
  - |
    apiVersion: wildstone.dev/v1
    kind: Volume
    metadata: { name: authelia-config, node: "{{ .Params.node }}" }
    spec: { name: authelia-config }
  # ---- Authelia's own configuration. The PACKAGE owns this, not the
  # control plane: an LDAP base DN, a storage backend and a notifier are
  # this profile's facts, and putting them in Keystone would be the
  # layering ADR-W005 exists to prevent (ADR-W019 / the ConfigFile kind).
  #
  # identity_providers is deliberately ABSENT here. Authelia REPLACES a
  # list across config files rather than merging it, so the OIDC block —
  # clients, jwks, policies — lives entirely in the clients.yml Keystone
  # renders from every OidcClient in the deployment. One file owns that
  # key; this one never mentions it.
  #
  # secret/<name> references are resolved on the node at write time. This
  # file never contains a secret value, and Keystone never sees one.
  - |
    apiVersion: wildstone.dev/v1
    kind: ConfigFile
    metadata: { name: authelia-configuration, node: "{{ .Params.node }}" }
    spec:
      filename: configuration.yml
      content: |
        # managed by wildstone — do not edit
        theme: light
        log:
          level: info

        # 4.38 moved this out of the top-level jwt_secret.
        identity_validation:
          reset_password:
            jwt_secret: secret/authelia-jwt-secret

        authentication_backend:
          password_reset:
            disable: true
          ldap:
            implementation: lldap
            address: ldap://lldap:3890
            base_dn: {{ .Params.ldap_base_dn }}
            # LLDAP puts people under ou=people and calls the login
            # attribute uid; cn is the DISPLAY name, so binding on it
            # makes people log in as "Alice Example".
            users_filter: "(&({username_attribute}={input})(objectClass=person))"
            groups_filter: "(member={dn})"
            user: uid=admin,ou=people,{{ .Params.ldap_base_dn }}
            password: secret/lldap-admin-password

        session:
          name: authelia_session
          secret: secret/authelia-session-secret
          cookies:
            - domain: {{ .Params.public_domain }}
              # MUST be https. 4.39 refuses a non-secure scheme here, and
              # this is the browser-visible URL — never the reverse
              # proxy's own listener scheme, which is plain http behind
              # the tunnel.
              authelia_url: https://auth.{{ .Params.public_domain }}
              default_redirection_url: https://{{ .Params.public_domain }}

        storage:
          encryption_key: secret/authelia-storage-encryption-key
          local:
            path: /config/db.sqlite3

        # A homelab has no mail relay to depend on, and an identity
        # provider that will not start because SMTP is unreachable is a
        # worse failure than one that writes notifications to a file.
        notifier:
          disable_startup_check: true
          filesystem:
            filename: /config/notification.txt

        access_control:
          # Everything not named below is denied. Route fragments are
          # what grant access, per-host, and a default of anything else
          # would make an unlisted host quietly reachable.
          default_policy: deny
          rules:
            - domain: auth.{{ .Params.public_domain }}
              policy: bypass

        regulation:
          max_retries: 4
          find_time: 2m
          ban_time: 10m
  - |
    apiVersion: wildstone.dev/v1
    kind: Container
    metadata: { name: authelia, node: "{{ .Params.node }}" }
    spec:
      image: "authelia/authelia@sha256:1b363e9279e742397966333f364e0876ae02bf5c876de73e83af6d48c57ff51b"
      # Point Authelia at BOTH managed files. Without this it reads
      # X_AUTHELIA_CONFIG's default, /config/configuration.yml — the
      # config it seeds for itself on first start — which is why every
      # rendered client was invisible no matter how correct clients.yml
      # was. Passing --config replaces that default outright, so the
      # self-seeded file stops mattering.
      #
      # Flags only, no binary: the image's ENTRYPOINT is
      # ["/app/entrypoint.sh"], which execs `authelia "$@"`. Wildstone
      # maps command to Docker's Cmd, and Cmd is the WHOLE argv only
      # when an image has no entrypoint — the mistake that killed every
      # Caddy container in the v0.1.1-alpha validation (F23), which is
      # why keystone/pkgtool's imageArgv0 table demands evidence per
      # image before a command may be added. That entrypoint has a
      # branch for exactly this shape: it execs its arguments directly
      # UNLESS the first is --config, in which case authelia gets them.
      #
      # Order matters, and so does the split. Authelia merges these
      # last-wins per key and does NOT merge lists — its own docs call
      # splitting access control rules or OIDC clients across files
      # "asking for trouble", and the hand-build confirmed it by having
      # one file's clients silently replace another's. So each list-
      # valued section lives in exactly one file: access_control here,
      # identity_providers there.
      command:
        - "--config"
        - "/etc/wildstone/identity/configuration.yml"
        - "--config"
        - "/etc/wildstone/authelia/clients.yml"
      env:
        AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: "secret/authelia-oidc-hmac-secret"
        AUTHELIA_JWT_SECRET_FILE: "secret/authelia-jwt-secret"
        AUTHELIA_SESSION_SECRET_FILE: "secret/authelia-session-secret"
        AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: "secret/authelia-storage-encryption-key"
      mounts:
        - { source: authelia-config, target: /config }
        # Two read-only subtrees of the managed prefix, because the two
        # managed files are named by two different rules and both rules
        # are right:
        #
        #   <prefix>/identity/    a ConfigFile's directory comes from its
        #                         owning capability, uniformly for every
        #                         package that ships one — this is where
        #                         configuration.yml above lands.
        #   <prefix>/authelia/    the reconciler's Authelia-specific
        #                         renderings, named for the provider that
        #                         reads them (ADR-W005 A3/B1): clients.yml,
        #                         merged from every OidcClient in the
        #                         deployment, and the per-client fragments
        #                         it is merged from.
        #
        # Subtrees rather than the whole prefix: this container has no
        # business reading the ingress capability's files, and the
        # narrowest mount that works is the one to ship (ADR-W018, and
        # the lesson of the agent data directory).
        - { source: /etc/wildstone/identity, target: /etc/wildstone/identity, readOnly: true }
        - { source: /etc/wildstone/authelia, target: /etc/wildstone/authelia, readOnly: true }
      restart: unless-stopped
  # ---- Route: auth.<public_domain> — no auth on the auth Route itself
  # (Authelia IS the auth; gating logins behind Authelia's own login page
  # would be circular).
  - |
    apiVersion: wildstone.dev/v1
    kind: Route
    metadata: { name: auth, node: "{{ .Params.node }}" }
    spec:
      host: "auth.{{ .Params.public_domain }}"
      upstream: "container/authelia:9091"
      # portal: this route IS the identity provider's own login surface —
      # public by necessity (a login page cannot sit behind itself), and
      # policy-distinct from auth: none (ADR-W009/E5).
      auth: portal
      classification: family_public
