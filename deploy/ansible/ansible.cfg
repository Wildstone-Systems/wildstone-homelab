# Managed by Wildstone. The only Ansible configuration the engine
# playbooks run with: engine-try.sh (and later Wardstone) points
# ANSIBLE_CONFIG here, so no config from the working directory, the
# user's home or /etc/ansible applies. It is part of the signed set.
[defaults]
retry_files_enabled = False
nocows = True
# Use the host's python3 without the discovery warning.
interpreter_python = auto_silent
