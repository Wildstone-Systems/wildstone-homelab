<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Secrets</title>
    <link rel="stylesheet" href="/portal/assets/nocturne.css" />
    <!--wildstone:theme-->
    <style>
      main {
        max-width: 48rem;
        margin: 2rem auto;
        padding: 1rem;
      }
      label {
        display: block;
        margin: 1rem 0;
      }
      input,
      select,
      button {
        padding: 0.6rem;
        margin: 0.3rem;
      }
      article {
        padding: 1rem;
        border: 1px solid var(--color-divider);
        border-radius: 12px;
        background: var(--color-surface);
        margin: 1rem 0;
      }
      input,
      select {
        max-width: 100%;
        box-sizing: border-box;
        background: var(--color-bg);
        color: var(--color-text);
        border: 1px solid var(--color-divider);
        border-radius: 6px;
      }
      button {
        background: var(--color-surface);
        color: var(--color-text);
        border: 1px solid var(--color-accent);
        border-radius: 6px;
        cursor: pointer;
      }
      a {
        color: var(--color-accent-200);
      }
      output {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <a href="/home/">Home</a>
      <h1>Secrets</h1>
      <p>
        Personal values belong to you and cannot be revealed here. To share a
        value, explicitly submit a separate Household copy for an Owner to
        inspect and approve.
      </p>
      <form id="entry">
        <label
          >Safe label (do not include the value)<input
            id="label"
            maxlength="64"
            required
            pattern="[A-Za-z][A-Za-z0-9 ._-]{0,63}" /></label
        ><label
          >Secret value<input
            id="value"
            type="password"
            autocomplete="new-password"
            required
            maxlength="8192" /></label
        ><label
          >Storage<select id="scope">
            <option value="personal">Personal — only mine</option>
            <option value="household">
              Submit Household copy — an Owner may inspect this value
            </option>
          </select></label
        ><button>Store securely</button>
      </form>
      <label
        >Agent name for grants or Household reveal<input
          id="agent"
          autocomplete="off"
      /></label>
      <p id="error" role="alert"></p>
      <div id="protected" hidden>
        <output id="revealed"></output><button id="hide">Hide now</button>
        <p>Hidden after 15 seconds or when you leave this window.</p>
      </div>
      <section id="list" aria-label="Stored secrets"></section>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      let timer;
      function hide() {
        clearTimeout(timer);
        $("revealed").textContent = "";
        $("protected").hidden = true;
      }
      window.addEventListener("blur", hide);
      document.addEventListener("visibilitychange", hide);
      $("hide").onclick = hide;
      async function request(path, body) {
        const r = await fetch("/api/v1/home/secrets" + path, {
          method: body ? "POST" : "GET",
          headers: { "Content-Type": "application/json" },
          body: body ? JSON.stringify(body) : undefined,
          cache: "no-store",
        });
        const d = await r.json();
        if (!r.ok) throw Error(d.error || "Request refused");
        return d;
      }
      async function act(id, operation, body) {
        hide();
        $("error").textContent = "";
        try {
          const d = await request(
            "/" + encodeURIComponent(id) + "/" + operation,
            body,
          );
          if (
            d.value &&
            document.visibilityState === "visible" &&
            document.hasFocus()
          ) {
            $("revealed").textContent = d.value;
            $("protected").hidden = false;
            timer = setTimeout(hide, 15000);
          }
          await load();
        } catch (e) {
          $("error").textContent = e.message;
        }
      }
      function button(parent, text, fn) {
        const b = document.createElement("button");
        b.textContent = text;
        b.onclick = fn;
        parent.append(b);
      }
      async function load() {
        try {
          const d = await request("");
          $("list").replaceChildren();
          for (const s of d.secrets) {
            const a = document.createElement("article"),
              h = document.createElement("h2");
            h.textContent = s.label;
            a.append(h);
            const p = document.createElement("p");
            p.textContent = s.scope + " · " + s.state;
            a.append(p);
            if (s.state === "active") {
              if (s.scope === "personal") {
                button(a, "Submit Household copy for Owner review", () => {
                  if (
                    confirm(
                      "An Owner may inspect this submitted copy. Your Personal original will stay private and unchanged. Continue?",
                    )
                  )
                    act(s.id, "submit", {});
                });
                button(a, "Use for my configured calendar agenda", () =>
                  act(s.id, "calendar", {}),
                );
                for (const allow of [true, false])
                  button(
                    a,
                    (allow ? "Allow" : "Revoke") + " Agent calendar use",
                    () =>
                      act(s.id, "agent", {
                        agent: $("agent").value,
                        purpose: "calendar.get_agenda",
                        allow,
                      }),
                  );
              } else
                button(a, "Reveal Household value", () =>
                  act(s.id, "reveal", { agent: $("agent").value }),
                );
            }
            $("list").append(a);
          }
        } catch (e) {
          $("error").textContent = e.message;
        }
      }
      $("entry").onsubmit = async (e) => {
        e.preventDefault();
        hide();
        const scope = $("scope").value;
        if (
          scope === "household" &&
          !confirm(
            "An Owner may inspect this submitted value. Your Personal original is unchanged. Continue?",
          )
        )
          return;
        const value = $("value").value;
        $("value").value = "";
        try {
          await request("", {
            scope,
            label: $("label").value,
            value,
            submit: scope === "household",
          });
          await load();
        } catch (e) {
          $("error").textContent = e.message;
        }
      };
      load();
    </script>
  </body>
</html>
