# Release pipeline (ADR-W014 A1): a v* tag builds keystone, wardstoned,
# and wild for linux amd64/arm64 — CGO_ENABLED=0 throughout (the pure-Go
# SQLite choice exists exactly so this cross-compile is boring) — and
# publishes one tar.gz per binary/arch, install.sh, and a single
# checksums.txt the installer verifies against.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # The Console is shipped as its own release asset so a control-plane
      # host never needs Node. Building it took 568 apt packages and three
      # seconds to produce 160 KB, on a machine whose job is running
      # containers (#34).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: build console
        run: |
          set -euo pipefail
          cd console && npm ci && npm run build
      - name: build matrix
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          build() { # build <name> <module-dir> <package>
            local name="$1" dir="$2" pkg="$3"
            for arch in amd64 arm64; do
              ( cd "$dir" && GOARCH="$arch" go build -trimpath \
                  -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
                  -o "../dist/$name" "$pkg" )
              tar -czf "dist/${name}_linux_${arch}.tar.gz" -C dist "$name"
              rm "dist/$name"
            done
          }
          build keystone   keystone  ./cmd/keystone
          build wardstoned wardstone ./cmd/wardstoned
          build wild       cli       ./cmd/wild
          # The Console's built output. Architecture-independent — it is
          # static files a browser runs — so it has no _linux_<arch>
          # suffix, and install.sh fetches it by that plain name.
          tar -czf dist/console_dist.tar.gz -C console/dist .
          cp scripts/install.sh dist/install.sh
          # Bare names, no ./ prefix: the installer greps checksums.txt
          # for " <artifact>$" and verifies in its own workdir.
          ( cd dist && sha256sum -- *.tar.gz install.sh > checksums.txt )
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # Idempotent: publishing a release from the GitHub UI creates the
        # tag AND the release together, so this workflow's create then
        # collides ("a release with the same tag name already exists") and
        # the release ships with zero assets. Fall back to uploading onto
        # the existing release instead.
        run: |
          if ! gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes; then
            echo "release exists; uploading assets onto it"
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          fi
