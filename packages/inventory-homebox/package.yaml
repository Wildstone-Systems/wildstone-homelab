# Inventory capability, profile "homebox": what the household owns,
# where it is, what it cost, when the warranty ends — with labels you
# can print and scan.
#
# SINGLE SIGN-ON. Homebox speaks OpenID Connect itself, so the Route is
# app_oidc with an OidcClient registration and the household account
# signs in here. app_oidc rather than authelia_oidc deliberately: the
# proxy PASSES THROUGH for app_oidc (only authelia_oidc emits
# forward_auth), so Homebox's API — which label scanning and any
# integration use with an API key, not a browser session — keeps
# working. A Route's auth is per-host with no path matching, so
# forward-auth here would gate the API along with the web UI.
#
# HOW IT IS CONFIGURED: environment. Homebox parses its whole config
# with ardanlabs/conf under the prefix HBOX, so OIDC is HBOX_OIDC_*
# — the same door HBOX_AUTH_API_KEY_PEPPER already comes through.
# This is worth stating because it is NOT the common case: the apps
# checked alongside it (Audiobookshelf, Kavita) keep OIDC settings in a
# database or a config file and ignore the environment entirely.
#
# Homebox builds its own redirect URL from the incoming request rather
# than from a configured base URL, so there is no self-referential URL
# to get wrong under the tailnet posture (ADR-W019 A10).
#
# HBOX_OPTIONS_ALLOW_REGISTRATION is left as it was. Whether Homebox
# gates OIDC account provisioning on it was not established, and
# closing registration on an unverified guess would lock the household
# out of the login this change exists to enable.
#
# Everything is one volume, backed up daily.
#
# Image digest is REAL, resolved 2026-09-07 via the OCI registry API:
#   ghcr.io/sysadminsmedia/homebox:latest -> sha256:b1ad7e3c...60cc
apiVersion: wildstone.dev/v1
kind: Package
metadata:
  name: inventory-homebox
  version: 1.1.1
  capability: inventory
  profile: homebox
requires:
  - { trait: identity, mode: oidc }
  - { trait: ingress, mode: private }
params:
  - { name: public_domain, required: true, description: "The domain your services are named under, e.g. home.example.com. Under a tailnet this is a label rather than an address you type.", source: domain }
  - { name: inventory_subdomain, default: inventory, description: "The name this service appears under, e.g. inventory." }
  - { name: node, required: true, description: "Which machine to install this on.", source: node }
  - { name: timezone, default: UTC, source: timezone, validate: iana_timezone, description: "Your timezone, e.g. Europe/London." }
policies:
  classifications: [family_private]
  dataSensitivity: medium
templates:
  - |
    apiVersion: wildstone.dev/v1
    kind: Secret
    metadata: { name: restic-inventory, node: "{{ .Params.node }}" }
    spec: { name: restic-inventory }
  # Homebox REFUSES TO START without this. Not a warning and not a
  # generated default — it panics before it opens its database:
  #
  #   panic: auth.api_key_pepper must be set to at least 32 bytes
  #
  # The package shipped without it, so the container reconciled, Docker
  # reported it, and it crash-looped 58 times behind a 502 while every
  # Wildstone surface said the capability was installed and healthy.
  #
  # 48 bytes because that is what the app's own message tells an
  # operator to generate; the node base64-encodes it, so what the
  # process receives is comfortably past the 32-byte floor.
  - |
    apiVersion: wildstone.dev/v1
    kind: Secret
    metadata: { name: homebox-api-key-pepper, node: "{{ .Params.node }}" }
    spec:
      name: homebox-api-key-pepper
      lengthBytes: 48
      purpose: "Signs Homebox's API keys. Nobody types it — but rotating it invalidates every API key already issued, so anything scanning labels through the API has to be re-authorised."
  - |
    apiVersion: wildstone.dev/v1
    kind: Volume
    metadata: { name: homebox-data, node: "{{ .Params.node }}" }
    spec: { name: homebox-data }
  - |
    apiVersion: wildstone.dev/v1
    kind: Volume
    metadata: { name: inventory-backup-repo, node: "{{ .Params.node }}" }
    spec: { name: inventory-backup-repo }
  - |
    apiVersion: wildstone.dev/v1
    kind: Container
    metadata: { name: homebox, node: "{{ .Params.node }}" }
    spec:
      image: "ghcr.io/sysadminsmedia/homebox@sha256:b1ad7e3c63f732a5f6daa466e8116be4f545b3b120383a64dcb62beb00a660cc"
      env:
        TZ: "{{ .Params.timezone }}"
        HBOX_LOG_LEVEL: info
        HBOX_OPTIONS_ALLOW_REGISTRATION: "true"
        HBOX_OPTIONS_ALLOW_ANALYTICS: "false"
        HBOX_AUTH_API_KEY_PEPPER: "secret/homebox-api-key-pepper"
        HBOX_OIDC_ENABLED: "true"
        HBOX_OIDC_ISSUER_URL: "{{ .Resolved.IssuerURL }}"
        HBOX_OIDC_CLIENT_ID: homebox
        HBOX_OIDC_CLIENT_SECRET: "{{ .Resolved.OidcSecretRef }}"
        HBOX_OIDC_BUTTON_TEXT: "Sign in with your household account"
        # Off so the app's own login stays reachable. An operator locked
        # out by a provider misconfiguration needs a way back in that
        # does not go through the provider.
        HBOX_OIDC_AUTO_REDIRECT: "false"
      mounts:
        - { source: homebox-data, target: /data }
      restart: unless-stopped
  - |
    apiVersion: wildstone.dev/v1
    kind: Route
    metadata: { name: inventory, node: "{{ .Params.node }}" }
    spec:
      host: "{{ .Params.inventory_subdomain }}.{{ .Params.public_domain }}"
      upstream: "container/homebox:7745"
      auth: app_oidc
      classification: family_private
  # The OidcClient lives on THIS package's node, not on a separate
  # identity node: the engine synthesises the client secret on the
  # OidcClient's node and the container reads the same reference on its
  # own node, and secrets are node-local.
  #
  # The redirect URI is Homebox's dedicated OIDC callback, not its login
  # page — GET /api/v1/users/login/oidc/callback. Built by concatenation
  # on purpose: redirectUris are compensated downstream by the
  # reconciler, unlike an env value, which would need `origin`.
  - |
    apiVersion: wildstone.dev/v1
    kind: OidcClient
    metadata: { name: homebox, node: "{{ .Params.node }}" }
    spec:
      clientId: homebox
      clientName: Homebox
      redirectUris:
        - "https://{{ .Params.inventory_subdomain }}.{{ .Params.public_domain }}/api/v1/users/login/oidc/callback"
      scopes: [openid, profile, email, groups]
      authPolicy: two_factor
      secretRef: "{{ .Resolved.OidcSecretRef }}"
  - |
    apiVersion: wildstone.dev/v1
    kind: BackupPlan
    metadata: { name: inventory, node: "{{ .Params.node }}" }
    spec:
      volumes: [homebox-data]
      repository: inventory-backup-repo
      passwordSecret: secret/restic-inventory
      schedule: daily
      class: critical
      retention: { keepDaily: 7, keepWeekly: 4 }
