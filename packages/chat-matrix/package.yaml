# Chat (Matrix) for one Agent: one bot, connecting the household's
# people to that Agent (ADR-W033 B7, amended B7.1).
#
# ONE INSTALL, ONE BOT. This package is INSTANCED (#246): every install
# is its own bot with its own name, token and container, named
# "chat-matrix-<instance>". The instance defaults to the Agent's name. Install
# it as many times as there are bots to run. Nothing here says "family"
# or "admin": who a bot admits follows the Agent it belongs to (an
# Owner-class Agent admits Owners only), not the package.
#
# YOU DO NOT INSTALL THIS BY HAND. The Console's Connect screen does it:
# the Owner picks the Agent, the Person and pastes the credential, and
# Keystone mints the adapter's Keystone token, stores the platform
# credential as this instance's provided secret, installs the instance
# and has the Agent hand the Person their invite key (B7.1).
#
# WHAT THIS RUNS. The chat adapter (cli/cmd/chat-adapter), which speaks
# Matrix on one side and Keystone's chat contract on the other. Its
# Keystone token holds the converse verb and nothing else, so a
# compromised adapter can relay messages for accounts a human already
# bound, and cannot read the house, propose anything, or approve
# anything.
#
# NO IMAGE OF OURS, NO REGISTRY. The adapter program ships with every
# release and the installer puts it on each host at
# /srv/wildstone/bin/chat-adapter. This package runs it in Google's
# public distroless static image, pinned by digest (ADR-W003 A4.2), with
# that directory bind-mounted read-only. The directory rather than the
# file, so an upgrade that replaces the program is seen by the container
# the next time it starts; a file mount would keep the old one. It is
# under /srv/wildstone because Wardstone mounts nothing from anywhere
# else. Distroless has the CA
# certificates the adapter needs, no shell and no package manager, and
# runs as a non-root user. A private repository stays private and a
# node needs no registry credential.
#
# NO INGRESS. The adapter dials out; there is no Route and no port.
#
# THE BOT ACCOUNT. An ordinary Matrix account on your homeserver, used
# as the bot. The Owner gives its homeserver address and its access
# token.
#
# ON THE HOUSEHOLD'S OWN HOMESERVER, none of that (ADR-W033 B7.2). With
# homeserver_url empty the bot is an application service of matrix-synapse
# on the same node: its token is generated here and never seen, a
# MatrixAppService registers it as the user @wildstone-<instance>, and the
# adapter reaches Synapse on the container network instead of through the
# household's front door. No person's account, password or sign-in is
# involved, so the bot cannot sign in to anything else the household runs.
apiVersion: wildstone.dev/v1
kind: Package
metadata:
  name: chat-matrix
  version: 2.1.1
  capability: chat-matrix
  profile: matrix
  instanced: true
params:
  - { name: instance, required: true, description: "This bot's name within the household; defaults to its Agent's name." }
  - { name: node, required: true, source: node, description: "Which machine runs the adapter." }
  - name: keystone_url
    required: true
    source: keystone_url
    description: "The Keystone API as the ADAPTER can reach it — usually the tailnet address, not 127.0.0.1."
    example: "http://100.64.0.1:9441"
  - { name: homeserver_url, default: "", example: "https://matrix.example.com", description: "The homeserver the bot account lives on. Leave empty to use this household's own Matrix homeserver, which must run on the same machine." }
  - { name: display_name, default: "", description: "The name the bot shows in Matrix, on the household's own homeserver. Defaults to the instance name." }
templates:
  - |
    apiVersion: wildstone.dev/v1
    kind: Secret
    metadata: { name: "{{ .Capability }}-token", node: "{{ .Params.node }}" }
    # Pasted by the Owner for another homeserver; generated on the node for
    # the household's own, where it is the application service's token.
    spec: { name: "{{ .Capability }}-token", provided: {{ if .Params.homeserver_url }}true{{ else }}false{{ end }} }
  - |
    {{- if not .Params.homeserver_url }}
    apiVersion: wildstone.dev/v1
    kind: Secret
    metadata: { name: "{{ .Capability }}-hs-token", node: "{{ .Params.node }}" }
    spec:
      name: "{{ .Capability }}-hs-token"
      purpose: "The token Synapse would present to this bot. Required by the registration; nothing is pushed today."
    {{- end }}
  - |
    {{- if not .Params.homeserver_url }}
    apiVersion: wildstone.dev/v1
    kind: MatrixAppService
    metadata: { name: "{{ .Capability }}", node: "{{ .Params.node }}" }
    spec:
      botLocalpart: "wildstone-{{ .Params.instance }}"
      asTokenRef: "secret/{{ .Capability }}-token"
      hsTokenRef: "secret/{{ .Capability }}-hs-token"
    {{- end }}
  - |
    apiVersion: wildstone.dev/v1
    kind: Secret
    metadata: { name: "{{ .Capability }}-adapter", node: "{{ .Params.node }}" }
    spec: { name: "{{ .Capability }}-adapter", provided: true }
  - |
    apiVersion: wildstone.dev/v1
    kind: Container
    metadata: { name: "{{ .Capability }}", node: "{{ .Params.node }}" }
    spec:
      image: "gcr.io/distroless/static-debian12@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab"
      command: ["/opt/wildstone/bin/chat-adapter"]
      mounts:
        - { source: /srv/wildstone/bin, target: /opt/wildstone/bin, readOnly: true }
      env:
        CHAT_TRANSPORT: matrix
        KEYSTONE_API: "{{ .Params.keystone_url }}"
        # The household's own homeserver by its container name: same node,
        # same container network, and no trip through the ingress.
        MATRIX_HOMESERVER: "{{ or .Params.homeserver_url "http://matrix-synapse:8008" }}"
        MATRIX_ACCESS_TOKEN: "secret/{{ .Capability }}-token"
        {{- if not .Params.homeserver_url }}
        MATRIX_APPSERVICE_LOCALPART: "wildstone-{{ .Params.instance }}"
        MATRIX_DISPLAY_NAME: "{{ or .Params.display_name .Params.instance }}"
        {{- end }}
        KEYSTONE_TOKEN: "secret/{{ .Capability }}-adapter"
      restart: unless-stopped
agentTools:
  - { name: send, risk: domestic }
