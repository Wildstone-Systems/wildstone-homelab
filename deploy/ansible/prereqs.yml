# Host prerequisites for the k3s engine (W050 slice 3, #159).
# Idempotent; run on every server before k3s-server.yml.
- name: Wildstone engine prerequisites
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  tasks:
    - name: Refuse anything but Debian or Ubuntu
      ansible.builtin.assert:
        that: ansible_facts['os_family'] == 'Debian'
        fail_msg: "The engine bootstrap supports Debian and Ubuntu only; this is {{ ansible_facts['distribution'] }}."

    - name: Install packages the engine and its storage need
      ansible.builtin.apt:
        name: [curl, open-iscsi, nfs-common]
        state: present
        update_cache: true
        cache_valid_time: 3600

    # Longhorn attaches each volume over local iSCSI (W050 slice 3b-3).
    - name: Load the iSCSI kernel module now and at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/wildstone-longhorn.conf
        mode: "0644"
        content: |
          iscsi_tcp
      notify: Load kernel modules

    - name: Run the iSCSI daemon Longhorn needs
      ansible.builtin.systemd:
        name: iscsid
        enabled: true
        state: started

    # multipathd (on by default on Ubuntu server) claims Longhorn's iSCSI
    # disks and the volume then can't be mounted. Exclude only Longhorn's
    # own devices, so a real multipath setup on the host is untouched.
    - name: Check for multipath
      ansible.builtin.stat:
        path: /etc/multipath
      register: wildstone_multipath

    - name: Multipath drop-in directory
      ansible.builtin.file:
        path: /etc/multipath/conf.d
        state: directory
        mode: "0755"
      when: wildstone_multipath.stat.exists

    - name: Keep multipath away from Longhorn volumes
      ansible.builtin.copy:
        dest: /etc/multipath/conf.d/wildstone-longhorn.conf
        mode: "0644"
        content: |
          # Managed by Wildstone. Longhorn's iSCSI target (tgt) reports
          # vendor IET, product VIRTUAL-DISK.
          blacklist {
              device {
                  vendor "IET"
                  product "VIRTUAL-DISK"
              }
          }
      when: wildstone_multipath.stat.exists
      notify: Reload multipath

    # k3s runs with protect-kernel-defaults, which refuses to start unless
    # these are already set (the values the kubelet would otherwise change).
    - name: Kernel settings the kubelet requires
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-wildstone-k3s.conf
        mode: "0644"
        content: |
          vm.panic_on_oom = 0
          vm.overcommit_memory = 1
          kernel.panic = 10
          kernel.panic_on_oops = 1
      notify: Apply kernel settings

  handlers:
    - name: Apply kernel settings
      ansible.builtin.command: sysctl --system
      changed_when: true

    - name: Load kernel modules
      ansible.builtin.command: modprobe iscsi_tcp
      changed_when: true

    - name: Reload multipath
      ansible.builtin.systemd:
        name: multipathd
        state: restarted
      failed_when: false
