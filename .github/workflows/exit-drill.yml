name: exit drill

# The E13 exit drill (ADR-W018 A1): total-host-loss restore, unattended,
# against the real binaries, the runner's real Docker daemon, and the
# pinned restic image. Weekly from the moment backups landed (scope E13),
# plus on demand. A failure here is a release blocker: it means "you can
# lose the host and keep your data" stopped being true.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  total-host-loss:
    name: total-host-loss restore (ADR-W018)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Run the drill
        run: ./scripts/exit-drill.sh
        env:
          WILDSTONE_DRILL_WORK: ${{ runner.temp }}/exit-drill
      - name: Upload drill logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: exit-drill-logs
          path: ${{ runner.temp }}/exit-drill/*.log
          if-no-files-found: ignore
