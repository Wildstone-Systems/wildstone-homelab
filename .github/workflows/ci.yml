name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # gitleaks-action enumerates a PR's commits via the API on pull_request
  # events; without this it 403s ("Resource not accessible by integration").
  pull-requests: read

jobs:
  secrets-scan:
    name: secret scan (gitleaks)
    runs-on: [self-hosted, dev-services]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A HOSTED RUNNER GETS A FRESH _temp EVERY JOB; A SELF-HOSTED ONE
      # DOES NOT. gitleaks-action downloads its release tarball to
      # $RUNNER_TEMP/gitleaks.tmp and REFUSES to overwrite an existing
      # file there, with "Destination file path ... already exists" — it
      # retries twice and then throws. So a single job killed mid-download
      # (a runner restart, a cancelled run) leaves a stub behind that
      # fails this job on every subsequent run, on every branch, until
      # somebody removes it by hand. That is a check wedged red with no
      # commit able to fix it, which is exactly what happened when #258
      # moved these jobs onto self-hosted runners.
      #
      # Nothing may reuse this file between jobs, so deleting it is only
      # ever discarding a half-written download.
      #
      # THE PATH IS NOT $RUNNER_TEMP. The action resolves it with node's
      # `os.tmpdir()`, which reads TMPDIR and falls back to /tmp — and
      # this runner sets TMPDIR to its own `_tmp` while RUNNER_TEMP
      # points at `_work/_temp`. A first attempt at this cleared
      # RUNNER_TEMP, ran green as a step, and changed nothing. So ask
      # node the same question the action asks, and only guess if node
      # is somehow not on PATH.
      - name: clear a half-written gitleaks download from a killed job
        shell: bash
        run: |
          set -u
          tmp="${TMPDIR:-/tmp}"
          if command -v node >/dev/null 2>&1; then
            tmp="$(node -p 'require("os").tmpdir()')"
          fi
          for d in "$tmp" "$RUNNER_TEMP"; do
            if [ -e "$d/gitleaks.tmp" ]; then
              echo "removing stale $d/gitleaks.tmp"
              rm -f "$d/gitleaks.tmp"
            fi
          done
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  installer:
    name: shell scripts (ADR-W014/W018)
    runs-on: [self-hosted, dev-services]
    steps:
      - uses: actions/checkout@v4
      - name: syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      # Pinned by digest, like every other image this project runs
      # (ADR-W003 A4.2's reasoning, applied to CI). ubuntu-latest's
      # shellcheck is whatever GitHub last put in the runner image, and
      # it silently differs from any modern dev machine: 0.9.0 here
      # against 0.11.0 locally, which reports SC2015 on `a && b || fail`
      # where 0.11 does not. A shell change can therefore be clean
      # locally and fail here, or — worse — stop being checked at all
      # the day GitHub bumps the runner.
      #
      # Run the identical check before pushing:
      #   docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.9.0 scripts/*.sh
      #
      # Bumping the version is a deliberate, reviewed change, which is
      # the whole point of pinning it.
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" \
            koalaman/shellcheck@sha256:f35e8987b02760d4e76fc99a68ad5c42cc10bb32f3dd2143a3cf92f1e5446a45 \
            scripts/*.sh
      # The Console asset's name lives in two files that never see each
      # other: release.yml produces it, install.sh fetches it. A rename
      # in one would not fail anything until a release was cut and an
      # install came back with no Console, so assert they agree.
      - name: release and installer agree on the console asset
        run: |
          set -euo pipefail
          grep -q 'console_dist\.tar\.gz' .github/workflows/release.yml \
            || { echo "release.yml no longer produces console_dist.tar.gz"; exit 1; }
          grep -q 'console_dist\.tar\.gz' scripts/install.sh \
            || { echo "install.sh no longer fetches console_dist.tar.gz"; exit 1; }
          grep -q 'packages\.tar\.gz' .github/workflows/release.yml \
            || { echo "release.yml no longer produces packages.tar.gz"; exit 1; }
          grep -q 'packages\.tar\.gz' scripts/install.sh \
            || { echo "install.sh no longer fetches packages.tar.gz"; exit 1; }
          grep -q 'wallpapers\.tar\.gz' .github/workflows/release.yml \
            || { echo "release.yml no longer produces wallpapers.tar.gz"; exit 1; }
          grep -q 'wallpapers\.tar\.gz' scripts/install.sh \
            || { echo "install.sh no longer fetches wallpapers.tar.gz"; exit 1; }
          # And the pictures themselves are still there to be packed: an
          # empty wallpapers/ would produce a valid tarball of nothing
          # and every theme would quietly lose its picture again.
          [ "$(find wallpapers -maxdepth 1 -type f \( -name '*.webp' -o -name '*.jpg' -o -name '*.png' \) | wc -l)" -gt 0 ] \
            || { echo "wallpapers/ has no pictures in it"; exit 1; }

  console:
    name: console (typecheck + build + checks, ADR-W016/W027)
    runs-on: [self-hosted, dev-services]
    # `playwright` is a devDependency for scripts/ui-check.mjs, which is an
    # operator's check against their own control plane and never runs here.
    # Without this, every install in this job downloads a browser nothing
    # in it will open.
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: install
        run: cd console && npm ci
      - name: typecheck + build
        run: cd console && npm run build
      # The render check proves the screens and the shared components
      # render; the contrast check proves the token set is legible on
      # both grounds (ADR-W027). Neither needs a browser or a control
      # plane, so both belong here rather than in the e2e job.
      - name: render check
        run: cd console && npm run render-check
      - name: contrast check
        run: cd console && npm run contrast-check

  go:
    name: go (${{ matrix.goarch }})
    runs-on: [self-hosted, dev-services]
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: gofmt
        run: test -z "$(gofmt -l ./proto ./wardstone ./keystone ./cli ./testing/e2e)"
      - name: vet
        run: |
          for m in proto wardstone keystone cli testing/e2e; do (cd "$m" && go vet ./...); done
      - name: build
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          for m in proto wardstone keystone cli testing/e2e; do (cd "$m" && go build ./...); done
      - name: install caddy (route-config validation, #40)
        if: matrix.goarch == 'amd64'
        # keystone/reconcile renders Caddy config; the adapter itself is
        # the only thing that can say whether the result parses. The test
        # skips when caddy is absent, so without this step the check would
        # quietly never run.
        run: go install github.com/caddyserver/caddy/v2/cmd/caddy@v2.8.4
      - name: test
        if: matrix.goarch == 'amd64'
        # -race: the product is concurrent (gateway, agent sessions,
        # reconciler, butler loop); the detector is the cheapest guard
        # against the data races those paths could grow. Requires cgo,
        # available on the amd64 runner.
        #
        # -timeout: go test defaults to 10 minutes PER TEST BINARY, and
        # under -race two packages already sit near it — runtimedb runs
        # 353s on a fast runner and 506s on a slow one, and keystone/api
        # is close behind. Runner speed then decides pass or fail: the
        # same commit has gone green on one machine and panicked at
        # 600.038s on another, with every unrelated package ~40% slower
        # on the slow run. That is a coin toss dressed as a test result,
        # and it costs a 25-minute cycle each time it lands wrong.
        #
        # 30m is headroom rather than a target. The cost itself is dealt
        # with in keystone/internal/dbtemplate, which migrates one
        # database per test binary and copies it: the whole keystone
        # module now runs in under two minutes here rather than four,
        # and butlerstore alone went from 133s to 12s. The ceiling stays
        # because it keeps the failure honest — a timeout should mean
        # something hung, not that the runner was busy.
        env:
          CGO_ENABLED: "1"
        run: |
          for m in proto wardstone keystone cli testing/e2e; do (cd "$m" && go test -race -timeout 30m ./...); done
      - uses: actions/setup-python@v5
        if: matrix.goarch == 'amd64'
        with:
          python-version: "3.12"
      - name: shared calendar CalDAV conformance
        if: matrix.goarch == 'amd64'
        run: |
          calendar_venv="$(mktemp -d "$RUNNER_TEMP/calendar-test.XXXXXX")"
          trap 'rm -rf "$calendar_venv"' EXIT
          python -m venv "$calendar_venv"
          "$calendar_venv/bin/python" -m pip install 'radicale==3.8.0'
          RADICALE_TEST_PYTHON="$calendar_venv/bin/python" go test -v ./keystone/pkgtool -run '^TestSharedCalendarRadicaleDiscovery$'
      - name: ts codegen drift (ADR-W007 A7)
        if: matrix.goarch == 'amd64'
        # The committed console/src/generated/resources.ts must match what
        # the generator emits from keystone/resource — the Console cannot
        # drift from the schema silently.
        run: |
          (cd keystone && go run ./resource/gen -out ../console/src/generated/resources.ts)
          git diff --exit-code console/src/generated/
