# Homarr: a second, hand-arranged start page — tiles, widgets, live
# status for each app — for a household that wants more than the
# generated dashboard. It is its OWN capability rather than a profile
# of `dashboard`: Keystone renders the Homepage dashboard from desired
# state and treats every container of that capability as Homepage, so
# a Homarr filed under it would be handed Homepage's config files.
# Both can be installed; Homepage stays the page Wildstone maintains.
#
# SINGLE SIGN-ON. Homarr speaks OpenID Connect natively, so the Route
# is app_oidc with an OidcClient registration; people sign in with the
# household account, and the first one to do so should be made admin
# from Homarr's own user management.
#
# THE ENCRYPTION KEY is `provided`, not generated: Homarr requires
# exactly 64 hexadecimal characters and validates the shape, and the
# node's generated secrets are base64. Before enabling:
#
#     openssl rand -hex 32 | wild secret set homarr-encryption-key -node <node>
#
# AUTH.JS IS CONFIGURED SEPARATELY FROM THE OIDC PROVIDER, and the three
# variables below are the ones this package originally omitted (#139).
# Homarr is a Next.js app running Auth.js v5, which fails closed:
#
#   - AUTH_SECRET encrypts Auth.js's OWN cookies — the session, and the
#     state/nonce/PKCE cookies the callback verifies. SECRET_ENCRYPTION_KEY
#     is NOT this key; it encrypts Homarr's stored integration
#     credentials. With AUTH_SECRET unset Auth.js invents one per
#     container start, so every re-create silently invalidated every
#     cookie already in a browser — and Auth.js does not discard a cookie
#     it cannot read, it fails the request with
#     `ERR_JWE_DECRYPTION_FAILED`. The visible symptom is a permanent
#     login loop back to /auth/login?error=Configuration, and it survives
#     re-installing because the browser keeps re-presenting the old
#     cookie. After deploying this, clear cookies for the host once.
#   - AUTH_TRUST_HOST tells Auth.js to believe the X-Forwarded-* headers
#     Caddy sets. Without it Auth.js refuses the request (UntrustedHost),
#     which also renders as error=Configuration.
#   - AUTH_URL is the browser-visible base URL it builds its callback and
#     cookie origin from. It comes from `origin`, never from
#     concatenating params: under the tailnet posture a Route is served
#     at the node's one certified name plus a port, not at the host it
#     declares (ADR-W019 A10).
#
# THE ID TOKEN MUST CARRY THE CLAIMS. Homarr maps its user profile from
# the ID token unless AUTH_OIDC_FORCE_USERINFO is set, and Authelia
# delivers scope claims at /userinfo by default — so `email` and `groups`
# were requested, granted, and never seen, which Auth.js reports as
# OAuthProfileParseError. `idTokenClaims` on the OidcClient is what turns
# them into a claims policy.
#
# Image digest is REAL, resolved 2026-09-07 via the OCI registry API:
#   ghcr.io/homarr-labs/homarr:latest -> sha256:f23ad77a...175e
apiVersion: wildstone.dev/v1
kind: Package
metadata:
  name: dashboard-homarr
  version: 1.1.0
  capability: homarr
  profile: homarr
  exclusive: true
requires:
  - { trait: identity, mode: oidc }
  - { trait: ingress, mode: public }
params:
  - { name: public_domain, required: true, description: "The domain your services are named under, e.g. home.example.com. Under a tailnet this is a label rather than an address you type.", source: domain }
  - { name: homarr_subdomain, default: homarr, description: "The name this service appears under, e.g. homarr." }
  - { name: node, required: true, description: "Which machine to install this on.", source: node }
policies:
  classifications: [family_public]
  dataSensitivity: medium
templates:
  - |
    apiVersion: wildstone.dev/v1
    kind: Secret
    metadata: { name: homarr-encryption-key, node: "{{ .Params.node }}" }
    spec: { name: homarr-encryption-key, provided: true }
  - |
    apiVersion: wildstone.dev/v1
    kind: Secret
    metadata: { name: homarr-auth-secret, node: "{{ .Params.node }}" }
    spec:
      name: homarr-auth-secret
      lengthBytes: 32
      purpose: "Encrypts Homarr's own login cookies. Rotating it signs everyone out of Homarr; it is not the key that protects Homarr's stored integration credentials."
  - |
    apiVersion: wildstone.dev/v1
    kind: Volume
    metadata: { name: homarr-appdata, node: "{{ .Params.node }}" }
    spec: { name: homarr-appdata }
  - |
    apiVersion: wildstone.dev/v1
    kind: Container
    metadata: { name: homarr, node: "{{ .Params.node }}" }
    spec:
      image: "ghcr.io/homarr-labs/homarr@sha256:f23ad77a681b8a2d90a024a26699829176ff5c60bd54ecbc62d203ad4a2f175e"
      env:
        SECRET_ENCRYPTION_KEY: "secret/homarr-encryption-key"
        AUTH_SECRET: "secret/homarr-auth-secret"
        AUTH_URL: '{{ origin (printf "%s.%s" .Params.homarr_subdomain .Params.public_domain) }}'
        AUTH_TRUST_HOST: "true"
        AUTH_PROVIDERS: oidc
        AUTH_OIDC_ISSUER: "{{ .Resolved.IssuerURL }}"
        AUTH_OIDC_CLIENT_ID: homarr
        AUTH_OIDC_CLIENT_SECRET: "{{ .Resolved.OidcSecretRef }}"
        AUTH_OIDC_CLIENT_NAME: Authelia
        AUTH_OIDC_SCOPE_OVERWRITE: "openid email profile groups"
        AUTH_OIDC_GROUPS_ATTRIBUTE: groups
      mounts:
        - { source: homarr-appdata, target: /appdata }
      restart: unless-stopped
  - |
    apiVersion: wildstone.dev/v1
    kind: Route
    metadata: { name: homarr, node: "{{ .Params.node }}" }
    spec:
      host: "{{ .Params.homarr_subdomain }}.{{ .Params.public_domain }}"
      upstream: "container/homarr:7575"
      auth: app_oidc
      classification: family_public
  # The OidcClient lives on THIS package's node, not on a separate
  # identity node: the engine synthesises the client secret on the
  # OidcClient's node, the container reads the same reference on its
  # own node, and secrets are node-local — a split would leave the app
  # unable to materialise a secret that exists one machine over. Keystone
  # merges every node's OidcClients into the provider's clients file
  # regardless of where they are declared.
  - |
    apiVersion: wildstone.dev/v1
    kind: OidcClient
    metadata: { name: homarr, node: "{{ .Params.node }}" }
    spec:
      clientId: homarr
      clientName: Homarr
      redirectUris:
        - "https://{{ .Params.homarr_subdomain }}.{{ .Params.public_domain }}/api/auth/callback/oidc"
      scopes: [openid, profile, email, groups]
      idTokenClaims: [email, email_verified, name, preferred_username, groups]
      authPolicy: two_factor
      secretRef: "{{ .Resolved.OidcSecretRef }}"
