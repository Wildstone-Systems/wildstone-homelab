name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # gitleaks-action enumerates a PR's commits via the API on pull_request
  # events; without this it 403s ("Resource not accessible by integration").
  pull-requests: read

jobs:
  secrets-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go:
    name: go (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: gofmt
        run: test -z "$(gofmt -l ./proto ./wardstone ./keystone ./cli ./testing/e2e)"
      - name: vet
        run: |
          for m in proto wardstone keystone cli testing/e2e; do (cd "$m" && go vet ./...); done
      - name: build
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          for m in proto wardstone keystone cli testing/e2e; do (cd "$m" && go build ./...); done
      - name: test
        if: matrix.goarch == 'amd64'
        # -race: the product is concurrent (gateway, agent sessions,
        # reconciler, butler loop); the detector is the cheapest guard
        # against the data races those paths could grow. Requires cgo,
        # available on the amd64 runner.
        env:
          CGO_ENABLED: "1"
        run: |
          for m in proto wardstone keystone cli testing/e2e; do (cd "$m" && go test -race ./...); done
      - name: ts codegen drift (ADR-W007 A7)
        if: matrix.goarch == 'amd64'
        # The committed console/src/generated/resources.ts must match what
        # the generator emits from keystone/resource — the Console cannot
        # drift from the schema silently.
        run: |
          (cd keystone && go run ./resource/gen -out ../console/src/generated/resources.ts)
          git diff --exit-code console/src/generated/
